<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake Arena!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  height: 100vh;
  width: 100vw;
  background: #0a0a2e;
  touch-action: manipulation;
}
canvas { display: block; }

/* Start Screen */
#start-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 50%, #0a2a1a 100%);
}
#start-screen h1 {
  font-size: 48px; font-weight: 900;
  background: linear-gradient(135deg, #44ff44, #ffd93d, #ff4444);
  background-size: 300% 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: gradient 3s ease infinite;
  text-align: center; line-height: 1.3;
  margin-bottom: 15px;
}
@keyframes gradient { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
.subtitle { font-size: 20px; color: #88cc88; margin-bottom: 25px; text-align: center; }

.snake-preview {
  font-size: 60px; margin: 15px 0 25px;
  animation: snakeSlither 2s ease-in-out infinite;
}
@keyframes snakeSlither {
  0%, 100% { transform: translateX(-10px); }
  50% { transform: translateX(10px); }
}

#start-btn {
  font-size: 32px; font-weight: 800; padding: 16px 50px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #44ff44, #22aa22);
  color: #000; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(68,255,68,0.4);
  transition: transform 0.2s; animation: pulse 2s ease-in-out infinite;
}
#start-btn:hover { transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: none; justify-content: space-between; align-items: center;
  padding: 12px 15px; z-index: 10; pointer-events: none;
  background: rgba(0,0,0,0.3);
}
#hud .left, #hud .right { display: flex; align-items: center; gap: 15px; }
#hud .stat { text-align: center; }
#hud .stat-label { font-size: 11px; color: #888; }
#hud .stat-value { font-size: 18px; font-weight: 700; color: #44ff44; }
#hud .level { font-size: 16px; font-weight: 700; color: #ffd93d; }

/* Game Over */
#game-over {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(0,0,0,0.85);
}
#game-over h2 { font-size: 42px; font-weight: 900; color: #ff4444; margin-bottom: 10px; }
#game-over .score { font-size: 36px; color: #ffd93d; margin-bottom: 10px; }
#game-over .detail { font-size: 18px; color: #88cc88; margin-bottom: 25px; }
#retry-btn {
  font-size: 24px; font-weight: 800; padding: 14px 40px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #44ff44, #22aa22);
  color: #000; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(68,255,68,0.4); transition: transform 0.2s;
}
#retry-btn:hover { transform: scale(1.08); }

/* Level Up */
#level-up {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(0,0,0,0.85);
}
#level-up h2 { font-size: 48px; font-weight: 900; color: #ffd93d; margin-bottom: 10px; }
#level-up .detail { font-size: 20px; color: #88cc88; margin-bottom: 25px; }
#next-btn {
  font-size: 24px; font-weight: 800; padding: 14px 40px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ffd93d, #ffaa00);
  color: #000; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,215,0,0.4); transition: transform 0.2s;
}
#next-btn:hover { transform: scale(1.08); }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Snake Arena!</h1>
  <div class="subtitle">Eat circles to grow. Avoid bigger snakes!</div>
  <div class="snake-preview">🐍</div>
  <button id="start-btn">PLAY!</button>
</div>

<div id="hud">
  <div class="left">
    <div class="stat">
      <div class="stat-label">Length</div>
      <div class="stat-value" id="hud-length">3</div>
    </div>
    <div class="stat">
      <div class="stat-label">Eaten</div>
      <div class="stat-value" id="hud-eaten">0</div>
    </div>
  </div>
  <div class="level" id="hud-level">Level 1</div>
  <div class="right">
    <div class="stat">
      <div class="stat-label">Best</div>
      <div class="stat-value" id="hud-best">0</div>
    </div>
  </div>
</div>

<div id="game-over">
  <h2>GAME OVER!</h2>
  <div class="score" id="go-score">Length: 0</div>
  <div class="detail" id="go-detail">Eaten by a bigger snake!</div>
  <button id="retry-btn">TRY AGAIN</button>
</div>

<div id="level-up">
  <h2>LEVEL UP!</h2>
  <div class="detail" id="lu-detail">The arena gets more dangerous...</div>
  <button id="next-btn">NEXT LEVEL →</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// Game state
let gameRunning = false;
let level = 1;
let score = 0;
let bestLength = 0;
try { bestLength = parseInt(localStorage.getItem('snake_best') || '0'); } catch(e) {}

// Player snake
let player = {
  segments: [],
  dir: { x: 1, y: 0 },
  speed: 3,
  size: 12,
  color: '#44ff44',
  headColor: '#66ff66',
  alive: true
};

// AI snakes
let aiSnakes = [];

// Food circles
let food = [];

// Particles
let particles = [];

// Input
let touchStart = null;

function initGame() {
  player.segments = [];
  const startX = W * 0.5;
  const startY = H * 0.5;
  for (let i = 0; i < 3; i++) {
    player.segments.push({ x: startX - i * 20, y: startY });
  }
  player.dir = { x: 1, y: 0 };
  player.alive = true;
  player.speed = 3;
  
  aiSnakes = [];
  food = [];
  particles = [];
  score = 0;
  
  // Spawn AI snakes based on level
  const aiCount = Math.min(level, 8);
  for (let i = 0; i < aiCount; i++) {
    spawnAISnake();
  }
  
  // Spawn food
  for (let i = 0; i < 15 + level * 2; i++) {
    spawnFood();
  }
  
  updateHUD();
}

function spawnAISnake() {
  const size = 10 + Math.random() * 8;
  const length = 5 + Math.floor(Math.random() * (3 + level * 2));
  const speed = 1.5 + Math.random() * 1.5 + level * 0.2;
  
  // Random color (darker, menacing)
  const colors = ['#ff4444', '#ff8844', '#cc44ff', '#ff44aa', '#4488ff', '#ffff44'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  
  // Spawn at edge
  let x, y;
  if (Math.random() < 0.5) {
    x = Math.random() < 0.5 ? -50 : W + 50;
    y = Math.random() * H;
  } else {
    x = Math.random() * W;
    y = Math.random() < 0.5 ? -50 : H + 50;
  }
  
  const dir = { x: Math.random() - 0.5, y: Math.random() - 0.5 };
  const mag = Math.sqrt(dir.x * dir.x + dir.y * dir.y);
  dir.x /= mag;
  dir.y /= mag;
  
  const segments = [];
  for (let i = 0; i < length; i++) {
    segments.push({ x: x - dir.x * i * 20, y: y - dir.y * i * 20 });
  }
  
  aiSnakes.push({
    segments,
    dir,
    speed,
    size,
    color,
    headColor: color,
    turnTimer: 0,
    targetDir: { ...dir },
    alive: true
  });
}

function spawnFood() {
  food.push({
    x: 50 + Math.random() * (W - 100),
    y: 100 + Math.random() * (H - 150),
    size: 6 + Math.random() * 4,
    color: ['#ffdd44', '#ff8844', '#ff44aa', '#44ddff', '#aa44ff'][Math.floor(Math.random() * 5)],
    pulse: Math.random() * Math.PI * 2
  });
}

function updateHUD() {
  document.getElementById('hud-length').textContent = player.segments.length;
  document.getElementById('hud-eaten').textContent = score;
  document.getElementById('hud-level').textContent = `Level ${level}`;
  document.getElementById('hud-best').textContent = bestLength;
}

// Input handling
function handleInput(x, y) {
  if (!gameRunning) return;
  
  const head = player.segments[0];
  const dx = x - head.x;
  const dy = y - head.y;
  const mag = Math.sqrt(dx * dx + dy * dy);
  
  if (mag > 5) {
    player.dir = { x: dx / mag, y: dy / mag };
  }
}

canvas.addEventListener('mousedown', e => handleInput(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => {
  if (e.buttons > 0) handleInput(e.clientX, e.clientY);
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

// Game logic
function updatePlayer() {
  if (!player.alive) return;
  
  const head = player.segments[0];
  const newHead = {
    x: head.x + player.dir.x * player.speed,
    y: head.y + player.dir.y * player.speed
  };
  
  // Wrap around
  if (newHead.x < -20) newHead.x = W + 20;
  if (newHead.x > W + 20) newHead.x = -20;
  if (newHead.y < 60) newHead.y = H + 20;
  if (newHead.y > H + 20) newHead.y = 60;
  
  player.segments.unshift(newHead);
  player.segments.pop();
  
  // Check food collision
  for (let i = food.length - 1; i >= 0; i--) {
    const f = food[i];
    const dx = newHead.x - f.x;
    const dy = newHead.y - f.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist < player.size + f.size) {
      // Eat food - grow
      player.segments.push({ ...player.segments[player.segments.length - 1] });
      score++;
      
      // Particles
      for (let j = 0; j < 8; j++) {
        particles.push({
          x: f.x, y: f.y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: 3 + Math.random() * 3,
          life: 1,
          color: f.color
        });
      }
      
      food.splice(i, 1);
      spawnFood();
      
      // Check level up
      if (player.segments.length >= 10 + level * 5) {
        levelUp();
      }
    }
  }
  
  // Check AI snake collision
  for (const ai of aiSnakes) {
    if (!ai.alive) continue;
    
    for (const seg of ai.segments) {
      const dx = newHead.x - seg.x;
      const dy = newHead.y - seg.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < player.size + ai.size) {
        // Player hits AI snake
        if (ai.segments.length > player.segments.length) {
          // AI is bigger - player dies
          player.alive = false;
          gameOver();
          return;
        } else {
          // Player is bigger - eat the AI snake
          ai.alive = false;
          player.segments.push({ ...player.segments[player.segments.length - 1] });
          player.segments.push({ ...player.segments[player.segments.length - 1] });
          score += 5;
          
          // Particles
          for (let j = 0; j < 15; j++) {
            particles.push({
              x: seg.x, y: seg.y,
              vx: (Math.random() - 0.5) * 8,
              vy: (Math.random() - 0.5) * 8,
              size: 4 + Math.random() * 4,
              life: 1,
              color: ai.color
            });
          }
        }
      }
    }
  }
}

function updateAISnakes() {
  for (const ai of aiSnakes) {
    if (!ai.alive) continue;
    
    // AI behavior - chase player or wander
    ai.turnTimer++;
    if (ai.turnTimer > 30 + Math.random() * 60) {
      ai.turnTimer = 0;
      
      const head = ai.segments[0];
      const playerHead = player.segments[0];
      const dx = playerHead.x - head.x;
      const dy = playerHead.y - head.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < 300) {
        // Chase player
        ai.targetDir = { x: dx / dist, y: dy / dist };
      } else {
        // Wander
        ai.targetDir = {
          x: Math.random() - 0.5,
          y: Math.random() - 0.5
        };
        const mag = Math.sqrt(ai.targetDir.x * ai.targetDir.x + ai.targetDir.y * ai.targetDir.y);
        ai.targetDir.x /= mag;
        ai.targetDir.y /= mag;
      }
    }
    
    // Smooth turn toward target
    ai.dir.x += (ai.targetDir.x - ai.dir.x) * 0.1;
    ai.dir.y += (ai.targetDir.y - ai.dir.y) * 0.1;
    
    const mag = Math.sqrt(ai.dir.x * ai.dir.x + ai.dir.y * ai.dir.y);
    ai.dir.x /= mag;
    ai.dir.y /= mag;
    
    // Move
    const head = ai.segments[0];
    const newHead = {
      x: head.x + ai.dir.x * ai.speed,
      y: head.y + ai.dir.y * ai.speed
    };
    
    // Wrap around
    if (newHead.x < -50) newHead.x = W + 50;
    if (newHead.x > W + 50) newHead.x = -50;
    if (newHead.y < 30) newHead.y = H + 50;
    if (newHead.y > H + 50) newHead.y = 30;
    
    ai.segments.unshift(newHead);
    ai.segments.pop();
    
    // AI eats food too
    for (let i = food.length - 1; i >= 0; i--) {
      const f = food[i];
      const dx = newHead.x - f.x;
      const dy = newHead.y - f.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < ai.size + f.size) {
        ai.segments.push({ ...ai.segments[ai.segments.length - 1] });
        food.splice(i, 1);
        spawnFood();
      }
    }
  }
}

function levelUp() {
  gameRunning = false;
  
  if (player.segments.length > bestLength) {
    bestLength = player.segments.length;
    try { localStorage.setItem('snake_best', bestLength.toString()); } catch(e) {}
  }
  
  document.getElementById('lu-detail').textContent = `Length: ${player.segments.length} | More snakes incoming!`;
  document.getElementById('level-up').style.display = 'flex';
}

function gameOver() {
  gameRunning = false;
  
  if (player.segments.length > bestLength) {
    bestLength = player.segments.length;
    try { localStorage.setItem('snake_best', bestLength.toString()); } catch(e) {}
  }
  
  document.getElementById('go-score').textContent = `Length: ${player.segments.length}`;
  document.getElementById('go-detail').textContent = `Eaten by a bigger snake! Best: ${bestLength}`;
  document.getElementById('game-over').style.display = 'flex';
}

// Drawing
function drawBackground() {
  // Dark green grid
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(0, 0, W, H);
  
  // Grid lines
  ctx.strokeStyle = 'rgba(0, 255, 0, 0.05)';
  ctx.lineWidth = 1;
  const gridSize = 50;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function drawSnake(snake) {
  if (!snake.alive) return;
  
  const segments = snake.segments;
  
  // Draw body segments (back to front)
  for (let i = segments.length - 1; i >= 0; i--) {
    const seg = segments[i];
    const progress = i / segments.length;
    
    // Body gets slightly smaller toward tail
    const segSize = snake.size * (1 - progress * 0.3);
    
    // Color gradient
    ctx.fillStyle = i === 0 ? snake.headColor : snake.color;
    ctx.globalAlpha = 1 - progress * 0.3;
    
    // Draw segment
    ctx.beginPath();
    ctx.arc(seg.x, seg.y, segSize, 0, Math.PI * 2);
    ctx.fill();
    
    // Outline
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  
  ctx.globalAlpha = 1;
  
  // Draw eyes on head
  const head = segments[0];
  const eyeOffset = snake.size * 0.4;
  const eyeSize = snake.size * 0.3;
  
  // Eye positions based on direction
  const perpX = -snake.dir.y;
  const perpY = snake.dir.x;
  
  const eye1X = head.x + snake.dir.x * snake.size * 0.3 + perpX * eyeOffset;
  const eye1Y = head.y + snake.dir.y * snake.size * 0.3 + perpY * eyeOffset;
  const eye2X = head.x + snake.dir.x * snake.size * 0.3 - perpX * eyeOffset;
  const eye2Y = head.y + snake.dir.y * snake.size * 0.3 - perpY * eyeOffset;
  
  // Eye whites
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
  ctx.fill();
  
  // Pupils
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(eye1X + snake.dir.x * eyeSize * 0.3, eye1Y + snake.dir.y * eyeSize * 0.3, eyeSize * 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(eye2X + snake.dir.x * eyeSize * 0.3, eye2Y + snake.dir.y * eyeSize * 0.3, eyeSize * 0.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawFood() {
  for (const f of food) {
    f.pulse += 0.05;
    const pulseSize = f.size + Math.sin(f.pulse) * 2;
    
    // Glow
    ctx.fillStyle = f.color + '44';
    ctx.beginPath();
    ctx.arc(f.x, f.y, pulseSize + 5, 0, Math.PI * 2);
    ctx.fill();
    
    // Food
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.arc(f.x, f.y, pulseSize, 0, Math.PI * 2);
    ctx.fill();
    
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(f.x - pulseSize * 0.3, f.y - pulseSize * 0.3, pulseSize * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.02;
    
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawMinimap() {
  const mmW = 100;
  const mmH = 80;
  const mmX = W - mmW - 10;
  const mmY = H - mmH - 10;
  
  // Background
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(mmX, mmY, mmW, mmH);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.strokeRect(mmX, mmY, mmW, mmH);
  
  // Player dot
  const px = mmX + (player.segments[0].x / W) * mmW;
  const py = mmY + (player.segments[0].y / H) * mmH;
  ctx.fillStyle = player.color;
  ctx.beginPath();
  ctx.arc(px, py, 3, 0, Math.PI * 2);
  ctx.fill();
  
  // AI dots
  for (const ai of aiSnakes) {
    if (!ai.alive) continue;
    const ax = mmX + (ai.segments[0].x / W) * mmW;
    const ay = mmY + (ai.segments[0].y / H) * mmH;
    ctx.fillStyle = ai.color;
    ctx.beginPath();
    ctx.arc(ax, ay, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Game loop
function gameLoop() {
  if (!gameRunning) return;
  
  updatePlayer();
  updateAISnakes();
  
  drawBackground();
  drawFood();
  drawParticles();
  
  // Draw AI snakes
  for (const ai of aiSnakes) {
    drawSnake(ai);
  }
  
  // Draw player on top
  drawSnake(player);
  
  drawMinimap();
  
  updateHUD();
  
  requestAnimationFrame(gameLoop);
}

// Event listeners
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  level = 1;
  initGame();
  gameRunning = true;
  gameLoop();
});

document.getElementById('retry-btn').addEventListener('click', () => {
  document.getElementById('game-over').style.display = 'none';
  level = 1;
  initGame();
  gameRunning = true;
  gameLoop();
});

document.getElementById('next-btn').addEventListener('click', () => {
  document.getElementById('level-up').style.display = 'none';
  level++;
  initGame();
  gameRunning = true;
  gameLoop();
});
</script>
</body>
</html>
