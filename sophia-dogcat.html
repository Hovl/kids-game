<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake Arena!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  height: 100vh;
  width: 100vw;
  background: #0a0a2e;
  touch-action: manipulation;
}
canvas { display: block; }

#start-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 50%, #0a2a1a 100%);
}
#start-screen h1 {
  font-size: 48px; font-weight: 900;
  background: linear-gradient(135deg, #44ff44, #ffd93d, #ff4444);
  background-size: 300% 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: gradient 3s ease infinite;
  text-align: center; line-height: 1.3;
  margin-bottom: 15px;
}
@keyframes gradient { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
.subtitle { font-size: 18px; color: #88cc88; margin-bottom: 20px; text-align: center; max-width: 300px; line-height: 1.4; }
.snake-preview { font-size: 60px; margin: 15px 0 25px; animation: snakeSlither 2s ease-in-out infinite; }
@keyframes snakeSlither { 0%,100%{transform:translateX(-10px)} 50%{transform:translateX(10px)} }

#start-btn {
  font-size: 32px; font-weight: 800; padding: 16px 50px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #44ff44, #22aa22);
  color: #000; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(68,255,68,0.4);
  transition: transform 0.2s; animation: pulse 2s ease-in-out infinite;
}
#start-btn:hover { transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
.how-to { font-size: 14px; color: #666; margin-top: 20px; text-align: center; max-width: 300px; line-height: 1.4; }

#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: none; justify-content: space-between; align-items: center;
  padding: 10px 15px; z-index: 10; pointer-events: none;
  background: rgba(0,0,0,0.4);
}
#hud .left, #hud .right { display: flex; align-items: center; gap: 15px; }
#hud .stat { text-align: center; }
#hud .stat-label { font-size: 10px; color: #888; }
#hud .stat-value { font-size: 18px; font-weight: 700; color: #44ff44; }
#hud .level { font-size: 16px; font-weight: 700; color: #ffd93d; }
#hud .size-bar { width: 80px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
#hud .size-fill { height: 100%; background: #44ff44; border-radius: 4px; transition: width 0.3s; }

/* Power-up indicator */
#powerup-display {
  position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 18px; font-weight: 700; color: #ffd93d;
  text-shadow: 0 0 10px rgba(255,215,0,0.5);
  z-index: 10; pointer-events: none;
  opacity: 0; transition: opacity 0.3s;
}
#powerup-display.show { opacity: 1; }

#boost {
  position: fixed; bottom: 15px; right: 15px; z-index: 10;
  font-size: 14px; color: #888; pointer-events: none;
}
#boost .bar { width: 60px; height: 6px; background: #333; border-radius: 3px; margin-top: 3px; overflow: hidden; }
#boost .fill { height: 100%; background: #4488ff; border-radius: 3px; transition: width 0.1s; }

#game-over {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(0,0,0,0.85);
}
#game-over h2 { font-size: 42px; font-weight: 900; color: #ff4444; margin-bottom: 10px; }
#game-over .score { font-size: 36px; color: #ffd93d; margin-bottom: 10px; }
#game-over .detail { font-size: 18px; color: #88cc88; margin-bottom: 25px; text-align: center; padding: 0 20px; }
#retry-btn {
  font-size: 24px; font-weight: 800; padding: 14px 40px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #44ff44, #22aa22);
  color: #000; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(68,255,68,0.4); transition: transform 0.2s;
}
#retry-btn:hover { transform: scale(1.08); }

#level-up {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(0,0,0,0.85);
}
#level-up h2 { font-size: 48px; font-weight: 900; color: #ffd93d; margin-bottom: 10px; }
#level-up .detail { font-size: 20px; color: #88cc88; margin-bottom: 25px; }
#next-btn {
  font-size: 24px; font-weight: 800; padding: 14px 40px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ffd93d, #ffaa00);
  color: #000; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,215,0,0.4); transition: transform 0.2s;
}
#next-btn:hover { transform: scale(1.08); }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Snake Arena!</h1>
  <div class="subtitle">Eat circles to grow. Find power-ups for surprises!</div>
  <div class="snake-preview">🐍</div>
  <button id="start-btn">PLAY!</button>
  <div class="how-to">Tap/drag to move • Two fingers to boost</div>
</div>

<div id="hud">
  <div class="left">
    <div class="stat">
      <div class="stat-label">You</div>
      <div class="stat-value" id="hud-length">3</div>
    </div>
    <div class="size-bar"><div class="size-fill" id="hud-size-fill"></div></div>
  </div>
  <div class="level" id="hud-level">Level 1</div>
  <div class="right">
    <div class="stat">
      <div class="stat-label">Best</div>
      <div class="stat-value" id="hud-best">0</div>
    </div>
  </div>
</div>

<div id="powerup-display"></div>
<div id="boost">⚡ Boost<div class="bar"><div class="fill" id="boost-fill"></div></div></div>

<div id="game-over">
  <h2>GAME OVER!</h2>
  <div class="score" id="go-score">Length: 0</div>
  <div class="detail" id="go-detail"></div>
  <button id="retry-btn">TRY AGAIN</button>
</div>

<div id="level-up">
  <h2 id="lu-title">LEVEL UP!</h2>
  <div class="detail" id="lu-detail"></div>
  <button id="next-btn">NEXT LEVEL →</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let gameRunning = false;
let level = 1;
let score = 0;
let bestLength = 0;
try { bestLength = parseInt(localStorage.getItem('snake_best') || '0'); } catch(e) {}

let player = {
  segments: [], dir: { x: 1, y: 0 }, speed: 4, size: 12,
  color: '#44ff44', headColor: '#66ff66', alive: true,
  boost: 100, boosting: false,
  invincible: 0, speedBoost: 0, magnet: 0, freeze: 0, rainbow: 0
};

let aiSnakes = [];
let food = [];
let powerups = [];
let particles = [];
let confetti = [];
let screenFlash = 0;
let screenFlashColor = '#fff';

let inputDir = { x: 1, y: 0 };
let twoFinger = false;
let powerupTimer = 0;

function getLevelTarget(lvl) { return 8 + lvl * 4; }

// Power-up types
const POWERUP_TYPES = [
  { emoji: '🛡️', name: 'SHIELD!', desc: 'Invincible for 5 seconds!', color: '#4488ff', duration: 300, effect: 'invincible' },
  { emoji: '⚡', name: 'SPEED BOOST!', desc: 'Super fast for 5 seconds!', color: '#ffdd44', duration: 300, effect: 'speedBoost' },
  { emoji: '🧲', name: 'MAGNET!', desc: 'Food comes to you!', color: '#ff44aa', duration: 300, effect: 'magnet' },
  { emoji: '❄️', name: 'FREEZE!', desc: 'All enemies freeze!', color: '#44ddff', duration: 240, effect: 'freeze' },
  { emoji: '🌟', name: 'STAR POWER!', desc: 'Invincible + Fast + Magnet!', color: '#ffd700', duration: 360, effect: 'rainbow' },
  { emoji: '💎', name: 'GROW x3!', desc: 'Instant growth!', color: '#cc44ff', duration: 0, effect: 'grow' },
];

function initGame() {
  player.segments = [];
  for (let i = 0; i < 3; i++) {
    player.segments.push({ x: W * 0.5 - i * 18, y: H * 0.5 });
  }
  player.dir = { x: 1, y: 0 };
  player.alive = true;
  player.speed = 4;
  player.boost = 100;
  player.boosting = false;
  player.invincible = 0;
  player.speedBoost = 0;
  player.magnet = 0;
  player.freeze = 0;
  player.rainbow = 0;
  
  aiSnakes = [];
  food = [];
  powerups = [];
  particles = [];
  confetti = [];
  screenFlash = 0;
  powerupTimer = 0;
  score = 0;
  
  const aiCount = Math.min(2 + level, 10);
  for (let i = 0; i < aiCount; i++) spawnAISnake();
  for (let i = 0; i < 20 + level * 3; i++) spawnFood();
  
  updateHUD();
}

function spawnAISnake() {
  const size = 10 + Math.random() * 6;
  const isBig = Math.random() < (0.3 + level * 0.05);
  const length = isBig ? getLevelTarget(level) + Math.floor(Math.random() * 10) : 3 + Math.floor(Math.random() * 5);
  const speed = isBig ? 1.5 + Math.random() * 1 : 2 + Math.random() * 1.5;
  const colors = ['#ff4444', '#ff6644', '#cc44ff', '#ff44aa', '#4488ff', '#ffaa44'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  
  let x, y;
  do {
    x = Math.random() * W;
    y = 100 + Math.random() * (H - 150);
  } while (Math.abs(x - W/2) < 200 && Math.abs(y - H/2) < 200);
  
  const dir = { x: Math.random() - 0.5, y: Math.random() - 0.5 };
  const mag = Math.sqrt(dir.x * dir.x + dir.y * dir.y);
  dir.x /= mag; dir.y /= mag;
  
  const segments = [];
  for (let i = 0; i < length; i++) segments.push({ x: x - dir.x * i * 16, y: y - dir.y * i * 16 });
  
  aiSnakes.push({ segments, dir, speed, size, color, headColor: color, turnTimer: 0, targetDir: { ...dir }, alive: true, isBig });
}

function spawnFood() {
  food.push({
    x: 30 + Math.random() * (W - 60), y: 80 + Math.random() * (H - 120),
    size: 5 + Math.random() * 4,
    color: ['#ffdd44', '#ff8844', '#ff44aa', '#44ddff', '#aa44ff', '#44ff44'][Math.floor(Math.random() * 6)],
    pulse: Math.random() * Math.PI * 2, golden: false
  });
}

function spawnGoldenFood() {
  food.push({
    x: 50 + Math.random() * (W - 100), y: 100 + Math.random() * (H - 150),
    size: 10, color: '#ffd700', pulse: 0, golden: true
  });
}

function spawnPowerup() {
  const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
  powerups.push({
    x: 50 + Math.random() * (W - 100), y: 100 + Math.random() * (H - 150),
    size: 14, type, pulse: 0, life: 600
  });
}

function showPowerupText(emoji, name, desc) {
  const el = document.getElementById('powerup-display');
  el.innerHTML = `${emoji} ${name}<br><span style="font-size:14px;color:#aaa">${desc}</span>`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function spawnConfetti(x, y, count, colors) {
  for (let i = 0; i < count; i++) {
    confetti.push({
      x, y,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12 - 5,
      size: 4 + Math.random() * 6,
      life: 1,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.3
    });
  }
}

function spawnParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      size: 3 + Math.random() * 4,
      life: 1,
      color
    });
  }
}

function updateHUD() {
  document.getElementById('hud-length').textContent = player.segments.length;
  document.getElementById('hud-level').textContent = `Level ${level}`;
  document.getElementById('hud-best').textContent = bestLength;
  const pct = Math.min(100, (player.segments.length / getLevelTarget(level)) * 100);
  document.getElementById('hud-size-fill').style.width = pct + '%';
  document.getElementById('boost-fill').style.width = player.boost + '%';
}

function handleInput(x, y) {
  if (!gameRunning) return;
  const head = player.segments[0];
  const dx = x - head.x;
  const dy = y - head.y;
  const mag = Math.sqrt(dx * dx + dy * dy);
  if (mag > 10) inputDir = { x: dx / mag, y: dy / mag };
}

canvas.addEventListener('mousedown', e => handleInput(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => { if (e.buttons > 0) handleInput(e.clientX, e.clientY); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); twoFinger = e.touches.length >= 2; handleInput(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); twoFinger = e.touches.length >= 2; handleInput(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchend', e => { twoFinger = e.touches.length >= 2; });
document.addEventListener('keydown', e => { if (e.code === 'Space') player.boosting = true; });
document.addEventListener('keyup', e => { if (e.code === 'Space') player.boosting = false; });

function updatePlayer() {
  if (!player.alive) return;
  
  // Decrease power-up timers
  if (player.invincible > 0) player.invincible--;
  if (player.speedBoost > 0) player.speedBoost--;
  if (player.magnet > 0) player.magnet--;
  if (player.freeze > 0) player.freeze--;
  if (player.rainbow > 0) player.rainbow--;
  
  // Direction
  player.dir.x += (inputDir.x - player.dir.x) * 0.15;
  player.dir.y += (inputDir.y - player.dir.y) * 0.15;
  const mag = Math.sqrt(player.dir.x * player.dir.x + player.dir.y * player.dir.y);
  player.dir.x /= mag; player.dir.y /= mag;
  
  // Speed
  let currentSpeed = player.speed;
  if (player.speedBoost > 0 || player.rainbow > 0) currentSpeed *= 1.5;
  player.boosting = twoFinger || (player.boosting && player.boost > 0);
  if (player.boosting) { currentSpeed *= 1.6; player.boost = Math.max(0, player.boost - 0.5); }
  else { player.boost = Math.min(100, player.boost + 0.2); }
  
  // Move
  const head = player.segments[0];
  const newHead = { x: head.x + player.dir.x * currentSpeed, y: head.y + player.dir.y * currentSpeed };
  if (newHead.x < -20) newHead.x = W + 20;
  if (newHead.x > W + 20) newHead.x = -20;
  if (newHead.y < 40) newHead.y = H + 20;
  if (newHead.y > H + 20) newHead.y = 40;
  
  player.segments.unshift(newHead);
  player.segments.pop();
  
  // Magnet effect - attract food
  if (player.magnet > 0 || player.rainbow > 0) {
    for (const f of food) {
      const dx = newHead.x - f.x;
      const dy = newHead.y - f.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        f.x += (dx / dist) * 3;
        f.y += (dy / dist) * 3;
      }
    }
  }
  
  // Eat food
  for (let i = food.length - 1; i >= 0; i--) {
    const f = food[i];
    const dx = newHead.x - f.x;
    const dy = newHead.y - f.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist < player.size + f.size) {
      const growth = f.golden ? 5 : 1;
      for (let g = 0; g < growth; g++) player.segments.push({ ...player.segments[player.segments.length - 1] });
      score += f.golden ? 10 : 1;
      
      if (f.golden) {
        screenFlash = 20;
        screenFlashColor = '#ffd700';
        spawnConfetti(f.x, f.y, 30, ['#ffd700', '#ffaa00', '#fff']);
        showPowerupText('💎', 'GOLDEN FOOD!', '+5 length!');
      }
      
      spawnParticles(f.x, f.y, 6, f.color);
      food.splice(i, 1);
      spawnFood();
    }
  }
  
  // Eat power-ups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    const dx = newHead.x - p.x;
    const dy = newHead.y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist < player.size + p.size) {
      const t = p.type;
      
      if (t.effect === 'grow') {
        for (let g = 0; g < 8; g++) player.segments.push({ ...player.segments[player.segments.length - 1] });
      } else {
        player[t.effect] = t.duration;
      }
      
      showPowerupText(t.emoji, t.name, t.desc);
      screenFlash = 15;
      screenFlashColor = t.color;
      spawnConfetti(p.x, p.y, 25, [t.color, '#fff', '#ffd700']);
      
      powerups.splice(i, 1);
    }
  }
  
  // AI collision
  for (const ai of aiSnakes) {
    if (!ai.alive) continue;
    
    for (const seg of ai.segments) {
      const dx = newHead.x - seg.x;
      const dy = newHead.y - seg.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < player.size + ai.size) {
        if (player.invincible > 0 || player.rainbow > 0) {
          // Invincible - eat them!
          ai.alive = false;
          for (let g = 0; g < 3; g++) player.segments.push({ ...player.segments[player.segments.length - 1] });
          score += 5;
          spawnConfetti(seg.x, seg.y, 20, [ai.color, '#fff']);
          break;
        } else if (ai.segments.length > player.segments.length) {
          player.alive = false;
          gameOver();
          return;
        } else {
          ai.alive = false;
          for (let g = 0; g < 3; g++) player.segments.push({ ...player.segments[player.segments.length - 1] });
          score += 5;
          spawnConfetti(seg.x, seg.y, 20, [ai.color, '#fff', '#ffd700']);
          break;
        }
      }
    }
  }
  
  if (player.segments.length >= getLevelTarget(level)) levelUp();
}

function updateAI() {
  for (const ai of aiSnakes) {
    if (!ai.alive) continue;
    if (player.freeze > 0 || player.rainbow > 0) continue; // Frozen!
    
    const head = ai.segments[0];
    const ph = player.segments[0];
    const dx = ph.x - head.x;
    const dy = ph.y - head.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    ai.turnTimer++;
    if (ai.turnTimer > 40 + Math.random() * 40) {
      ai.turnTimer = 0;
      if (dist < (ai.isBig ? 400 : 250)) ai.targetDir = { x: dx / dist, y: dy / dist };
      else { ai.targetDir = { x: Math.random() - 0.5, y: Math.random() - 0.5 }; const m = Math.sqrt(ai.targetDir.x ** 2 + ai.targetDir.y ** 2); ai.targetDir.x /= m; ai.targetDir.y /= m; }
    }
    
    ai.dir.x += (ai.targetDir.x - ai.dir.x) * 0.08;
    ai.dir.y += (ai.targetDir.y - ai.dir.y) * 0.08;
    const m = Math.sqrt(ai.dir.x ** 2 + ai.dir.y ** 2);
    ai.dir.x /= m; ai.dir.y /= m;
    
    const nh = { x: head.x + ai.dir.x * ai.speed, y: head.y + ai.dir.y * ai.speed };
    if (nh.x < -50) nh.x = W + 50; if (nh.x > W + 50) nh.x = -50;
    if (nh.y < 20) nh.y = H + 50; if (nh.y > H + 50) nh.y = 20;
    ai.segments.unshift(nh);
    ai.segments.pop();
    
    for (let i = food.length - 1; i >= 0; i--) {
      const f = food[i];
      const fdx = nh.x - f.x; const fdy = nh.y - f.y;
      if (Math.sqrt(fdx * fdx + fdy * fdy) < ai.size + f.size) {
        ai.segments.push({ ...ai.segments[ai.segments.length - 1] });
        food.splice(i, 1); spawnFood();
      }
    }
  }
}

function levelUp() {
  gameRunning = false;
  if (player.segments.length > bestLength) { bestLength = player.segments.length; try { localStorage.setItem('snake_best', bestLength.toString()); } catch(e) {} }
  spawnConfetti(W/2, H/2, 50, ['#ffd700', '#ff4444', '#44ff44', '#4488ff', '#ff44aa']);
  screenFlash = 30; screenFlashColor = '#ffd700';
  document.getElementById('lu-title').textContent = `LEVEL ${level} COMPLETE!`;
  document.getElementById('lu-detail').textContent = `Length: ${player.segments.length} | Bigger snakes ahead!`;
  setTimeout(() => { document.getElementById('level-up').style.display = 'flex'; }, 500);
}

function gameOver() {
  gameRunning = false;
  if (player.segments.length > bestLength) { bestLength = player.segments.length; try { localStorage.setItem('snake_best', bestLength.toString()); } catch(e) {} }
  document.getElementById('go-score').textContent = `Length: ${player.segments.length}`;
  document.getElementById('go-detail').textContent = `Eaten by a bigger snake! Best: ${bestLength}`;
  document.getElementById('game-over').style.display = 'flex';
}

// Drawing
function drawBackground() {
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(0,255,0,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  
  // Screen flash
  if (screenFlash > 0) {
    ctx.globalAlpha = screenFlash / 30 * 0.3;
    ctx.fillStyle = screenFlashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    screenFlash--;
  }
}

function drawSnake(snake) {
  if (!snake.alive) return;
  const segs = snake.segments;
  
  for (let i = segs.length - 1; i >= 0; i--) {
    const seg = segs[i];
    const progress = i / segs.length;
    const segSize = snake.size * (1 - progress * 0.25);
    
    // Rainbow effect for player power-ups
    if (snake === player && (player.rainbow > 0 || player.invincible > 0)) {
      const hue = (Date.now() * 0.5 + i * 20) % 360;
      ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
    } else if (snake === player && player.speedBoost > 0) {
      ctx.fillStyle = '#ffdd44';
    } else {
      ctx.fillStyle = i === 0 ? snake.headColor : snake.color;
    }
    
    ctx.globalAlpha = 1 - progress * 0.2;
    ctx.beginPath();
    ctx.arc(seg.x, seg.y, segSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  
  // Eyes
  const head = segs[0];
  const eo = snake.size * 0.35;
  const es = snake.size * 0.25;
  const px = -snake.dir.y, py = snake.dir.x;
  const e1x = head.x + snake.dir.x * snake.size * 0.25 + px * eo;
  const e1y = head.y + snake.dir.y * snake.size * 0.25 + py * eo;
  const e2x = head.x + snake.dir.x * snake.size * 0.25 - px * eo;
  const e2y = head.y + snake.dir.y * snake.size * 0.25 - py * eo;
  
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(e1x, e1y, es, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(e2x, e2y, es, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(e1x + snake.dir.x * es * 0.3, e1y + snake.dir.y * es * 0.3, es * 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(e2x + snake.dir.x * es * 0.3, e2y + snake.dir.y * es * 0.3, es * 0.5, 0, Math.PI * 2); ctx.fill();
  
  // Size label for AI
  if (snake !== player) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(segs.length, head.x, head.y - snake.size - 5);
  }
  
  // Freeze indicator
  if (player.freeze > 0 && snake !== player) {
    ctx.fillStyle = 'rgba(100,200,255,0.3)';
    ctx.beginPath(); ctx.arc(head.x, head.y, snake.size + 5, 0, Math.PI * 2); ctx.fill();
  }
}

function drawFood() {
  for (const f of food) {
    f.pulse += f.golden ? 0.08 : 0.04;
    const ps = f.size + Math.sin(f.pulse) * (f.golden ? 3 : 1.5);
    
    // Golden glow
    if (f.golden) {
      ctx.fillStyle = 'rgba(255,215,0,0.3)';
      ctx.beginPath(); ctx.arc(f.x, f.y, ps + 10, 0, Math.PI * 2); ctx.fill();
      // Sparkle
      if (Math.random() < 0.1) spawnParticles(f.x, f.y, 1, '#ffd700');
    }
    
    ctx.fillStyle = f.color + '44';
    ctx.beginPath(); ctx.arc(f.x, f.y, ps + 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.arc(f.x, f.y, ps, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(f.x - ps * 0.3, f.y - ps * 0.3, ps * 0.25, 0, Math.PI * 2); ctx.fill();
    
    if (f.golden) {
      ctx.font = `${ps * 1.5}px Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('⭐', f.x, f.y);
    }
  }
}

function drawPowerups() {
  for (const p of powerups) {
    p.pulse += 0.06;
    p.life--;
    if (p.life <= 0) continue;
    
    // Glow
    ctx.fillStyle = p.type.color + '33';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size + 8 + Math.sin(p.pulse) * 3, 0, Math.PI * 2); ctx.fill();
    
    // Rotating ring
    ctx.strokeStyle = p.type.color + '88';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size + 5, p.pulse, p.pulse + Math.PI * 1.5);
    ctx.stroke();
    
    // Emoji
    ctx.font = `${p.size * 1.5}px Arial`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.type.emoji, p.x, p.y);
  }
  // Remove expired
  powerups = powerups.filter(p => p.life > 0);
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawConfetti() {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.x += c.vx; c.y += c.vy; c.vy += 0.15; c.rotation += c.rotSpeed; c.life -= 0.012;
    if (c.life <= 0) { confetti.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rotation);
    ctx.globalAlpha = c.life;
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

function drawMinimap() {
  const mw = 90, mh = 70, mx = W - mw - 10, my = H - mh - 10;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.strokeRect(mx, my, mw, mh);
  
  ctx.fillStyle = '#44ff44';
  ctx.beginPath(); ctx.arc(mx + (player.segments[0].x / W) * mw, my + (player.segments[0].y / H) * mh, 3, 0, Math.PI * 2); ctx.fill();
  
  for (const ai of aiSnakes) {
    if (!ai.alive) continue;
    ctx.fillStyle = ai.color;
    ctx.beginPath(); ctx.arc(mx + (ai.segments[0].x / W) * mw, my + (ai.segments[0].y / H) * mh, 2, 0, Math.PI * 2); ctx.fill();
  }
}

// Game loop
function gameLoop() {
  if (!gameRunning) return;
  
  // Spawn power-ups randomly
  powerupTimer++;
  if (powerupTimer > 300 + Math.random() * 300) {
    powerupTimer = 0;
    if (powerups.length < 2) spawnPowerup();
  }
  
  // Rare golden food
  if (Math.random() < 0.001 && food.filter(f => f.golden).length < 1) {
    spawnGoldenFood();
  }
  
  updatePlayer();
  updateAI();
  
  drawBackground();
  drawFood();
  drawPowerups();
  drawParticles();
  drawConfetti();
  
  for (const ai of aiSnakes) drawSnake(ai);
  drawSnake(player);
  
  drawMinimap();
  updateHUD();
  
  requestAnimationFrame(gameLoop);
}

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  level = 1; initGame(); gameRunning = true; gameLoop();
});

document.getElementById('retry-btn').addEventListener('click', () => {
  document.getElementById('game-over').style.display = 'none';
  level = 1; initGame(); gameRunning = true; gameLoop();
});

document.getElementById('next-btn').addEventListener('click', () => {
  document.getElementById('level-up').style.display = 'none';
  level++; initGame(); gameRunning = true; gameLoop();
});
</script>
