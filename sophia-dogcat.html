<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animal Mix!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  height: 100vh;
  width: 100vw;
  background: #1a1a4e;
  touch-action: manipulation;
}
canvas { display: block; }

/* Start Screen */
#start-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #2d1b69 0%, #1a0533 50%, #0a001a 100%);
}
#start-screen h1 {
  font-size: 48px; font-weight: 900;
  background: linear-gradient(135deg, #ff6b9d, #ffd93d, #6bcb77, #4d96ff);
  background-size: 300% 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: gradient 3s ease infinite;
  text-align: center; line-height: 1.3;
  margin-bottom: 15px;
}
@keyframes gradient { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
.subtitle { font-size: 20px; color: #b088d0; margin-bottom: 25px; text-align: center; }
.hero-display {
  font-size: 80px; margin: 10px 0 20px;
  animation: heroBounce 2s ease-in-out infinite;
}
@keyframes heroBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

#start-btn {
  font-size: 32px; font-weight: 800; padding: 16px 50px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff8e53);
  color: white; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4);
  transition: transform 0.2s; animation: pulse 2s ease-in-out infinite;
}
#start-btn:hover { transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: none; flex-direction: column; align-items: center;
  padding: 12px 15px; z-index: 10; pointer-events: none;
}
#hud .level { font-size: 20px; font-weight: 700; color: #ffd93d; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
#hud .score { font-size: 16px; color: #b088d0; margin-top: 3px; }

/* Merge popup */
#merge-popup {
  position: fixed; inset: 0;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  z-index: 200;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(10px);
}
#merge-popup.show { display: flex; }

#merge-popup h2 {
  font-size: 36px; font-weight: 900; color: #ffd93d;
  text-shadow: 0 0 30px rgba(255,215,0,0.5);
  margin-bottom: 10px;
}
#merge-popup .merge-animals {
  font-size: 70px; margin: 15px 0;
  display: flex; align-items: center; gap: 15px;
}
#merge-popup .plus { font-size: 40px; color: #fff; }
#merge-popup .equals { font-size: 40px; color: #ffd93d; }
#merge-popup .result-emoji { font-size: 90px; animation: resultPop 0.5s ease; }
@keyframes resultPop {
  0% { transform: scale(0) rotate(-20deg); }
  60% { transform: scale(1.2) rotate(5deg); }
  100% { transform: scale(1) rotate(0); }
}
#merge-popup .animal-name {
  font-size: 28px; font-weight: 900; color: #fff;
  margin: 10px 0 5px;
}
#merge-popup .animal-desc {
  font-size: 16px; color: #b088d0;
  margin-bottom: 25px; text-align: center;
  max-width: 300px;
  line-height: 1.4;
}
#merge-popup .next-btn {
  font-size: 22px; font-weight: 700; padding: 12px 35px; border: none;
  border-radius: 30px; background: linear-gradient(135deg, #6bcb77, #4d96ff);
  color: #fff; cursor: pointer; pointer-events: auto;
  box-shadow: 0 6px 20px rgba(107,203,119,0.4);
  transition: transform 0.2s;
}
#merge-popup .next-btn:hover { transform: scale(1.05); }

/* Collection */
#collection-btn {
  position: fixed; bottom: 15px; left: 15px; z-index: 15;
  font-size: 18px; font-weight: 700; padding: 10px 20px;
  border: 2px solid rgba(255,255,255,0.3); border-radius: 25px;
  background: rgba(255,255,255,0.1); color: #fff;
  cursor: pointer; pointer-events: auto;
  backdrop-filter: blur(5px); transition: all 0.2s;
  display: none;
}
#collection-btn:hover { background: rgba(255,255,255,0.2); }

#collection {
  position: fixed; inset: 0;
  display: none; flex-direction: column; align-items: center;
  z-index: 150;
  background: rgba(0,0,0,0.9);
  padding: 40px 20px;
  overflow-y: auto;
}
#collection.show { display: flex; }
#collection h2 {
  font-size: 32px; font-weight: 900; color: #ffd93d;
  margin-bottom: 20px;
}
#collection .grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 15px; width: 100%; max-width: 500px;
}
#collection .card {
  background: rgba(255,255,255,0.1);
  border-radius: 15px; padding: 12px;
  text-align: center;
}
#collection .card.locked { opacity: 0.3; }
#collection .card .emoji { font-size: 40px; }
#collection .card .name { font-size: 12px; color: #fff; margin-top: 5px; }
#collection .close-btn {
  font-size: 18px; font-weight: 700; padding: 10px 25px; margin-top: 20px;
  border: 2px solid rgba(255,255,255,0.3); border-radius: 25px;
  background: rgba(255,255,255,0.1); color: #fff;
  cursor: pointer; pointer-events: auto;
}

/* Instructions */
#instructions {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
  font-size: 16px; color: rgba(255,255,255,0.6);
  z-index: 10; pointer-events: none;
  text-align: center;
  animation: fadeInOut 3s ease infinite;
}
@keyframes fadeInOut {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}
</style>
</head>
<body>

<div id="start-screen">
  <h1>Animal Mix!</h1>
  <div class="hero-display">🐶🐱</div>
  <div class="subtitle">Catch animals to mix them!</div>
  <button id="start-btn">PLAY!</button>
</div>

<div id="hud">
  <div class="level" id="hud-level">Level 1</div>
  <div class="score" id="hud-score">Mixed: 0 animals</div>
</div>

<div id="merge-popup">
  <h2>NEW ANIMAL!</h2>
  <div class="merge-animals">
    <span id="merge-emoji-1">🐶</span>
    <span class="plus">+</span>
    <span id="merge-emoji-2">🐱</span>
    <span class="equals">=</span>
    <span class="result-emoji" id="merge-result">🦁</span>
  </div>
  <div class="animal-name" id="merge-name">Liger</div>
  <div class="animal-desc" id="merge-desc">King of the jungle!</div>
  <button class="next-btn" id="merge-next">NEXT LEVEL →</button>
</div>

<button id="collection-btn">📖 Collection</button>

<div id="collection">
  <h2>📖 My Animals</h2>
  <div class="grid" id="collection-grid"></div>
  <button class="close-btn" id="collection-close">CLOSE</button>
</div>

<canvas id="canvas"></canvas>

<div id="instructions">Tap anywhere to move!</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// Game state
let gameRunning = false;
let level = 1;
let score = 0;
let totalMixed = 0;

// Characters
let chaser = { x: 0, y: 0, targetX: 0, targetY: 0, vx: 0, vy: 0, size: 30 };
let target = { x: 0, y: 0, vx: 0, vy: 0, size: 25, dirChangeTimer: 0 };
let merged = null;

// Visual effects
let particles = [];
let sparkles = [];
let trails = [];

// Collection
let collection = new Set();
try { 
  const saved = localStorage.getItem('animalmix_collection');
  if (saved) collection = new Set(JSON.parse(saved));
} catch(e) {}

// Level progression
const LEVELS = [
  { chaser: '🐶', target: '🐱', result: '🦁', name: 'Liger', desc: 'Half lion, half tiger! King of the jungle with stripes!', bg: '#2d1b69' },
  { chaser: '🦁', target: '🦖', result: '🦈', name: 'Mega Shark', desc: 'A giant shark-whale hybrid! Rules the ocean!', bg: '#0a2a4a' },
  { chaser: '🦈', target: '🐋', result: '🐉', name: 'Dragon', desc: 'A fire-breathing dragon! Flies through clouds!', bg: '#1a0533' },
  { chaser: '🐉', target: '🦅', result: '🦄', name: 'Unicorn', desc: 'A magical unicorn with a rainbow horn!', bg: '#2d1b69' },
  { chaser: '🦄', target: '🌈', result: '🐧', name: 'Ice Penguin', desc: 'A super-fast penguin that slides on rainbows!', bg: '#0a3a5a' },
  { chaser: '🐧', target: '❄️', result: '🦊', name: 'Arctic Fox', desc: 'A fluffy white fox that loves snow!', bg: '#1a2a4a' },
  { chaser: '🦊', target: '🌟', result: '🐻', name: 'Star Bear', desc: 'A bear that glows like the night sky!', bg: '#0a0a3e' },
  { chaser: '🐻', target: '🍯', result: '🐝', name: 'Queen Bee', desc: 'The biggest, happiest bee ever!', bg: '#2d1b69' },
  { chaser: '🐝', target: '🌻', result: '🦋', name: 'Rainbow Butterfly', desc: 'A butterfly with wings of every color!', bg: '#1a0533' },
  { chaser: '🦋', target: '🌺', result: '🐬', name: 'Magic Dolphin', desc: 'A dolphin that can fly and swim!', bg: '#0a2a4a' },
  { chaser: '🐬', target: '🌊', result: '🐨', name: 'Cloud Koala', desc: 'A koala that sleeps on clouds!', bg: '#2d1b69' },
  { chaser: '🐨', target: '🍃', result: '🐰', name: 'Super Bunny', desc: 'The fastest bunny with magic ears!', bg: '#1a0533' },
];

function getLevel(lvl) {
  return LEVELS[(lvl - 1) % LEVELS.length];
}

function initLevel() {
  merged = null;
  const lvl = getLevel(level);
  
  // Update background color
  document.body.style.background = lvl.bg;
  
  // Chaser starts at bottom
  chaser.x = W * 0.5;
  chaser.y = H * 0.8;
  chaser.targetX = chaser.x;
  chaser.targetY = chaser.y;
  chaser.vx = 0;
  chaser.vy = 0;
  chaser.emoji = lvl.chaser;
  
  // Target starts at top, moves randomly
  target.x = W * 0.3 + Math.random() * W * 0.4;
  target.y = H * 0.2;
  target.vx = (Math.random() - 0.5) * 3;
  target.vy = (Math.random() - 0.5) * 2;
  target.dirChangeTimer = 0;
  target.emoji = lvl.target;
  
  particles = [];
  sparkles = [];
  trails = [];
  
  updateHUD();
}

function updateHUD() {
  document.getElementById('hud-level').textContent = `Level ${level}`;
  document.getElementById('hud-score').textContent = `Mixed: ${totalMixed} animals`;
}

// Input
function handleTap(x, y) {
  if (!gameRunning) return;
  chaser.targetX = x;
  chaser.targetY = y;
}

canvas.addEventListener('mousedown', e => handleTap(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  handleTap(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

// Physics
function updateChaser() {
  const dx = chaser.targetX - chaser.x;
  const dy = chaser.targetY - chaser.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  if (dist > 5) {
    const speed = 3 + level * 0.3;
    chaser.vx = (dx / dist) * speed;
    chaser.vy = (dy / dist) * speed;
  } else {
    chaser.vx *= 0.9;
    chaser.vy *= 0.9;
  }
  
  chaser.x += chaser.vx;
  chaser.y += chaser.vy;
  
  // Bounds
  chaser.x = Math.max(chaser.size, Math.min(W - chaser.size, chaser.x));
  chaser.y = Math.max(chaser.size + 60, Math.min(H - chaser.size, chaser.y));
  
  // Trail
  if (Math.abs(chaser.vx) > 0.5 || Math.abs(chaser.vy) > 0.5) {
    trails.push({ x: chaser.x, y: chaser.y, life: 1, color: '#ff6b9d' });
  }
}

function updateTarget() {
  const dx = target.x - chaser.x;
  const dy = target.y - chaser.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  // Change direction sometimes
  target.dirChangeTimer++;
  if (target.dirChangeTimer > 60 + Math.random() * 60) {
    target.dirChangeTimer = 0;
    target.vx = (Math.random() - 0.5) * 4;
    target.vy = (Math.random() - 0.5) * 3;
  }
  
  // Run away when chaser is close
  if (dist < 200) {
    const fleeSpeed = 2 + level * 0.5;
    target.vx += (dx / dist) * fleeSpeed * 0.1;
    target.vy += (dy / dist) * fleeSpeed * 0.1;
  }
  
  // Dampen
  target.vx *= 0.98;
  target.vy *= 0.98;
  
  // Clamp speed
  const maxSpeed = 2 + level * 0.3;
  const speed = Math.sqrt(target.vx * target.vx + target.vy * target.vy);
  if (speed > maxSpeed) {
    target.vx = (target.vx / speed) * maxSpeed;
    target.vy = (target.vy / speed) * maxSpeed;
  }
  
  target.x += target.vx;
  target.y += target.vy;
  
  // Bounce off walls
  if (target.x < target.size) { target.x = target.size; target.vx = Math.abs(target.vx); }
  if (target.x > W - target.size) { target.x = W - target.size; target.vx = -Math.abs(target.vx); }
  if (target.y < target.size + 60) { target.y = target.size + 60; target.vy = Math.abs(target.vy); }
  if (target.y > H - target.size) { target.y = H - target.size; target.vy = -Math.abs(target.vy); }
  
  // Trail
  if (Math.abs(target.vx) > 0.5 || Math.abs(target.vy) > 0.5) {
    trails.push({ x: target.x, y: target.y, life: 1, color: '#ffd93d' });
  }
}

function checkCatch() {
  const dx = chaser.x - target.x;
  const dy = chaser.y - target.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  if (dist < chaser.size + target.size) {
    // Caught!
    gameRunning = false;
    
    const lvl = getLevel(level);
    collection.add(lvl.result);
    try { localStorage.setItem('animalmix_collection', JSON.stringify([...collection])); } catch(e) {}
    
    totalMixed++;
    score += 100 + level * 50;
    
    // Merge animation
    merged = {
      x: (chaser.x + target.x) / 2,
      y: (chaser.y + target.y) / 2,
      timer: 0,
      animal: lvl
    };
    
    // Burst of particles
    for (let i = 0; i < 30; i++) {
      particles.push({
        x: merged.x, y: merged.y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        size: 3 + Math.random() * 6,
        life: 1,
        color: ['#ff6b9d', '#ffd93d', '#6bcb77', '#4d96ff'][Math.floor(Math.random() * 4)]
      });
    }
    for (let i = 0; i < 15; i++) {
      sparkles.push({
        x: merged.x + (Math.random() - 0.5) * 80,
        y: merged.y + (Math.random() - 0.5) * 80,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3,
        size: Math.random() * 5,
        life: 1
      });
    }
    
    setTimeout(() => showMergePopup(lvl), 1500);
  }
}

function showMergePopup(lvl) {
  document.getElementById('merge-emoji-1').textContent = lvl.chaser;
  document.getElementById('merge-emoji-2').textContent = lvl.target;
  document.getElementById('merge-result').textContent = lvl.result;
  document.getElementById('merge-name').textContent = lvl.name;
  document.getElementById('merge-desc').textContent = lvl.desc;
  
  document.getElementById('merge-popup').classList.add('show');
}

// Drawing
function drawBackground() {
  const lvl = getLevel(level);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, lvl.bg);
  g.addColorStop(1, '#0a001a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  
  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 30; i++) {
    const x = (i * 137.5 + i * i * 7) % W;
    const y = (i * 89.3 + i * 31) % H;
    ctx.beginPath();
    ctx.arc(x, y, 1 + (i % 2), 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Ground
  ctx.fillStyle = '#1a4a1a';
  ctx.fillRect(0, H - 40, W, 40);
  ctx.fillStyle = '#2a6a2a';
  ctx.fillRect(0, H - 40, W, 5);
}

function drawTrails() {
  trails.forEach((t, i) => {
    t.life -= 0.03;
    if (t.life <= 0) { trails.splice(i, 1); return; }
    ctx.globalAlpha = t.life * 0.3;
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 5 * t.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawCharacter(char, color) {
  const x = char.x;
  const y = char.y;
  const s = char.size;
  
  ctx.save();
  ctx.translate(x, y);
  
  // Glow
  ctx.fillStyle = color + '33';
  ctx.beginPath();
  ctx.arc(0, 0, s + 10, 0, Math.PI * 2);
  ctx.fill();
  
  // Emoji
  ctx.font = `${s * 2}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(char.emoji, 0, 0);
  
  ctx.restore();
}

function drawMerged() {
  if (!merged) return;
  
  merged.timer += 0.02;
  if (merged.timer > 1) merged.timer = 1;
  
  const scale = merged.timer;
  
  ctx.save();
  ctx.translate(merged.x, merged.y);
  ctx.globalAlpha = merged.timer;
  ctx.scale(scale, scale);
  
  // Glowing circle
  ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
  ctx.beginPath();
  ctx.arc(0, 0, 60, 0, Math.PI * 2);
  ctx.fill();
  
  // Animal emoji
  ctx.font = '80px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(merged.animal.result, 0, 0);
  
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawParticles() {
  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); return; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawSparkles() {
  sparkles.forEach((s, i) => {
    s.x += s.vx; s.y += s.vy; s.life -= 0.015;
    if (s.life <= 0) { sparkles.splice(i, 1); return; }
    ctx.globalAlpha = s.life;
    ctx.fillStyle = '#ffd700';
    ctx.font = `${20 + s.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✨', s.x, s.y);
    ctx.globalAlpha = 1;
  });
}

// Collection
function showCollection() {
  const grid = document.getElementById('collection-grid');
  grid.innerHTML = '';
  
  LEVELS.forEach(lvl => {
    const card = document.createElement('div');
    card.className = `card ${collection.has(lvl.result) ? '' : 'locked'}`;
    card.innerHTML = `
      <div class="emoji">${collection.has(lvl.result) ? lvl.result : '❓'}</div>
      <div class="name">${collection.has(lvl.result) ? lvl.name : '???'}</div>
    `;
    grid.appendChild(card);
  });
  
  document.getElementById('collection').classList.add('show');
}

function hideCollection() {
  document.getElementById('collection').classList.remove('show');
}

// Game loop
function gameLoop() {
  if (!gameRunning) return;
  
  drawBackground();
  drawTrails();
  drawParticles();
  drawSparkles();
  
  updateChaser();
  updateTarget();
  checkCatch();
  
  drawCharacter(target, '#ffd93d');
  drawCharacter(chaser, '#ff6b9d');
  drawMerged();
  
  requestAnimationFrame(gameLoop);
}

// Event listeners
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('collection-btn').style.display = 'block';
  level = 1; score = 0; totalMixed = 0;
  initLevel();
  gameRunning = true;
  gameLoop();
});

document.getElementById('merge-next').addEventListener('click', () => {
  document.getElementById('merge-popup').classList.remove('show');
  level++;
  initLevel();
  gameRunning = true;
  gameLoop();
});

document.getElementById('collection-btn').addEventListener('click', showCollection);
document.getElementById('collection-close').addEventListener('click', hideCollection);

// Hide instructions after first tap
canvas.addEventListener('mousedown', () => {
  document.getElementById('instructions').style.display = 'none';
}, { once: true });
canvas.addEventListener('touchstart', () => {
  document.getElementById('instructions').style.display = 'none';
}, { once: true });
</script>
</body>
</html>
