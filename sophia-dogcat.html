<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dog & Cat Mix!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  height: 100vh;
  width: 100vw;
  background: #1a1a4e;
  touch-action: manipulation;
}
canvas { display: block; }

/* Start Screen */
#start-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #2d1b69 0%, #1a0533 50%, #0a001a 100%);
}
#start-screen h1 {
  font-size: 42px; font-weight: 900;
  background: linear-gradient(135deg, #ff6b9d, #ffd93d, #6bcb77, #4d96ff);
  background-size: 300% 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: gradient 3s ease infinite;
  text-align: center; line-height: 1.3;
  margin-bottom: 15px;
}
@keyframes gradient { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
.subtitle { font-size: 20px; color: #b088d0; margin-bottom: 25px; text-align: center; }
.hero-display {
  font-size: 80px; margin: 10px 0 20px;
  animation: heroBounce 2s ease-in-out infinite;
}
@keyframes heroBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

#start-btn {
  font-size: 32px; font-weight: 800; padding: 16px 50px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff8e53);
  color: white; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4);
  transition: transform 0.2s; animation: pulse 2s ease-in-out infinite;
}
#start-btn:hover { transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: none; flex-direction: column; align-items: center;
  padding: 12px 15px; z-index: 10; pointer-events: none;
}
#hud .level { font-size: 20px; font-weight: 700; color: #ffd93d; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
#hud .score { font-size: 16px; color: #b088d0; margin-top: 3px; }

/* Merge popup */
#merge-popup {
  position: fixed; inset: 0;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  z-index: 200;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(10px);
}
#merge-popup.show { display: flex; }

#merge-popup h2 {
  font-size: 36px; font-weight: 900; color: #ffd93d;
  text-shadow: 0 0 30px rgba(255,215,0,0.5);
  margin-bottom: 10px;
}
#merge-popup .merge-animals {
  font-size: 70px; margin: 15px 0;
  display: flex; align-items: center; gap: 15px;
}
#merge-popup .plus { font-size: 40px; color: #fff; }
#merge-popup .equals { font-size: 40px; color: #ffd93d; }
#merge-popup .result-emoji { font-size: 90px; animation: resultPop 0.5s ease; }
@keyframes resultPop {
  0% { transform: scale(0) rotate(-20deg); }
  60% { transform: scale(1.2) rotate(5deg); }
  100% { transform: scale(1) rotate(0); }
}
#merge-popup .animal-name {
  font-size: 28px; font-weight: 900; color: #fff;
  margin: 10px 0 5px;
}
#merge-popup .animal-desc {
  font-size: 16px; color: #b088d0;
  margin-bottom: 25px; text-align: center;
  max-width: 300px;
  line-height: 1.4;
}
#merge-popup .stats-row {
  display: flex; gap: 20px; margin-bottom: 25px;
}
#merge-popup .stat {
  text-align: center;
  padding: 10px 15px;
  background: rgba(255,255,255,0.1);
  border-radius: 15px;
}
#merge-popup .stat-label { font-size: 12px; color: #888; }
#merge-popup .stat-value { font-size: 20px; font-weight: 700; color: #fff; }
#merge-popup .next-btn {
  font-size: 22px; font-weight: 700; padding: 12px 35px; border: none;
  border-radius: 30px; background: linear-gradient(135deg, #6bcb77, #4d96ff);
  color: #fff; cursor: pointer; pointer-events: auto;
  box-shadow: 0 6px 20px rgba(107,203,119,0.4);
  transition: transform 0.2s;
}
#merge-popup .next-btn:hover { transform: scale(1.05); }

/* Collection popup */
#collection-btn {
  position: fixed; bottom: 15px; left: 15px; z-index: 15;
  font-size: 18px; font-weight: 700; padding: 10px 20px;
  border: 2px solid rgba(255,255,255,0.3); border-radius: 25px;
  background: rgba(255,255,255,0.1); color: #fff;
  cursor: pointer; pointer-events: auto;
  backdrop-filter: blur(5px); transition: all 0.2s;
  display: none;
}
#collection-btn:hover { background: rgba(255,255,255,0.2); }

#collection {
  position: fixed; inset: 0;
  display: none; flex-direction: column; align-items: center;
  z-index: 150;
  background: rgba(0,0,0,0.9);
  padding: 40px 20px;
  overflow-y: auto;
}
#collection.show { display: flex; }
#collection h2 {
  font-size: 32px; font-weight: 900; color: #ffd93d;
  margin-bottom: 20px;
}
#collection .grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 15px; width: 100%; max-width: 500px;
}
#collection .card {
  background: rgba(255,255,255,0.1);
  border-radius: 15px; padding: 12px;
  text-align: center;
}
#collection .card.locked { opacity: 0.3; }
#collection .card .emoji { font-size: 40px; }
#collection .card .name { font-size: 12px; color: #fff; margin-top: 5px; }
#collection .close-btn {
  font-size: 18px; font-weight: 700; padding: 10px 25px; margin-top: 20px;
  border: 2px solid rgba(255,255,255,0.3); border-radius: 25px;
  background: rgba(255,255,255,0.1); color: #fff;
  cursor: pointer; pointer-events: auto;
}

/* Instructions */
#instructions {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
  font-size: 16px; color: rgba(255,255,255,0.6);
  z-index: 10; pointer-events: none;
  text-align: center;
  animation: fadeInOut 3s ease infinite;
}
@keyframes fadeInOut {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}
</style>
</head>
<body>

<div id="start-screen">
  <h1>Dog & Cat<br>Mix!</h1>
  <div class="hero-display">🐶🐱</div>
  <div class="subtitle">Catch the cat to make new animals!</div>
  <button id="start-btn">PLAY!</button>
</div>

<div id="hud">
  <div class="level" id="hud-level">Level 1</div>
  <div class="score" id="hud-score">Mixed: 0 animals</div>
</div>

<div id="merge-popup">
  <h2>NEW ANIMAL!</h2>
  <div class="merge-animals">
    <span id="merge-emoji-1">🐶</span>
    <span class="plus">+</span>
    <span id="merge-emoji-2">🐱</span>
    <span class="equals">=</span>
    <span class="result-emoji" id="merge-result">🐱‍👤</span>
  </div>
  <div class="animal-name" id="merge-name">Dogcat</div>
  <div class="animal-desc" id="merge-desc">A cat that barks!</div>
  <div class="stats-row">
    <div class="stat">
      <div class="stat-label">Speed</div>
      <div class="stat-value" id="merge-speed">⚡</div>
    </div>
    <div class="stat">
      <div class="stat-label">Cuteness</div>
      <div class="stat-value" id="merge-cute">💕</div>
    </div>
    <div class="stat">
      <div class="stat-label">Power</div>
      <div class="stat-value" id="merge-power">💪</div>
    </div>
  </div>
  <button class="next-btn" id="merge-next">NEXT LEVEL →</button>
</div>

<button id="collection-btn">📖 Collection</button>

<div id="collection">
  <h2>📖 My Animals</h2>
  <div class="grid" id="collection-grid"></div>
  <button class="close-btn" id="collection-close">CLOSE</button>
</div>

<canvas id="canvas"></canvas>

<div id="instructions">Tap anywhere to move the dog!</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// Game state
let gameRunning = false;
let level = 1;
let score = 0;
let totalMixed = 0;

// Animals
let dog = { x: 0, y: 0, targetX: 0, targetY: 0, vx: 0, vy: 0, size: 30 };
let cat = { x: 0, y: 0, vx: 0, vy: 0, size: 25, dirChangeTimer: 0 };
let merged = null; // For merge animation

// Visual effects
let particles = [];
let sparkles = [];
let trails = [];

// Collection of discovered animals
let collection = new Set();
try { 
  const saved = localStorage.getItem('dogcatmix_collection');
  if (saved) collection = new Set(JSON.parse(saved));
} catch(e) {}

// Animal combinations
const ANIMALS = [
  { emoji: '🐱‍👤', name: 'Dogcat', desc: 'A cat that barks and fetches!', speed: 3, cute: 4, power: 2, combo: '🐶🐱' },
  { emoji: '🦊', name: 'Fox', desc: 'Sneaky and smart!', speed: 5, cute: 3, power: 2, combo: '🐶🐱' },
  { emoji: '🐻', name: 'Bear', desc: 'Big and cuddly!', speed: 2, cute: 5, power: 5, combo: '🐶🐱' },
  { emoji: '🐰', name: 'Bunny', desc: 'Hops around happily!', speed: 4, cute: 5, power: 1, combo: '🐶🐱' },
  { emoji: '🦁', name: 'Lion', desc: 'King of the jungle!', speed: 3, cute: 2, power: 5, combo: '🐶🐱' },
  { emoji: '🐼', name: 'Panda', desc: 'Loves bamboo and naps!', speed: 1, cute: 5, power: 3, combo: '🐶🐱' },
  { emoji: '🐨', name: 'Koala', desc: 'Sleeps in trees!', speed: 1, cute: 5, power: 2, combo: '🐶🐱' },
  { emoji: '🐯', name: 'Tiger', desc: 'Striped and fierce!', speed: 4, cute: 3, power: 5, combo: '🐶🐱' },
  { emoji: '🐵', name: 'Monkey', desc: 'Loves bananas!', speed: 5, cute: 4, power: 3, combo: '🐶🐱' },
  { emoji: '🦄', name: 'Unicorn', desc: 'Magical and sparkly!', speed: 4, cute: 5, power: 4, combo: '🐶🐱' },
  { emoji: '🐸', name: 'Frog', desc: 'Ribbit ribbit!', speed: 3, cute: 3, power: 1, combo: '🐶🐱' },
  { emoji: '🦋', name: 'Butterfly', desc: 'Flutters beautifully!', speed: 5, cute: 5, power: 1, combo: '🐶🐱' },
  { emoji: '🐬', name: 'Dolphin', desc: 'Smart and playful!', speed: 5, cute: 4, power: 3, combo: '🐶🐱' },
  { emoji: '🦜', name: 'Parrot', desc: 'Talks and flies!', speed: 4, cute: 4, power: 2, combo: '🐶🐱' },
  { emoji: '🐢', name: 'Turtle', desc: 'Slow but steady!', speed: 1, cute: 3, power: 4, combo: '🐶🐱' },
  { emoji: '🐝', name: 'Bee', desc: 'Buzzes and makes honey!', speed: 5, cute: 3, power: 3, combo: '🐶🐱' },
];

function getAnimalForLevel(lvl) {
  return ANIMALS[(lvl - 1) % ANIMALS.length];
}

function initLevel() {
  merged = null;
  
  // Dog starts at bottom
  dog.x = W * 0.5;
  dog.y = H * 0.8;
  dog.targetX = dog.x;
  dog.targetY = dog.y;
  dog.vx = 0;
  dog.vy = 0;
  
  // Cat starts at top, moves randomly
  cat.x = W * 0.3 + Math.random() * W * 0.4;
  cat.y = H * 0.2;
  cat.vx = (Math.random() - 0.5) * 3;
  cat.vy = (Math.random() - 0.5) * 2;
  cat.dirChangeTimer = 0;
  
  particles = [];
  sparkles = [];
  trails = [];
  
  updateHUD();
}

function updateHUD() {
  document.getElementById('hud-level').textContent = `Level ${level}`;
  document.getElementById('hud-score').textContent = `Mixed: ${totalMixed} animals`;
}

// Input
function handleTap(x, y) {
  if (!gameRunning) return;
  dog.targetX = x;
  dog.targetY = y;
}

canvas.addEventListener('mousedown', e => handleTap(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  handleTap(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

// Physics
function updateDog() {
  // Move toward target
  const dx = dog.targetX - dog.x;
  const dy = dog.targetY - dog.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  if (dist > 5) {
    const speed = 3 + level * 0.3;
    dog.vx = (dx / dist) * speed;
    dog.vy = (dy / dist) * speed;
  } else {
    dog.vx *= 0.9;
    dog.vy *= 0.9;
  }
  
  dog.x += dog.vx;
  dog.y += dog.vy;
  
  // Bounds
  dog.x = Math.max(dog.size, Math.min(W - dog.size, dog.x));
  dog.y = Math.max(dog.size + 60, Math.min(H - dog.size, dog.y));
  
  // Trail
  if (Math.abs(dog.vx) > 0.5 || Math.abs(dog.vy) > 0.5) {
    trails.push({ x: dog.x, y: dog.y, life: 1, color: '#ff6b9d' });
  }
}

function updateCat() {
  // Cat runs away from dog
  const dx = cat.x - dog.x;
  const dy = cat.y - dog.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  // Change direction sometimes
  cat.dirChangeTimer++;
  if (cat.dirChangeTimer > 60 + Math.random() * 60) {
    cat.dirChangeTimer = 0;
    cat.vx = (Math.random() - 0.5) * 4;
    cat.vy = (Math.random() - 0.5) * 3;
  }
  
  // Run away when dog is close
  if (dist < 200) {
    const fleeSpeed = 2 + level * 0.5;
    cat.vx += (dx / dist) * fleeSpeed * 0.1;
    cat.vy += (dy / dist) * fleeSpeed * 0.1;
  }
  
  // Dampen
  cat.vx *= 0.98;
  cat.vy *= 0.98;
  
  // Clamp speed
  const maxSpeed = 2 + level * 0.3;
  const speed = Math.sqrt(cat.vx * cat.vx + cat.vy * cat.vy);
  if (speed > maxSpeed) {
    cat.vx = (cat.vx / speed) * maxSpeed;
    cat.vy = (cat.vy / speed) * maxSpeed;
  }
  
  cat.x += cat.vx;
  cat.y += cat.vy;
  
  // Bounce off walls
  if (cat.x < cat.size) { cat.x = cat.size; cat.vx = Math.abs(cat.vx); }
  if (cat.x > W - cat.size) { cat.x = W - cat.size; cat.vx = -Math.abs(cat.vx); }
  if (cat.y < cat.size + 60) { cat.y = cat.size + 60; cat.vy = Math.abs(cat.vy); }
  if (cat.y > H - cat.size) { cat.y = H - cat.size; cat.vy = -Math.abs(cat.vy); }
  
  // Trail
  if (Math.abs(cat.vx) > 0.5 || Math.abs(cat.vy) > 0.5) {
    trails.push({ x: cat.x, y: cat.y, life: 1, color: '#ffd93d' });
  }
}

function checkCatch() {
  const dx = dog.x - cat.x;
  const dy = dog.y - cat.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  if (dist < dog.size + cat.size) {
    // Caught!
    gameRunning = false;
    
    const animal = getAnimalForLevel(level);
    collection.add(animal.emoji);
    try { localStorage.setItem('dogcatmix_collection', JSON.stringify([...collection])); } catch(e) {}
    
    totalMixed++;
    score += 100 + level * 50;
    
    // Merge animation
    merged = {
      x: (dog.x + cat.x) / 2,
      y: (dog.y + cat.y) / 2,
      timer: 0,
      animal: animal
    };
    
    // Burst of particles
    for (let i = 0; i < 30; i++) {
      particles.push({
        x: merged.x, y: merged.y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        size: 3 + Math.random() * 6,
        life: 1,
        color: ['#ff6b9d', '#ffd93d', '#6bcb77', '#4d96ff'][Math.floor(Math.random() * 4)]
      });
    }
    for (let i = 0; i < 15; i++) {
      sparkles.push({
        x: merged.x + (Math.random() - 0.5) * 80,
        y: merged.y + (Math.random() - 0.5) * 80,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3,
        size: Math.random() * 5,
        life: 1
      });
    }
    
    // Show merge popup after animation
    setTimeout(() => showMergePopup(animal), 1500);
  }
}

function showMergePopup(animal) {
  document.getElementById('merge-emoji-1').textContent = '🐶';
  document.getElementById('merge-emoji-2').textContent = '🐱';
  document.getElementById('merge-result').textContent = animal.emoji;
  document.getElementById('merge-name').textContent = animal.name;
  document.getElementById('merge-desc').textContent = animal.desc;
  
  // Stats
  const speedEl = document.getElementById('merge-speed');
  const cuteEl = document.getElementById('merge-cute');
  const powerEl = document.getElementById('merge-power');
  speedEl.textContent = '⚡'.repeat(animal.speed);
  cuteEl.textContent = '💕'.repeat(animal.cute);
  powerEl.textContent = '💪'.repeat(animal.power);
  
  document.getElementById('merge-popup').classList.add('show');
}

// Drawing
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2d1b69');
  g.addColorStop(0.5, '#1a0533');
  g.addColorStop(1, '#0a001a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  
  // Grass at bottom
  ctx.fillStyle = '#1a4a1a';
  ctx.fillRect(0, H - 40, W, 40);
  ctx.fillStyle = '#2a6a2a';
  ctx.fillRect(0, H - 40, W, 5);
}

function drawTrails() {
  trails.forEach((t, i) => {
    t.life -= 0.03;
    if (t.life <= 0) { trails.splice(i, 1); return; }
    ctx.globalAlpha = t.life * 0.3;
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 5 * t.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawDog() {
  const x = dog.x;
  const y = dog.y;
  const s = dog.size;
  
  ctx.save();
  ctx.translate(x, y);
  
  // Direction
  if (dog.vx < -0.5) ctx.scale(-1, 1);
  
  // Body
  ctx.fillStyle = '#c8a000';
  ctx.beginPath();
  ctx.ellipse(0, 0, s, s * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Belly
  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.ellipse(0, s * 0.2, s * 0.6, s * 0.5, 0, 0, Math.PI);
  ctx.fill();
  
  // Head
  ctx.fillStyle = '#c8a000';
  ctx.beginPath();
  ctx.arc(0, -s * 0.6, s * 0.6, 0, Math.PI * 2);
  ctx.fill();
  
  // Ears
  ctx.fillStyle = '#a08000';
  ctx.beginPath();
  ctx.ellipse(-s * 0.4, -s * 0.9, s * 0.25, s * 0.4, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(s * 0.4, -s * 0.9, s * 0.25, s * 0.4, 0.3, 0, Math.PI * 2);
  ctx.fill();
  
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-s * 0.2, -s * 0.65, s * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(s * 0.2, -s * 0.65, s * 0.15, 0, Math.PI * 2);
  ctx.fill();
  
  // Pupils
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-s * 0.18, -s * 0.65, s * 0.08, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(s * 0.22, -s * 0.65, s * 0.08, 0, Math.PI * 2);
  ctx.fill();
  
  // Nose
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(0, -s * 0.45, s * 0.1, 0, Math.PI * 2);
  ctx.fill();
  
  // Tongue (when moving)
  if (Math.abs(dog.vx) > 1 || Math.abs(dog.vy) > 1) {
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.ellipse(s * 0.1, -s * 0.3, s * 0.08, s * 0.15, 0, 0, Math.PI);
    ctx.fill();
  }
  
  // Tail
  ctx.strokeStyle = '#c8a000';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-s * 0.8, s * 0.1);
  ctx.quadraticCurveTo(-s * 1.2, -s * 0.3 + Math.sin(Date.now() * 0.01) * 10, -s * 0.9, -s * 0.5);
  ctx.stroke();
  
  ctx.restore();
}

function drawCat() {
  const x = cat.x;
  const y = cat.y;
  const s = cat.size;
  
  ctx.save();
  ctx.translate(x, y);
  
  // Direction
  if (cat.vx < -0.5) ctx.scale(-1, 1);
  
  // Body
  ctx.fillStyle = '#ff8844';
  ctx.beginPath();
  ctx.ellipse(0, 0, s, s * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Stripes
  ctx.strokeStyle = '#cc6622';
  ctx.lineWidth = 2;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 8, -s * 0.5);
    ctx.lineTo(i * 8, s * 0.3);
    ctx.stroke();
  }
  
  // Head
  ctx.fillStyle = '#ff8844';
  ctx.beginPath();
  ctx.arc(0, -s * 0.5, s * 0.5, 0, Math.PI * 2);
  ctx.fill();
  
  // Ears
  ctx.fillStyle = '#ff8844';
  ctx.beginPath();
  ctx.moveTo(-s * 0.3, -s * 0.8);
  ctx.lineTo(-s * 0.5, -s * 1.2);
  ctx.lineTo(-s * 0.1, -s * 0.9);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.3, -s * 0.8);
  ctx.lineTo(s * 0.5, -s * 1.2);
  ctx.lineTo(s * 0.1, -s * 0.9);
  ctx.closePath();
  ctx.fill();
  
  // Inner ears
  ctx.fillStyle = '#ffaacc';
  ctx.beginPath();
  ctx.moveTo(-s * 0.28, -s * 0.85);
  ctx.lineTo(-s * 0.42, -s * 1.1);
  ctx.lineTo(-s * 0.15, -s * 0.9);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.28, -s * 0.85);
  ctx.lineTo(s * 0.42, -s * 1.1);
  ctx.lineTo(s * 0.15, -s * 0.9);
  ctx.closePath();
  ctx.fill();
  
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-s * 0.18, -s * 0.55, s * 0.12, s * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(s * 0.18, -s * 0.55, s * 0.12, s * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Pupils (vertical slits)
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(-s * 0.18, -s * 0.55, s * 0.04, s * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(s * 0.18, -s * 0.55, s * 0.04, s * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Nose
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.4);
  ctx.lineTo(-s * 0.06, -s * 0.45);
  ctx.lineTo(s * 0.06, -s * 0.45);
  ctx.closePath();
  ctx.fill();
  
  // Whiskers
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-s * 0.15, -s * 0.4);
  ctx.lineTo(-s * 0.6, -s * 0.5);
  ctx.moveTo(-s * 0.15, -s * 0.35);
  ctx.lineTo(-s * 0.6, -s * 0.3);
  ctx.moveTo(s * 0.15, -s * 0.4);
  ctx.lineTo(s * 0.6, -s * 0.5);
  ctx.moveTo(s * 0.15, -s * 0.35);
  ctx.lineTo(s * 0.6, -s * 0.3);
  ctx.stroke();
  
  // Tail
  ctx.strokeStyle = '#ff8844';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-s * 0.7, s * 0.2);
  ctx.bezierCurveTo(-s * 1.2, s * 0.5 + Math.sin(Date.now() * 0.008) * 15, -s * 1.0, -s * 0.2, -s * 0.8, -s * 0.5);
  ctx.stroke();
  
  ctx.restore();
}

function drawMerged() {
  if (!merged) return;
  
  merged.timer += 0.02;
  if (merged.timer > 1) merged.timer = 1;
  
  const scale = merged.timer;
  const alpha = merged.timer;
  
  ctx.save();
  ctx.translate(merged.x, merged.y);
  ctx.globalAlpha = alpha;
  ctx.scale(scale, scale);
  
  // Glowing circle
  ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
  ctx.beginPath();
  ctx.arc(0, 0, 60, 0, Math.PI * 2);
  ctx.fill();
  
  // Animal emoji
  ctx.font = '80px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(merged.animal.emoji, 0, 0);
  
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawParticles() {
  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); return; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawSparkles() {
  sparkles.forEach((s, i) => {
    s.x += s.vx; s.y += s.vy; s.life -= 0.015;
    if (s.life <= 0) { sparkles.splice(i, 1); return; }
    ctx.globalAlpha = s.life;
    ctx.fillStyle = '#ffd700';
    ctx.font = `${20 + s.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✨', s.x, s.y);
    ctx.globalAlpha = 1;
  });
}

// Collection
function showCollection() {
  const grid = document.getElementById('collection-grid');
  grid.innerHTML = '';
  
  ANIMALS.forEach(a => {
    const card = document.createElement('div');
    card.className = `card ${collection.has(a.emoji) ? '' : 'locked'}`;
    card.innerHTML = `
      <div class="emoji">${collection.has(a.emoji) ? a.emoji : '❓'}</div>
      <div class="name">${collection.has(a.emoji) ? a.name : '???'}</div>
    `;
    grid.appendChild(card);
  });
  
  document.getElementById('collection').classList.add('show');
}

function hideCollection() {
  document.getElementById('collection').classList.remove('show');
}

// Game loop
function gameLoop() {
  if (!gameRunning) return;
  
  drawBackground();
  drawTrails();
  drawParticles();
  drawSparkles();
  
  updateDog();
  updateCat();
  checkCatch();
  
  drawCat();
  drawDog();
  drawMerged();
  
  requestAnimationFrame(gameLoop);
}

// Event listeners
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('collection-btn').style.display = 'block';
  level = 1; score = 0; totalMixed = 0;
  initLevel();
  gameRunning = true;
  gameLoop();
});

document.getElementById('merge-next').addEventListener('click', () => {
  document.getElementById('merge-popup').classList.remove('show');
  level++;
  initLevel();
  gameRunning = true;
  gameLoop();
});

document.getElementById('collection-btn').addEventListener('click', showCollection);
document.getElementById('collection-close').addEventListener('click', hideCollection);

// Hide instructions after first tap
canvas.addEventListener('mousedown', () => {
  document.getElementById('instructions').style.display = 'none';
}, { once: true });
canvas.addEventListener('touchstart', () => {
  document.getElementById('instructions').style.display = 'none';
}, { once: true });
</script>
