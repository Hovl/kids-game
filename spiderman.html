<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spider-Man Adventure!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  height: 100vh;
  width: 100vw;
  background: #1a1a4e;
  touch-action: manipulation;
}
canvas { display: block; }

#start-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #1a1a4e 0%, #2d0a3e 100%);
}
#start-screen h1 {
  font-size: 48px; font-weight: 900;
  color: #ff4444;
  text-align: center; line-height: 1.3;
  text-shadow: 0 0 30px rgba(255,0,0,0.4);
  margin-bottom: 15px;
}
.hero-display { font-size: 120px; margin: 20px 0; animation: heroBounce 2s ease-in-out infinite; }
@keyframes heroBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
.subtitle { font-size: 28px; color: #ff8888; margin-bottom: 30px; text-align: center; }
#start-btn {
  font-size: 40px; font-weight: 800; padding: 20px 60px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff0000, #cc0000);
  color: white; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,0,0,0.4);
  transition: transform 0.2s; animation: pulse 2s ease-in-out infinite;
}
#start-btn:hover { transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Spider-Man<br>Adventure!</h1>
  <div class="hero-display">🕷️</div>
  <div class="subtitle">Tap anywhere to play!</div>
  <button id="start-btn">GO!</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let gameRunning = false;

// Spider-Man state
let spidey = {
  x: 0, y: 0,
  targetX: 0, targetY: 0,
  action: 'idle', // idle, swing, flip, web, land
  actionTimer: 0,
  frame: 0,
  webTarget: null,
  flipAngle: 0,
  scale: 1,
  bobPhase: 0
};

// Scene objects
let buildings = [];
let clouds = [];
let stars = [];
let sparkles = [];
let webs = [];
let confetti = [];

// Fun messages
const MESSAGES = ['WOW!', 'YAY!', 'GO!', 'YES!', 'COOL!', 'SUPER!', 'HERO!'];

function initGame() {
  spidey.x = W * 0.5;
  spidey.y = H * 0.5;
  spidey.targetX = W * 0.5;
  spidey.targetY = H * 0.5;
  spidey.action = 'idle';
  spidey.actionTimer = 0;
  spidey.frame = 0;
  spidey.webTarget = null;
  spidey.flipAngle = 0;
  spidey.scale = 1;
  spidey.bobPhase = 0;
  
  sparkles = [];
  webs = [];
  confetti = [];
  
  // Buildings
  buildings = [];
  let bx = 0;
  while (bx < W + 100) {
    const w = 60 + Math.random() * 100;
    const h = 100 + Math.random() * 250;
    buildings.push({
      x: bx, w, h,
      hue: 220 + Math.random() * 20,
      lit: Math.random() > 0.3
    });
    bx += w + 20 + Math.random() * 50;
  }
  
  // Clouds
  clouds = [];
  for (let i = 0; i < 8; i++) {
    clouds.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.4,
      size: 50 + Math.random() * 80,
      speed: 0.2 + Math.random() * 0.3
    });
  }
  
  // Stars
  stars = [];
  for (let i = 0; i < 50; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.5,
      size: 1 + Math.random() * 2,
      twinkle: Math.random() * Math.PI * 2
    });
  }
}

// What happens when you tap different areas
function handleTap(x, y) {
  if (!gameRunning) return;
  
  // Where did we tap?
  const relY = y / H; // 0=top, 1=bottom
  
  if (relY < 0.3) {
    // Tapped top = Spider-Man shoots web to sky and swings up!
    doSwingUp(x, y);
  } else if (relY > 0.75) {
    // Tapped bottom = Spider-Man bounces on ground
    doBounce(x, y);
  } else {
    // Tapped middle = Spider-Man flies to that spot
    doFlyTo(x, y);
  }
  
  // Always add sparkles at tap point
  addSparkles(x, y, 8);
}

function doSwingUp(x, y) {
  spidey.action = 'swing';
  spidey.actionTimer = 60;
  spidey.targetX = x;
  spidey.targetY = Math.max(80, y);
  
  // Web to sky
  webs.push({
    fromX: spidey.x, fromY: spidey.y,
    toX: x, toY: 20,
    life: 1
  });
  
  // Big sparkle burst
  addSparkles(x, y, 15);
  showFloatingEmoji(spidey.x, spidey.y - 40, '🕷️');
}

function doBounce(x, y) {
  spidey.action = 'bounce';
  spidey.actionTimer = 40;
  spidey.targetX = x;
  spidey.targetY = H - 80;
  spidey.scale = 1.5;
  
  // Ground stars
  for (let i = 0; i < 6; i++) {
    addSparkles(x + (Math.random() - 0.5) * 100, H - 60, 3);
  }
  showFloatingEmoji(x, H - 100, '⭐');
}

function doFlyTo(x, y) {
  spidey.action = 'fly';
  spidey.actionTimer = 30;
  spidey.targetX = x;
  spidey.targetY = y;
  
  // Web line
  webs.push({
    fromX: spidey.x, fromY: spidey.y,
    toX: x, toY: y,
    life: 0.8
  });
  
  // Check if near a building - do a flip!
  buildings.forEach(b => {
    if (x > b.x && x < b.x + b.w && y > H - b.h) {
      spidey.action = 'flip';
      spidey.actionTimer = 50;
      spidey.flipAngle = 0;
      showFloatingEmoji(x, y - 50, '🌀');
    }
  });
  
  // Random: sometimes do a flip anyway
  if (spidey.action !== 'flip' && Math.random() < 0.3) {
    spidey.action = 'flip';
    spidey.actionTimer = 50;
    spidey.flipAngle = 0;
  }
}

function addSparkles(x, y, count) {
  const colors = ['#ff4444', '#ffd700', '#4488ff', '#ffffff', '#ff8888'];
  for (let i = 0; i < count; i++) {
    sparkles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8 - 3,
      size: 3 + Math.random() * 6,
      life: 1,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function addConfetti(x, y) {
  const colors = ['#ff4444', '#ffd700', '#4488ff', '#44ff44', '#ff44ff'];
  for (let i = 0; i < 20; i++) {
    confetti.push({
      x, y,
      vx: (Math.random() - 0.5) * 10,
      vy: -Math.random() * 8 - 2,
      size: 4 + Math.random() * 6,
      life: 1,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.3
    });
  }
}

function showFloatingEmoji(x, y, emoji) {
  // Draw emoji on canvas as part of particles
  sparkles.push({
    x, y,
    vx: 0, vy: -2,
    size: 40,
    life: 1,
    emoji: emoji
  });
}

// Drawing functions
function drawSky() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, '#0a0a3e');
  gradient.addColorStop(0.5, '#1a1a5e');
  gradient.addColorStop(1, '#2d0a3e');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
  
  // Moon
  ctx.fillStyle = 'rgba(255, 255, 200, 0.2)';
  ctx.beginPath();
  ctx.arc(W * 0.8, H * 0.12, 50, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255, 255, 200, 0.1)';
  ctx.beginPath();
  ctx.arc(W * 0.8, H * 0.12, 70, 0, Math.PI * 2);
  ctx.fill();
}

function drawStars() {
  stars.forEach(s => {
    s.twinkle += 0.03;
    const alpha = 0.3 + Math.sin(s.twinkle) * 0.4;
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawClouds() {
  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x < -c.size) c.x = W + c.size;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(c.x - c.size * 0.4, c.y + c.size * 0.15, c.size * 0.7, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawBuildings() {
  buildings.forEach(b => {
    ctx.fillStyle = `hsl(${b.hue}, 20%, 18%)`;
    ctx.fillRect(b.x, H - b.h, b.w, b.h);
    
    // Windows
    for (let row = 0; row < Math.floor(b.h / 35); row++) {
      for (let col = 0; col < Math.floor(b.w / 20); col++) {
        const lit = Math.sin(row * 3 + col * 7 + b.x) > -0.3;
        ctx.fillStyle = lit ? 'rgba(255, 200, 100, 0.5)' : 'rgba(0,0,0,0.2)';
        ctx.fillRect(b.x + 8 + col * 20, H - b.h + 10 + row * 35, 10, 14);
      }
    }
  });
}

function drawWebs() {
  webs.forEach((w, i) => {
    w.life -= 0.02;
    if (w.life <= 0) { webs.splice(i, 1); return; }
    
    ctx.globalAlpha = w.life * 0.7;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.moveTo(w.fromX, w.fromY);
    ctx.lineTo(w.toX, w.toY);
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Anchor glow
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.beginPath();
    ctx.arc(w.toX, w.toY, 6, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.globalAlpha = 1;
  });
}

function drawSpiderMan() {
  const x = spidey.x;
  const y = spidey.y;
  
  ctx.save();
  ctx.translate(x, y);
  
  // Flip animation
  if (spidey.action === 'flip') {
    spidey.flipAngle += 0.15;
    ctx.rotate(spidey.flipAngle);
  }
  
  // Scale for bounce
  if (spidey.action === 'bounce') {
    spidey.scale += (1 - spidey.scale) * 0.1;
    ctx.scale(spidey.scale, spidey.scale);
  }
  
  // Bob animation
  spidey.bobPhase += 0.04;
  const bob = Math.sin(spidey.bobPhase) * 3;
  ctx.translate(0, bob);
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 30, 20, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Body
  ctx.fillStyle = '#cc0000';
  ctx.beginPath();
  ctx.arc(0, 0, 30, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#0044cc';
  ctx.beginPath();
  ctx.arc(0, 0, 30, 0, Math.PI);
  ctx.fill();
  
  // Web pattern
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * 30, Math.sin(a) * 30);
    ctx.stroke();
  }
  
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-10, -7, 8, 10, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(10, -7, 8, 10, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  
  // Smile
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, 3, 10, 0.1, Math.PI - 0.1);
  ctx.stroke();
  
  ctx.restore();
}

function drawSparkles() {
  sparkles.forEach((s, i) => {
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.05;
    s.life -= 0.02;
    
    if (s.life <= 0) { sparkles.splice(i, 1); return; }
    
    if (s.emoji) {
      ctx.globalAlpha = s.life;
      ctx.font = `${s.size}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.emoji, s.x, s.y);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = s.life;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  });
}

function drawConfetti() {
  confetti.forEach((c, i) => {
    c.x += c.vx;
    c.y += c.vy;
    c.vy += 0.15;
    c.rotation += c.rotSpeed;
    c.life -= 0.01;
    
    if (c.life <= 0) { confetti.splice(i, 1); return; }
    
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rotation);
    ctx.globalAlpha = c.life;
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
    ctx.globalAlpha = 1;
    ctx.restore();
  });
}

// Update Spider-Man movement
function updateSpiderMan() {
  // Move toward target
  const dx = spidey.targetX - spidey.x;
  const dy = spidey.targetY - spidey.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  if (dist > 3) {
    spidey.x += dx * 0.08;
    spidey.y += dy * 0.08;
  }
  
  // Action timer
  if (spidey.actionTimer > 0) {
    spidey.actionTimer--;
    if (spidey.actionTimer <= 0) {
      spidey.action = 'idle';
      spidey.flipAngle = 0;
    }
  }
}

// Main game loop
function gameLoop() {
  if (!gameRunning) return;
  
  drawSky();
  drawStars();
  drawClouds();
  drawBuildings();
  drawWebs();
  drawConfetti();
  drawSparkles();
  drawSpiderMan();
  updateSpiderMan();
  
  requestAnimationFrame(gameLoop);
}

// Event handlers
canvas.addEventListener('mousedown', (e) => { handleTap(e.clientX, e.clientY); });
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  handleTap(t.clientX, t.clientY);
}, { passive: false });

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  initGame();
  gameRunning = true;
  gameLoop();
});
</script>
</body>
</html>
