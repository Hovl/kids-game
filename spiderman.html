<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spider-Man: Catch the Spiders!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  height: 100vh;
  width: 100vw;
  background: #1a1a4e;
  touch-action: manipulation;
}
canvas { display: block; }

#start-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #1a1a4e 0%, #2d0a3e 100%);
}
#start-screen h1 {
  font-size: 42px; font-weight: 900;
  color: #ff4444;
  text-align: center; line-height: 1.3;
  text-shadow: 0 0 30px rgba(255,0,0,0.4);
  margin-bottom: 10px;
}
.subtitle { font-size: 24px; color: #ff8888; margin-bottom: 20px; text-align: center; }
.hero-display { font-size: 100px; margin: 15px 0; animation: heroBounce 2s ease-in-out infinite; }
@keyframes heroBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
.instructions { color: #ccc; font-size: 22px; text-align: center; margin-bottom: 25px; line-height: 2; }
.instructions span { color: #ffd700; font-weight: 700; font-size: 26px; }

#start-btn {
  font-size: 36px; font-weight: 800; padding: 18px 55px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff0000, #cc0000);
  color: white; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,0,0,0.4);
  transition: transform 0.2s; animation: pulse 2s ease-in-out infinite;
}
#start-btn:hover { transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

#hud {
  position: fixed; top: 10px; left: 0; right: 0;
  display: none; justify-content: center; align-items: center;
  padding: 10px; z-index: 10; pointer-events: none;
  flex-direction: column;
}
#hud .score-display { font-size: 48px; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.6); }
#hud .label { font-size: 18px; color: #ffaa44; font-weight: 600; }

.float-text {
  position: fixed; pointer-events: none; z-index: 50;
  font-size: 50px; font-weight: 900; color: #ffd700;
  text-shadow: 0 0 20px rgba(255,215,0,0.8);
  animation: floatUp 1.5s ease-out forwards;
}
@keyframes floatUp { 0%{transform:translateY(0) scale(1);opacity:1} 100%{transform:translateY(-120px) scale(1.8);opacity:0} }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Spider-Man:<br>Catch the Spiders!</h1>
  <div class="subtitle">Help Spider-Man find his friends!</div>
  <div class="hero-display">🕷️</div>
  <div class="instructions">
    <span>TAP</span> on the spider friends to catch them!
  </div>
  <button id="start-btn">LET'S PLAY!</button>
</div>

<div id="hud">
  <div class="label">SPIDER FRIENDS</div>
  <div class="score-display" id="hud-score">0</div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let score = 0;
let gameRunning = false;
let spiderFriends = [];
let particles = [];
let webs = [];
let clouds = [];
let buildings = [];
let sparkles = [];
let spawnTimer = 0;

// Spider-Man stays in the middle-ish area, looking around
let spiderman = { x: 0, y: 0, lookDir: 1, bobPhase: 0 };

function initGame() {
  score = 0;
  spiderFriends = [];
  particles = [];
  webs = [];
  sparkles = [];
  spawnTimer = 0;
  
  spiderman.x = W * 0.5;
  spiderman.y = H * 0.5;
  
  // Clouds
  clouds = [];
  for (let i = 0; i < 8; i++) {
    clouds.push({ x: Math.random() * W, y: Math.random() * H * 0.4, size: 50 + Math.random() * 80, speed: 0.2 + Math.random() * 0.3 });
  }
  
  // Buildings
  buildings = [];
  let bx = 0;
  while (bx < W + 100) {
    const w = 40 + Math.random() * 70;
    const h = 60 + Math.random() * 120;
    buildings.push({ x: bx, w, h, color: `hsl(${220 + Math.random() * 20}, 20%, ${18 + Math.random() * 8}%)` });
    bx += w + 15 + Math.random() * 30;
  }
  
  // Spawn initial spiders
  for (let i = 0; i < 3; i++) spawnSpiderFriend();
}

function spawnSpiderFriend() {
  // Spawn at random position, slowly drifting
  const side = Math.random() < 0.5 ? -1 : 1;
  spiderFriends.push({
    x: side === -1 ? -40 : W + 40,
    y: 80 + Math.random() * (H - 200),
    targetX: 100 + Math.random() * (W - 200),
    targetY: 80 + Math.random() * (H - 200),
    radius: 35,
    speed: 0.4 + Math.random() * 0.3,
    bobPhase: Math.random() * Math.PI * 2,
    caught: false,
    catchAnim: 0
  });
}

function drawSky() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, '#0a0a3e');
  gradient.addColorStop(0.6, '#1a1a5e');
  gradient.addColorStop(1, '#2d0a3e');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
  
  // Big friendly moon
  ctx.fillStyle = 'rgba(255, 255, 200, 0.15)';
  ctx.beginPath();
  ctx.arc(W * 0.8, H * 0.15, 60, 0, Math.PI * 2);
  ctx.fill();
  
  // Stars
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  for (let i = 0; i < 40; i++) {
    const x = (i * 137.5 + i * i * 7) % W;
    const y = (i * 89.3 + i * 31) % (H * 0.5);
    const size = 1 + (i % 3);
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawClouds() {
  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x < -c.size) c.x = W + c.size;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(c.x - c.size * 0.4, c.y + c.size * 0.15, c.size * 0.7, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawBuildings() {
  buildings.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, H - b.h, b.w, b.h);
    for (let row = 0; row < Math.floor(b.h / 30); row++) {
      for (let col = 0; col < Math.floor(b.w / 18); col++) {
        ctx.fillStyle = Math.random() > 0.4 ? 'rgba(255, 200, 100, 0.4)' : 'rgba(0,0,0,0.2)';
        ctx.fillRect(b.x + 6 + col * 18, H - b.h + 8 + row * 30, 8, 12);
      }
    }
  });
}

function drawSpiderMan() {
  const x = spiderman.x;
  const y = spiderman.y;
  
  spiderman.bobPhase += 0.03;
  const bob = Math.sin(spiderman.bobPhase) * 5;
  
  ctx.save();
  ctx.translate(x, y + bob);
  
  // Body
  ctx.fillStyle = '#cc0000';
  ctx.beginPath();
  ctx.arc(0, 0, 28, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#0044cc';
  ctx.beginPath();
  ctx.arc(0, 0, 28, 0, Math.PI);
  ctx.fill();
  
  // Web lines
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * 28, Math.sin(a) * 28);
    ctx.stroke();
  }
  
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-9, -6, 7, 9, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(9, -6, 7, 9, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  
  // Smile
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 4, 8, 0.2, Math.PI - 0.2);
  ctx.stroke();
  
  ctx.restore();
}

function drawSpiderFriends() {
  spiderFriends.forEach(s => {
    if (s.caught) {
      // Catch animation - scale up and fade
      s.catchAnim += 0.05;
      if (s.catchAnim > 1) return;
      
      ctx.globalAlpha = 1 - s.catchAnim;
      ctx.font = `${40 + s.catchAnim * 30}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🕷️', s.x, s.y - s.catchAnim * 50);
      ctx.globalAlpha = 1;
      return;
    }
    
    // Move toward target
    const dx = s.targetX - s.x;
    const dy = s.targetY - s.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 2) {
      s.x += (dx / dist) * s.speed;
      s.y += (dy / dist) * s.speed;
    } else {
      // Pick new target
      s.targetX = 80 + Math.random() * (W - 160);
      s.targetY = 80 + Math.random() * (H - 200);
    }
    
    s.bobPhase += 0.04;
    const bob = Math.sin(s.bobPhase) * 6;
    
    // Big glow so it's obvious
    ctx.fillStyle = 'rgba(255, 200, 0, 0.15)';
    ctx.beginPath();
    ctx.arc(s.x, s.y + bob, s.radius + 20, 0, Math.PI * 2);
    ctx.fill();
    
    // Pulsing ring
    const pulseSize = s.radius + 10 + Math.sin(s.bobPhase * 2) * 5;
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(s.x, s.y + bob, pulseSize, 0, Math.PI * 2);
    ctx.stroke();
    
    // The spider emoji - BIG
    ctx.font = '50px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🕷️', s.x, s.y + bob);
  });
}

function drawWebs() {
  webs.forEach((w, i) => {
    w.life -= 0.03;
    if (w.life <= 0) { webs.splice(i, 1); return; }
    
    ctx.globalAlpha = w.life;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.moveTo(w.fromX, w.fromY);
    ctx.lineTo(w.toX, w.toY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  });
}

function drawParticles() {
  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.015;
    p.vy += 0.02;
    
    if (p.life <= 0) { particles.splice(i, 1); return; }
    
    ctx.globalAlpha = p.life;
    ctx.font = `${p.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.emoji, p.x, p.y);
    ctx.globalAlpha = 1;
  });
}

function drawSparkles() {
  sparkles.forEach((s, i) => {
    s.life -= 0.02;
    if (s.life <= 0) { sparkles.splice(i, 1); return; }
    
    ctx.globalAlpha = s.life;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function spawnCatchEffect(x, y) {
  // Stars and sparkles
  const emojis = ['⭐', '✨', '🌟', '💫'];
  for (let i = 0; i < 8; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5 - 2,
      size: 20 + Math.random() * 20,
      life: 1,
      emoji: emojis[Math.floor(Math.random() * emojis.length)]
    });
  }
  
  // Sparkle circles
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2;
    sparkles.push({
      x: x + Math.cos(angle) * 30,
      y: y + Math.sin(angle) * 30,
      vx: Math.cos(angle) * 2,
      vy: Math.sin(angle) * 2,
      size: 5 + Math.random() * 5,
      life: 1,
      color: `hsl(${40 + Math.random() * 20}, 100%, ${60 + Math.random() * 30}%)`
    });
  }
}

function showFloatingText(x, y, text) {
  const div = document.createElement('div');
  div.className = 'float-text';
  div.textContent = text;
  div.style.left = (x - 30) + 'px';
  div.style.top = y + 'px';
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 1500);
}

// Handle tap
function handleTap(x, y) {
  if (!gameRunning) return;
  
  // Move Spider-Man toward tap
  spiderman.x += (x - spiderman.x) * 0.3;
  spiderman.y += (y - spiderman.y) * 0.3;
  
  // Check if tap is near any spider friend
  let caught = false;
  spiderFriends.forEach(s => {
    if (s.caught) return;
    const dx = x - s.x;
    const dy = y - s.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    // Very generous hit area
    if (dist < s.radius + 40) {
      s.caught = true;
      s.catchAnim = 0;
      score++;
      caught = true;
      
      // Web line from Spider-Man to catch
      webs.push({ fromX: spiderman.x, fromY: spiderman.y, toX: s.x, toY: s.y, life: 1 });
      
      spawnCatchEffect(s.x, s.y);
      showFloatingText(s.x, s.y - 30, `${score} 🕷️`);
      
      // Replace after delay
      setTimeout(() => {
        const idx = spiderFriends.indexOf(s);
        if (idx > -1) spiderFriends.splice(idx, 1);
        spawnSpiderFriend();
      }, 800);
    }
  });
  
  // Always show a web shot for feedback
  if (!caught) {
    webs.push({ fromX: spiderman.x, fromY: spiderman.y, toX: x, toY: y, life: 0.5 });
  }
}

// Main loop
function gameLoop() {
  if (!gameRunning) return;
  
  drawSky();
  drawClouds();
  drawBuildings();
  drawWebs();
  drawSpiderFriends();
  drawParticles();
  drawSparkles();
  drawSpiderMan();
  
  // Keep enough spiders on screen
  const activeSpiders = spiderFriends.filter(s => !s.caught).length;
  if (activeSpiders < 3) {
    spawnSpiderFriend();
  }
  
  document.getElementById('hud-score').textContent = score;
  
  requestAnimationFrame(gameLoop);
}

// Events
canvas.addEventListener('mousedown', (e) => { handleTap(e.clientX, e.clientY); });
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  handleTap(t.clientX, t.clientY);
}, { passive: false });

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  initGame();
  gameRunning = true;
  gameLoop();
});
</script>
</body>
</html>
