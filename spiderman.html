<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spider-Man: Colors & Counting!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  height: 100vh;
  width: 100vw;
  background: #1a1a4e;
  touch-action: manipulation;
}
canvas { display: block; }

#start-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #1a1a4e 0%, #2d0a3e 100%);
}
#start-screen h1 {
  font-size: 38px; font-weight: 900;
  color: #ff4444;
  text-align: center; line-height: 1.3;
  text-shadow: 0 0 30px rgba(255,0,0,0.4);
  margin-bottom: 10px;
}
.hero-display { font-size: 100px; margin: 15px 0; animation: heroBounce 2s ease-in-out infinite; }
@keyframes heroBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
.subtitle { font-size: 22px; color: #ff8888; margin-bottom: 20px; text-align: center; }
.mode-select { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
.mode-btn {
  font-size: 20px; font-weight: 700; padding: 15px 30px; border: 3px solid rgba(255,255,255,0.2);
  border-radius: 30px; background: rgba(255,255,255,0.05); color: #fff;
  cursor: pointer; pointer-events: auto; transition: all 0.3s;
}
.mode-btn:hover { background: rgba(255,255,255,0.15); }
.mode-btn.selected { border-color: #ffd700; background: rgba(255,215,0,0.15); box-shadow: 0 0 20px rgba(255,215,0,0.3); }

#start-btn {
  font-size: 36px; font-weight: 800; padding: 18px 55px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff0000, #cc0000);
  color: white; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,0,0,0.4);
  transition: transform 0.2s; animation: pulse 2s ease-in-out infinite;
}
#start-btn:hover { transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: none; flex-direction: column; align-items: center;
  padding: 15px 20px; z-index: 10; pointer-events: none;
}
#hud .prompt {
  font-size: 32px; font-weight: 900; color: #fff;
  text-shadow: 0 0 20px rgba(255,255,255,0.5);
  text-align: center; margin-bottom: 5px;
}
#hud .progress {
  font-size: 24px; color: #ffd700; font-weight: 700;
  text-shadow: 0 0 15px rgba(255,215,0,0.5);
}
#hud .score-display {
  font-size: 20px; color: #ff8888; font-weight: 600;
  margin-top: 5px;
}

/* Feedback overlay */
#feedback {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 72px; font-weight: 900; color: #ffd700;
  text-shadow: 0 0 40px rgba(255,215,0,0.8);
  z-index: 50; pointer-events: none;
  opacity: 0; transition: opacity 0.3s;
}
#feedback.show { opacity: 1; animation: feedbackPop 0.8s ease-out; }
@keyframes feedbackPop {
  0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
  50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}

/* Level complete */
#level-complete {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(26,10,60,0.95); backdrop-filter: blur(10px);
}
#level-complete h2 { font-size: 48px; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.5); margin-bottom: 10px; }
#level-complete .message { font-size: 24px; color: #ff8888; margin-bottom: 25px; text-align: center; }
#next-btn {
  font-size: 28px; font-weight: 800; padding: 16px 50px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ffd700, #ffaa00);
  color: #1a1a4e; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,215,0,0.4); transition: transform 0.2s;
}
#next-btn:hover { transform: scale(1.08); }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Spider-Man:<br>Colors & Counting!</h1>
  <div class="hero-display">🕷️</div>
  <div class="subtitle">Learn with Spider-Man!</div>
  
  <div class="mode-select">
    <div class="mode-btn selected" data-mode="colors">🎨 Colors</div>
    <div class="mode-btn" data-mode="counting">🔢 Counting</div>
    <div class="mode-btn" data-mode="shapes">⭐ Shapes</div>
  </div>
  
  <button id="start-btn">LET'S LEARN!</button>
</div>

<div id="hud">
  <div class="prompt" id="hud-prompt">Catch the RED spider!</div>
  <div class="progress" id="hud-progress">0 / 3</div>
  <div class="score-display" id="hud-score">Great job!</div>
</div>

<div id="feedback"></div>

<canvas id="canvas"></canvas>

<div id="level-complete">
  <h2 id="lc-title">AMAZING!</h2>
  <div class="message" id="lc-message">You learned your colors!</div>
  <button id="next-btn">NEXT LEVEL!</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let gameRunning = false;
let selectedMode = 'colors';
let level = 1;
let correctCount = 0;
let targetCount = 3;
let currentTarget = null;
let currentPrompt = '';
let spiders = [];
let particles = [];
let sparkles = [];

// Color definitions with names
const COLORS = [
  { name: 'RED', hex: '#ff4444', hue: 0 },
  { name: 'BLUE', hex: '#4488ff', hue: 220 },
  { name: 'GREEN', hex: '#44ff44', hue: 120 },
  { name: 'YELLOW', hex: '#ffdd44', hue: 60 },
  { name: 'PURPLE', hex: '#cc44ff', hue: 280 },
  { name: 'ORANGE', hex: '#ff8844', hue: 30 }
];

// Shape definitions
const SHAPES = [
  { name: 'CIRCLE', sides: 0, draw: 'circle' },
  { name: 'SQUARE', sides: 4, draw: 'square' },
  { name: 'TRIANGLE', sides: 3, draw: 'triangle' },
  { name: 'STAR', sides: 5, draw: 'star' },
  { name: 'HEART', sides: 0, draw: 'heart' }
];

// Number words
const NUMBERS = ['ONE', 'TWO', 'THREE', 'FOUR', 'FIVE'];

function initLevel() {
  correctCount = 0;
  spiders = [];
  particles = [];
  sparkles = [];
  
  if (selectedMode === 'colors') {
    initColorLevel();
  } else if (selectedMode === 'counting') {
    initCountingLevel();
  } else if (selectedMode === 'shapes') {
    initShapeLevel();
  }
}

function initColorLevel() {
  // Pick a target color
  const colorIndex = (level - 1) % COLORS.length;
  currentTarget = COLORS[colorIndex];
  currentPrompt = `Catch the ${currentTarget.name} spider!`;
  targetCount = Math.min(2 + level, 6);
  
  // Create spiders with different colors
  const spiderCount = 6 + level * 2;
  for (let i = 0; i < spiderCount; i++) {
    const isTarget = i < targetCount;
    const color = isTarget ? currentTarget : COLORS[(colorIndex + 1 + Math.floor(Math.random() * (COLORS.length - 1))) % COLORS.length];
    spiders.push({
      x: 80 + Math.random() * (W - 160),
      y: 100 + Math.random() * (H - 250),
      radius: 35,
      color: color,
      isTarget: isTarget,
      caught: false,
      bobPhase: Math.random() * Math.PI * 2,
      targetX: 80 + Math.random() * (W - 160),
      targetY: 100 + Math.random() * (H - 250),
      speed: 0.3 + Math.random() * 0.2
    });
  }
}

function initCountingLevel() {
  targetCount = Math.min(level + 1, 5);
  currentTarget = { name: NUMBERS[targetCount - 1] };
  currentPrompt = `Catch ${currentTarget.name} spiders!`;
  
  // Create extra spiders as distractors
  const spiderCount = targetCount + 3;
  for (let i = 0; i < spiderCount; i++) {
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    spiders.push({
      x: 80 + Math.random() * (W - 160),
      y: 100 + Math.random() * (H - 250),
      radius: 40,
      color: color,
      isTarget: i < spiderCount, // All are catchable
      caught: false,
      bobPhase: Math.random() * Math.PI * 2,
      targetX: 80 + Math.random() * (W - 160),
      targetY: 100 + Math.random() * (H - 250),
      speed: 0.25 + Math.random() * 0.15
    });
  }
}

function initShapeLevel() {
  const shapeIndex = (level - 1) % SHAPES.length;
  currentTarget = SHAPES[shapeIndex];
  currentPrompt = `Catch the ${currentTarget.name} spider!`;
  targetCount = Math.min(2 + level, 5);
  
  // Create spiders with different shapes
  const spiderCount = 6 + level;
  for (let i = 0; i < spiderCount; i++) {
    const isTarget = i < targetCount;
    const shape = isTarget ? currentTarget : SHAPES[(shapeIndex + 1 + Math.floor(Math.random() * (SHAPES.length - 1))) % SHAPES.length];
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    spiders.push({
      x: 80 + Math.random() * (W - 160),
      y: 100 + Math.random() * (H - 250),
      radius: 35,
      color: color,
      shape: shape,
      isTarget: isTarget,
      caught: false,
      bobPhase: Math.random() * Math.PI * 2,
      targetX: 80 + Math.random() * (W - 160),
      targetY: 100 + Math.random() * (H - 250),
      speed: 0.3 + Math.random() * 0.2
    });
  }
}

function drawSky() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, '#0a0a3e');
  gradient.addColorStop(1, '#2d0a3e');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
  
  // Stars
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  for (let i = 0; i < 30; i++) {
    const x = (i * 137.5 + i * i * 7) % W;
    const y = (i * 89.3 + i * 31) % (H * 0.4);
    ctx.beginPath();
    ctx.arc(x, y, 1 + (i % 2), 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawSpider(spider) {
  if (spider.caught) return;
  
  spider.bobPhase += 0.04;
  const bob = Math.sin(spider.bobPhase) * 5;
  
  // Move toward target
  const dx = spider.targetX - spider.x;
  const dy = spider.targetY - spider.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > 2) {
    spider.x += (dx / dist) * spider.speed;
    spider.y += (dy / dist) * spider.speed;
  } else {
    spider.targetX = 80 + Math.random() * (W - 160);
    spider.targetY = 100 + Math.random() * (H - 250);
  }
  
  const x = spider.x;
  const y = spider.y + bob;
  
  // Glow
  ctx.fillStyle = spider.color.hex + '33';
  ctx.beginPath();
  ctx.arc(x, y, spider.radius + 15, 0, Math.PI * 2);
  ctx.fill();
  
  // Pulsing ring
  const pulseSize = spider.radius + 8 + Math.sin(spider.bobPhase * 2) * 4;
  ctx.strokeStyle = spider.color.hex + '88';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x, y, pulseSize, 0, Math.PI * 2);
  ctx.stroke();
  
  // Spider body with color
  ctx.fillStyle = spider.color.hex;
  ctx.beginPath();
  ctx.arc(x, y, spider.radius, 0, Math.PI * 2);
  ctx.fill();
  
  // Darker bottom half
  ctx.fillStyle = spider.color.hex + 'cc';
  ctx.beginPath();
  ctx.arc(x, y, spider.radius, 0, Math.PI);
  ctx.fill();
  
  // Web pattern
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * spider.radius, y + Math.sin(a) * spider.radius);
    ctx.stroke();
  }
  
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(x - 8, y - 5, 6, 8, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(x + 8, y - 5, 6, 8, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  
  // Shape indicator for shape mode
  if (selectedMode === 'shapes' && spider.shape) {
    drawShapeIndicator(x, y + spider.radius + 15, spider.shape, spider.color.hex);
  }
  
  // Number indicator for counting mode
  if (selectedMode === 'counting') {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🕷️', x, y + spider.radius + 15);
  }
}

function drawShapeIndicator(x, y, shape, color) {
  ctx.fillStyle = color;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  
  const size = 12;
  
  if (shape.draw === 'circle') {
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  } else if (shape.draw === 'square') {
    ctx.fillRect(x - size, y - size, size * 2, size * 2);
    ctx.strokeRect(x - size, y - size, size * 2, size * 2);
  } else if (shape.draw === 'triangle') {
    ctx.beginPath();
    ctx.moveTo(x, y - size);
    ctx.lineTo(x - size, y + size);
    ctx.lineTo(x + size, y + size);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else if (shape.draw === 'star') {
    drawStar(x, y, 5, size, size * 0.5);
    ctx.fill();
    ctx.stroke();
  } else if (shape.draw === 'heart') {
    drawHeart(x, y, size);
    ctx.fill();
    ctx.stroke();
  }
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
  let rot = Math.PI / 2 * 3;
  let step = Math.PI / spikes;
  
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
}

function drawHeart(cx, cy, size) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + size * 0.3);
  ctx.bezierCurveTo(cx + size, cy - size * 0.5, cx + size * 0.5, cy - size, cx, cy - size * 0.5);
  ctx.bezierCurveTo(cx - size * 0.5, cy - size, cx - size, cy - size * 0.5, cx, cy + size * 0.3);
  ctx.closePath();
}

function drawParticles() {
  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= 0.02;
    
    if (p.life <= 0) { particles.splice(i, 1); return; }
    
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawSparkles() {
  sparkles.forEach((s, i) => {
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 0.015;
    
    if (s.life <= 0) { sparkles.splice(i, 1); return; }
    
    ctx.globalAlpha = s.life;
    ctx.fillStyle = '#ffd700';
    ctx.font = `${20 + s.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✨', s.x, s.y);
    ctx.globalAlpha = 1;
  });
}

function addCatchEffect(x, y, color) {
  // Particles
  for (let i = 0; i < 12; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8 - 3,
      size: 4 + Math.random() * 6,
      life: 1,
      color: color || '#ffd700'
    });
  }
  
  // Sparkles
  for (let i = 0; i < 6; i++) {
    sparkles.push({
      x: x + (Math.random() - 0.5) * 60,
      y: y + (Math.random() - 0.5) * 60,
      vx: (Math.random() - 0.5) * 3,
      vy: (Math.random() - 0.5) * 3,
      size: Math.random() * 5,
      life: 1
    });
  }
}

function showFeedback(text) {
  const el = document.getElementById('feedback');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth; // Trigger reflow
  el.classList.add('show');
}

function handleTap(x, y) {
  if (!gameRunning) return;
  
  // Check if tapped a spider
  for (let i = spiders.length - 1; i >= 0; i--) {
    const s = spiders[i];
    if (s.caught) continue;
    
    const dx = x - s.x;
    const dy = y - s.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist < s.radius + 30) {
      // Tapped this spider!
      s.caught = true;
      
      if (s.isTarget) {
        // Correct!
        correctCount++;
        addCatchEffect(s.x, s.y, s.color.hex);
        showFeedback('YES! ✨');
        
        // Update progress
        updateHUD();
        
        // Check if level complete
        if (correctCount >= targetCount) {
          setTimeout(levelComplete, 500);
        }
      } else {
        // Wrong spider - gentle feedback
        showFeedback('Try again!');
        // Don't count it, spider disappears
      }
      
      // Remove caught spider after animation
      setTimeout(() => {
        const idx = spiders.indexOf(s);
        if (idx > -1) spiders.splice(idx, 1);
      }, 300);
      
      return;
    }
  }
  
  // Tapped empty space - just show a web
  addCatchEffect(x, y, '#ffffff44');
}

function updateHUD() {
  document.getElementById('hud-prompt').textContent = currentPrompt;
  document.getElementById('hud-progress').textContent = `${correctCount} / ${targetCount}`;
  
  if (correctCount === 0) {
    document.getElementById('hud-score').textContent = "You can do it!";
  } else if (correctCount < targetCount) {
    document.getElementById('hud-score').textContent = "Great job!";
  }
}

function levelComplete() {
  gameRunning = false;
  
  const messages = {
    colors: `You learned ${currentTarget.name}!`,
    counting: `You counted to ${targetCount}!`,
    shapes: `You learned ${currentTarget.name}!`
  };
  
  document.getElementById('lc-title').textContent = 'AMAZING! 🎉';
  document.getElementById('lc-message').textContent = messages[selectedMode];
  document.getElementById('level-complete').style.display = 'flex';
}

function nextLevel() {
  level++;
  document.getElementById('level-complete').style.display = 'none';
  initLevel();
  updateHUD();
  gameRunning = true;
  gameLoop();
}

// Main game loop
function gameLoop() {
  if (!gameRunning) return;
  
  drawSky();
  drawParticles();
  drawSparkles();
  spiders.forEach(drawSpider);
  
  requestAnimationFrame(gameLoop);
}

// Event handlers
canvas.addEventListener('mousedown', (e) => { handleTap(e.clientX, e.clientY); });
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  handleTap(t.clientX, t.clientY);
}, { passive: false });

// Mode selection
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMode = btn.dataset.mode;
  });
});

// Start button
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  level = 1;
  initLevel();
  updateHUD();
  gameRunning = true;
  gameLoop();
});

// Next level button
document.getElementById('next-btn').addEventListener('click', nextLevel);

// Keyboard support
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    // Could add keyboard-based selection later
  }
});
</script>
</body>
</html>
