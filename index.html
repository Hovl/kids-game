<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Dubov Kids Adventure!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  height: 100vh;
  width: 100vw;
}
canvas { display: block; }

/* Start Screen */
#start-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #0a001a 0%, #1a0533 30%, #2d1b69 70%, #4a2c8a 100%);
}
#start-screen h1 {
  font-size: 52px; font-weight: 900;
  background: linear-gradient(135deg, #ff6b9d, #ffd93d, #6bcb77, #4d96ff, #ff6b9d);
  background-size: 300% 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: gradient 3s ease infinite;
  text-align: center; line-height: 1.2;
}
@keyframes gradient { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
.subtitle { font-size: 22px; color: #b088d0; margin: 10px 0 30px; text-align: center; }

/* Character Select */
.char-select { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
.char-card {
  width: 140px; padding: 15px 10px; border-radius: 20px;
  background: rgba(255,255,255,0.08); border: 3px solid transparent;
  cursor: pointer; transition: all 0.3s; text-align: center;
  pointer-events: auto;
}
.char-card:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
.char-card.selected { border-color: #ffd93d; background: rgba(255,217,61,0.15); box-shadow: 0 0 25px rgba(255,217,61,0.3); }
.char-avatar { font-size: 50px; margin-bottom: 8px; }
.char-name { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.char-trait { font-size: 11px; color: #b088d0; line-height: 1.3; }

/* Mode Select */
.mode-select { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
.mode-btn {
  font-size: 16px; font-weight: 700; padding: 12px 24px; border: 2px solid rgba(255,255,255,0.2);
  border-radius: 30px; background: rgba(255,255,255,0.05); color: #fff;
  cursor: pointer; pointer-events: auto; transition: all 0.3s;
}
.mode-btn:hover { background: rgba(255,255,255,0.15); }
.mode-btn.selected { border-color: #6bcb77; background: rgba(107,203,119,0.2); }

#start-btn {
  font-size: 32px; font-weight: 800; padding: 16px 50px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff8e53);
  color: white; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4);
  transition: transform 0.2s; animation: pulse 2s ease-in-out infinite;
}
#start-btn:hover { transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: none; justify-content: space-between; align-items: flex-start;
  padding: 12px 20px; z-index: 10; pointer-events: none;
}
#hud .left, #hud .center, #hud .right { display: flex; flex-direction: column; align-items: center; }
#hud .player-name { font-size: 14px; font-weight: 700; color: #ffd93d; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
#hud .score-display { font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.5); }
#hud .level-display { font-size: 16px; color: #a0e0ff; font-weight: 600; }
#hud .lives-display { font-size: 20px; margin-top: 2px; }
#combo-display {
  position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
  font-size: 24px; font-weight: 900; color: #ffd700;
  text-shadow: 0 0 15px rgba(255,215,0,0.6);
  opacity: 0; transition: opacity 0.3s; z-index: 10; pointer-events: none;
}
#combo-display.show { opacity: 1; }

/* Mode label */
#mode-label {
  position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
  font-size: 14px; color: rgba(255,255,255,0.4); z-index: 10; pointer-events: none;
}

/* Game Over */
#game-over {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(10,0,26,0.92); backdrop-filter: blur(10px);
}
#game-over h2 { font-size: 48px; font-weight: 900; color: #ffd93d; text-shadow: 0 0 30px rgba(255,217,61,0.5); }
#game-over .final-score { font-size: 64px; font-weight: 900; color: #fff; margin: 10px 0; }
#game-over .stats { font-size: 18px; color: #b088d0; margin-bottom: 25px; text-align: center; line-height: 1.6; }
#game-over .learned { font-size: 16px; color: #6bcb77; margin-bottom: 20px; }
#restart-btn {
  font-size: 26px; font-weight: 800; padding: 14px 45px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #6bcb77, #4d96ff);
  color: white; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(107,203,119,0.4); transition: transform 0.2s;
}
#restart-btn:hover { transform: scale(1.08); }

/* Floating effects */
.float-text {
  position: fixed; pointer-events: none; z-index: 50;
  font-size: 28px; font-weight: 900; color: #ffd700;
  text-shadow: 0 0 10px rgba(255,215,0,0.8);
  animation: floatUp 1s ease-out forwards;
}
@keyframes floatUp { 0%{transform:translateY(0) scale(1);opacity:1} 100%{transform:translateY(-80px) scale(1.5);opacity:0} }
.star-burst {
  position: fixed; pointer-events: none; z-index: 50;
  font-size: 40px; animation: starPop 0.8s ease-out forwards;
}
@keyframes starPop { 0%{transform:scale(0) rotate(0deg);opacity:1} 50%{transform:scale(1.5) rotate(180deg);opacity:1} 100%{transform:scale(0) rotate(360deg);opacity:0} }

/* Letter popup */
.letter-popup {
  position: fixed; pointer-events: none; z-index: 60;
  font-size: 60px; font-weight: 900; color: #fff;
  text-shadow: 0 0 30px rgba(255,255,255,0.8), 0 0 60px rgba(100,180,255,0.5);
  animation: letterPop 1.5s ease-out forwards;
  text-align: center;
}
.letter-popup .letter-name { font-size: 18px; color: #ffd93d; margin-top: 5px; }
@keyframes letterPop {
  0%{transform:scale(0) rotate(-10deg);opacity:0}
  20%{transform:scale(1.3) rotate(5deg);opacity:1}
  80%{transform:scale(1) rotate(0deg);opacity:1}
  100%{transform:scale(0.5) translateY(-50px);opacity:0}
}
</style>
</head>
<body>

<div id="start-screen">
  <h1>The Dubov Kids<br>Adventure!</h1>
  <div class="subtitle">Choose your hero and pop bubbles!</div>

  <div class="char-select">
    <div class="char-card selected" data-char="sophia">
      <div class="char-avatar">👸</div>
      <div class="char-name">Sophia</div>
      <div class="char-trait">Team player ★<br>Loves learning</div>
    </div>
    <div class="char-card" data-char="alexey">
      <div class="char-avatar">🦸</div>
      <div class="char-name">Alexey Jr.</div>
      <div class="char-trait">Unique thinker ★<br>Super powers</div>
    </div>
    <div class="char-card" data-char="paulina">
      <div class="char-avatar">🧚</div>
      <div class="char-name">Paulina</div>
      <div class="char-trait">Brave explorer ★<br>Strong heart</div>
    </div>
  </div>

  <div class="mode-select">
    <div class="mode-btn selected" data-mode="pop">Bubble Pop</div>
    <div class="mode-btn" data-mode="russian">Russian ABC</div>
    <div class="mode-btn" data-mode="swim">Swim Race</div>
  </div>

  <button id="start-btn">PLAY!</button>
</div>

<div id="hud">
  <div class="left">
    <div class="player-name" id="hud-name">Sophia</div>
    <div class="lives-display" id="hud-lives">❤️❤️❤️❤️❤️</div>
  </div>
  <div class="center">
    <div class="score-display" id="hud-score">0</div>
    <div class="level-display" id="hud-level">Level 1</div>
  </div>
  <div class="right">
    <div style="font-size:14px;color:#a0e0ff;">Best</div>
    <div class="score-display" id="hud-best" style="font-size:22px;">0</div>
  </div>
</div>
<div id="combo-display"></div>
<div id="mode-label"></div>

<canvas id="canvas"></canvas>

<div id="game-over">
  <h2 id="go-title">Amazing Job!</h2>
  <div class="final-score" id="go-score">0</div>
  <div class="stats" id="go-stats"></div>
  <div class="learned" id="go-learned"></div>
  <button id="restart-btn">Play Again!</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// Characters
const CHARACTERS = {
  sophia: {
    name: 'Sophia', emoji: '👸', color: '#ff6b9d',
    greeting: 'Go Sophia! You can do it!',
    trait: 'teamwork'
  },
  alexey: {
    name: 'Alexey Jr.', emoji: '🦸', color: '#4d96ff',
    greeting: 'Show your super powers!',
    trait: 'unique'
  },
  paulina: {
    name: 'Paulina', emoji: '🧚', color: '#6bcb77',
    greeting: 'Explore and conquer!',
    trait: 'brave'
  }
};

// Russian alphabet with names
const RUSSIAN_LETTERS = [
  { letter: 'А', name: 'А', word: 'Арбуз', emoji: '🍉' },
  { letter: 'Б', name: 'Б', word: 'Бабочка', emoji: '🦋' },
  { letter: 'В', name: 'В', word: 'Волк', emoji: '🐺' },
  { letter: 'Г', name: 'Г', word: 'Гриб', emoji: '🍄' },
  { letter: 'Д', name: 'Д', word: 'Дом', emoji: '🏠' },
  { letter: 'Е', name: 'Е', word: 'Ежик', emoji: '🦔' },
  { letter: 'Ж', name: 'Ж', word: 'Жираф', emoji: '🦒' },
  { letter: 'З', name: 'З', word: 'Звезда', emoji: '⭐' },
  { letter: 'И', name: 'И', word: 'Игрушка', emoji: '🧸' },
  { letter: 'К', name: 'К', word: 'Кот', emoji: '🐱' },
  { letter: 'Л', name: 'Л', word: 'Луна', emoji: '🌙' },
  { letter: 'М', name: 'М', word: 'Мишка', emoji: '🐻' },
  { letter: 'Н', name: 'Н', word: 'Небо', emoji: '☁️' },
  { letter: 'О', name: 'О', word: 'Облако', emoji: '🌤️' },
  { letter: 'П', name: 'П', word: 'Птица', emoji: '🐦' },
  { letter: 'Р', name: 'Р', word: 'Рыба', emoji: '🐟' },
  { letter: 'С', name: 'С', word: 'Солнце', emoji: '☀️' },
  { letter: 'Т', name: 'Т', word: 'Тигр', emoji: '🐯' },
  { letter: 'У', name: 'У', word: 'Улитка', emoji: '🐌' },
  { letter: 'Ф', name: 'Ф', word: 'Фонарь', emoji: '🔦' },
  { letter: 'Х', name: 'Х', word: 'Хомяк', emoji: '🐹' },
  { letter: 'Ц', name: 'Ц', word: 'Цветок', emoji: '🌸' },
  { letter: 'Ч', name: 'Ч', word: 'Часы', emoji: '⏰' },
  { letter: 'Ш', name: 'Ш', word: 'Шарик', emoji: '🎈' },
  { letter: 'Щ', name: 'Щ', word: 'Щенок', emoji: '🐶' },
  { letter: 'Э', name: 'Э', word: 'Экран', emoji: '📺' },
  { letter: 'Ю', name: 'Ю', word: 'Юла', emoji: '🪀' },
  { letter: 'Я', name: 'Я', word: 'Яблоко', emoji: '🍎' },
];

// Game state
let selectedChar = 'sophia';
let selectedMode = 'pop';
let score = 0;
let combo = 0;
let maxCombo = 0;
let level = 1;
let totalPopped = 0;
let lives = 5;
let gameRunning = false;
let bubbles = [];
let particles = [];
let spawnTimer = 0;
let difficultyTimer = 0;
let lettersLearned = new Set();
let bestScores = { pop: 0, russian: 0, swim: 0 };
let bgStars = [];
let swimDistance = 0;
let swimObstacles = [];

// Load best scores
try { const s = localStorage.getItem('dubov_best'); if (s) bestScores = JSON.parse(s); } catch(e) {}

for (let i = 0; i < 100; i++) {
  bgStars.push({ x: Math.random() * 2000, y: Math.random() * 2000, r: Math.random() * 2 + 0.5, twinkle: Math.random() * Math.PI * 2 });
}

const COLORS = [
  { fill: '#ff6b9d', glow: 'rgba(255,107,157,0.4)' },
  { fill: '#ffd93d', glow: 'rgba(255,217,61,0.4)' },
  { fill: '#6bcb77', glow: 'rgba(107,203,119,0.4)' },
  { fill: '#4d96ff', glow: 'rgba(77,150,255,0.4)' },
  { fill: '#ff8e53', glow: 'rgba(255,142,83,0.4)' },
  { fill: '#c77dff', glow: 'rgba(199,125,255,0.4)' },
  { fill: '#38bdf8', glow: 'rgba(56,189,248,0.4)' },
];

// Character select
document.querySelectorAll('.char-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedChar = card.dataset.char;
  });
});

// Mode select
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMode = btn.dataset.mode;
  });
});

class Bubble {
  constructor() {
    this.r = Math.random() * 25 + 25;
    this.x = Math.random() * (W - this.r * 2) + this.r;
    this.y = H + this.r;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = -(Math.random() * 1.5 + 1 + level * 0.12);
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.04 + 0.02;
    this.wobbleAmp = Math.random() * 1.5 + 0.5;
    this.alive = true;
    this.popping = false;
    this.popFrame = 0;
    this.content = null;
    this.special = null;

    if (selectedMode === 'russian') {
      // Russian letter bubble
      const letterData = RUSSIAN_LETTERS[Math.floor(Math.random() * RUSSIAN_LETTERS.length)];
      this.content = letterData;
      this.r += 8;
      this.vy *= 0.7; // Slower for learning
    } else if (selectedMode === 'swim') {
      // Swim mode: obstacles and coins
      this.isObstacle = Math.random() < 0.3;
      if (this.isObstacle) {
        this.r = 20;
        this.color = { fill: '#ff4444', glow: 'rgba(255,68,68,0.4)' };
        this.content = { emoji: ['🦈', '🐙', '🪼', '🦑'][Math.floor(Math.random() * 4)] };
      } else {
        this.content = { emoji: ['🐚', '⭐', '💎', '🫧'][Math.floor(Math.random() * 4)] };
      }
    } else {
      // Regular pop mode with special bubbles
      if (Math.random() < 0.15) {
        this.special = { emoji: ['🌟', '💖', '🌈', '🎉', '🦄'][Math.floor(Math.random() * 5)], points: 25 };
        this.r += 10;
      }
    }
  }

  update() {
    if (this.popping) { this.popFrame++; return this.popFrame > 15; }
    this.wobble += this.wobbleSpeed;
    this.x += this.vx + Math.sin(this.wobble) * this.wobbleAmp;
    this.y += this.vy;
    if (this.x < this.r) { this.x = this.r; this.vx *= -1; }
    if (this.x > W - this.r) { this.x = W - this.r; this.vx *= -1; }
    if (this.y < -this.r * 2) { this.alive = false; return true; }
    return false;
  }

  draw() {
    if (this.popping) {
      const p = this.popFrame / 15;
      ctx.globalAlpha = 1 - p;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * (1 + p * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = this.color.fill;
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }

    // Glow
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 1.5);
    grad.addColorStop(0, this.color.glow);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(this.x - this.r * 1.5, this.y - this.r * 1.5, this.r * 3, this.r * 3);

    // Body
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    const bodyGrad = ctx.createRadialGradient(this.x - this.r * 0.3, this.y - this.r * 0.3, 0, this.x, this.y, this.r);
    bodyGrad.addColorStop(0, '#ffffff');
    bodyGrad.addColorStop(0.3, this.color.fill);
    bodyGrad.addColorStop(1, this.color.fill + '88');
    ctx.fillStyle = bodyGrad;
    ctx.fill();

    // Shine
    ctx.beginPath();
    ctx.arc(this.x - this.r * 0.25, this.y - this.r * 0.25, this.r * 0.15, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fill();

    // Content
    if (this.content) {
      if (selectedMode === 'russian') {
        // Big letter
        ctx.font = `bold ${this.r * 1.1}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.fillText(this.content.letter, this.x, this.y - 5);
        // Small emoji
        ctx.font = `${this.r * 0.4}px serif`;
        ctx.fillText(this.content.emoji, this.x, this.y + this.r * 0.4);
      } else {
        ctx.font = `${this.r * 0.8}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.content.emoji, this.x, this.y);
      }
    }
    if (this.special) {
      ctx.font = `${this.r * 0.7}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.special.emoji, this.x, this.y);
    }
  }

  contains(px, py) {
    return (px - this.x) ** 2 + (py - this.y) ** 2 <= this.r ** 2;
  }

  pop() { this.popping = true; this.popFrame = 0; }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 12;
    this.vy = (Math.random() - 0.5) * 12;
    this.r = Math.random() * 6 + 2;
    this.color = color;
    this.life = 1;
    this.decay = Math.random() * 0.03 + 0.02;
  }
  update() { this.x += this.vx; this.y += this.vy; this.vy += 0.15; this.life -= this.decay; return this.life <= 0; }
  draw() { ctx.globalAlpha = this.life; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); ctx.globalAlpha = 1; }
}

function spawnBubble() { bubbles.push(new Bubble()); }

function popEffect(x, y, color, points) {
  for (let i = 0; i < 12; i++) particles.push(new Particle(x, y, color.fill));
  const ft = document.createElement('div');
  ft.className = 'float-text';
  ft.textContent = `+${points}`;
  ft.style.left = x + 'px'; ft.style.top = y + 'px';
  document.body.appendChild(ft);
  setTimeout(() => ft.remove(), 1000);
  if (combo >= 3) {
    const sb = document.createElement('div');
    sb.className = 'star-burst';
    sb.textContent = combo >= 10 ? '🔥' : combo >= 5 ? '⚡' : '✨';
    sb.style.left = (x - 20) + 'px'; sb.style.top = (y - 20) + 'px';
    document.body.appendChild(sb);
    setTimeout(() => sb.remove(), 800);
  }
}

function showLetterPopup(letterData) {
  const lp = document.createElement('div');
  lp.className = 'letter-popup';
  lp.innerHTML = `${letterData.emoji}<br><span style="font-size:80px">${letterData.letter}</span><div class="letter-name">${letterData.word}</div>`;
  lp.style.left = '50%'; lp.style.top = '40%'; lp.style.transform = 'translate(-50%, -50%)';
  document.body.appendChild(lp);
  setTimeout(() => lp.remove(), 1500);
  // Speak the Russian word
  speakRussian(letterData.letter, letterData.word);
}

function speakRussian(letter, word) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  // Speak the word only (avoids "заглавная буква" prefix on single letters)
  const wordUtter = new SpeechSynthesisUtterance(word);
  wordUtter.lang = 'ru-RU';
  wordUtter.rate = 0.75;
  wordUtter.pitch = 1.1;
  window.speechSynthesis.speak(wordUtter);
}

function handleClick(x, y) {
  if (!gameRunning) return;
  let hit = false;

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (!b.popping && b.contains(x, y)) {
      if (selectedMode === 'swim' && b.isObstacle) {
        // Hit obstacle = lose life
        lives--;
        combo = 0;
        b.pop();
        updateHUD();
        if (lives <= 0) endGame();
        return;
      }

      b.pop();
      hit = true;
      combo++;
      totalPopped++;
      if (combo > maxCombo) maxCombo = combo;

      let points = 10;
      if (b.special) points = b.special.points;
      if (selectedMode === 'russian' && b.content) {
        points = 15;
        lettersLearned.add(b.content.letter);
        showLetterPopup(b.content);
      }
      if (selectedMode === 'swim') points = 12;

      points = Math.floor(points * (1 + Math.min(combo, 20) * 0.1));
      score += points;

      popEffect(b.x, b.y, b.color, points);
      updateHUD();
      break;
    }
  }

  if (!hit) {
    combo = 0;
    document.getElementById('combo-display').classList.remove('show');
  }
}

canvas.addEventListener('pointerdown', e => { e.preventDefault(); handleClick(e.clientX, e.clientY); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); for (const t of e.touches) handleClick(t.clientX, t.clientY); }, { passive: false });

function updateHUD() {
  const char = CHARACTERS[selectedChar];
  document.getElementById('hud-name').textContent = char.name;
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-level').textContent = `Level ${level}`;
  document.getElementById('hud-best').textContent = bestScores[selectedMode];
  let hearts = '';
  for (let i = 0; i < 5; i++) hearts += i < lives ? '❤️' : '🖤';
  document.getElementById('hud-lives').textContent = hearts;

  const cd = document.getElementById('combo-display');
  if (combo >= 2) { cd.textContent = `${combo}x COMBO!`; cd.classList.add('show'); }
  else cd.classList.remove('show');
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  if (selectedMode === 'swim') {
    grad.addColorStop(0, '#001a33');
    grad.addColorStop(0.5, '#003366');
    grad.addColorStop(1, '#004080');
  } else {
    grad.addColorStop(0, '#0a001a');
    grad.addColorStop(0.3, '#1a0533');
    grad.addColorStop(0.6, '#2d1b69');
    grad.addColorStop(1, '#4a2c8a');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const time = Date.now() * 0.001;
  for (const s of bgStars) {
    ctx.globalAlpha = 0.2 + Math.sin(time + s.twinkle) * 0.2;
    ctx.beginPath();
    ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = selectedMode === 'swim' ? '#4488cc' : '#fff';
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

let lastTime = 0;
function gameLoop(time) {
  if (!gameRunning) return;
  const dt = Math.min(time - lastTime, 50);
  lastTime = time;

  drawBackground();

  // Spawn
  spawnTimer += dt;
  let interval = selectedMode === 'russian' ? 1800 : selectedMode === 'swim' ? 800 : Math.max(400, 1200 - level * 80);
  if (spawnTimer > interval) {
    spawnTimer = 0;
    spawnBubble();
    if (level >= 3 && Math.random() < 0.3) spawnBubble();
  }

  // Difficulty
  difficultyTimer += dt;
  if (difficultyTimer > 20000) {
    difficultyTimer = 0;
    level++;
    if (level % 3 === 0 && lives < 5) lives++;
    updateHUD();
  }

  // Update bubbles
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const shouldRemove = bubbles[i].update();
    bubbles[i].draw();
    if (shouldRemove) {
      if (!bubbles[i].alive && !bubbles[i].popping) {
        if (selectedMode !== 'swim' || !bubbles[i].isObstacle) {
          lives--;
          combo = 0;
          updateHUD();
          if (lives <= 0) { endGame(); return; }
        }
      }
      bubbles.splice(i, 1);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    if (particles[i].update()) particles.splice(i, 1);
    else particles[i].draw();
  }

  // Swim mode: draw swimmer
  if (selectedMode === 'swim') {
    swimDistance += dt * 0.01;
    ctx.font = '40px serif';
    ctx.textAlign = 'center';
    ctx.fillText('🏊', W / 2, H - 80);
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#4488cc';
    ctx.fillText(`${Math.floor(swimDistance)}m`, W / 2, H - 45);
  }

  // Draw character avatar in corner
  ctx.font = '30px serif';
  ctx.textAlign = 'left';
  ctx.fillText(CHARACTERS[selectedChar].emoji, 15, H - 20);

  requestAnimationFrame(gameLoop);
}

function startGame() {
  const char = CHARACTERS[selectedChar];
  score = 0; combo = 0; maxCombo = 0; level = 1; totalPopped = 0; lives = 5;
  bubbles = []; particles = []; spawnTimer = 0; difficultyTimer = 0;
  lettersLearned = new Set(); swimDistance = 0;
  gameRunning = true;

  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('mode-label').textContent =
    selectedMode === 'russian' ? 'Pop Russian letters to learn the alphabet!' :
    selectedMode === 'swim' ? 'Swim and collect treasures! Avoid sea creatures!' :
    'Pop bubbles before they escape!';

  updateHUD();
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function endGame() {
  gameRunning = false;
  if (score > bestScores[selectedMode]) {
    bestScores[selectedMode] = score;
    try { localStorage.setItem('dubov_best', JSON.stringify(bestScores)); } catch(e) {}
  }

  const char = CHARACTERS[selectedChar];
  document.getElementById('go-title').textContent = `${char.name} did great!`;
  document.getElementById('go-score').textContent = score;

  let stats = `Bubbles popped: ${totalPopped} | Best combo: ${maxCombo}x | Level: ${level}`;
  if (selectedMode === 'swim') stats += ` | Distance: ${Math.floor(swimDistance)}m`;
  document.getElementById('go-stats').textContent = stats;

  if (selectedMode === 'russian' && lettersLearned.size > 0) {
    document.getElementById('go-learned').textContent =
      `Letters learned: ${[...lettersLearned].sort().join(' ')} (${lettersLearned.size}/${RUSSIAN_LETTERS.length})`;
  } else {
    document.getElementById('go-learned').textContent = '';
  }

  document.getElementById('game-over').style.display = 'flex';
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// Animate start screen background
function animateStart() {
  if (gameRunning) return;
  drawBackground();
  requestAnimationFrame(animateStart);
}
animateStart();
</script>
</body>
