<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sophia's Challenge Climb!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  height: 100vh;
  width: 100vw;
  background: #1a1a4e;
  touch-action: manipulation;
}
canvas { display: block; }

#start-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #0a0a3e 0%, #1a1a5e 50%, #2d0a3e 100%);
}
#start-screen h1 {
  font-size: 38px; font-weight: 900;
  color: #ff6b9d;
  text-align: center; line-height: 1.3;
  text-shadow: 0 0 30px rgba(255,107,157,0.4);
  margin-bottom: 10px;
}
.hero-display { font-size: 100px; margin: 15px 0; animation: heroBounce 2s ease-in-out infinite; }
@keyframes heroBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
.subtitle { font-size: 20px; color: #ff8888; margin-bottom: 15px; text-align: center; }
.mode-select { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
.mode-btn {
  font-size: 18px; font-weight: 700; padding: 12px 24px; border: 3px solid rgba(255,255,255,0.2);
  border-radius: 30px; background: rgba(255,255,255,0.05); color: #fff;
  cursor: pointer; pointer-events: auto; transition: all 0.3s;
}
.mode-btn:hover { background: rgba(255,255,255,0.15); }
.mode-btn.selected { border-color: #ffd700; background: rgba(255,215,0,0.15); box-shadow: 0 0 20px rgba(255,215,0,0.3); }

#start-btn {
  font-size: 32px; font-weight: 800; padding: 14px 45px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff4488);
  color: white; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4);
  transition: transform 0.2s; animation: pulse 2s ease-in-out infinite;
}
#start-btn:hover { transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: none; flex-direction: column; align-items: center;
  padding: 10px 15px; z-index: 10; pointer-events: none;
}
#hud .prompt {
  font-size: 24px; font-weight: 900; color: #fff;
  text-shadow: 0 0 20px rgba(255,255,255,0.5);
  text-align: center; margin-bottom: 5px;
  background: rgba(0,0,0,0.4);
  padding: 8px 20px;
  border-radius: 20px;
}
#hud .stats {
  display: flex; gap: 30px; margin-top: 5px;
}
#hud .stat {
  text-align: center;
}
#hud .stat-label {
  font-size: 12px; color: #aaa;
}
#hud .stat-value {
  font-size: 20px; font-weight: 700; color: #ffd700;
}

/* Feedback */
#feedback {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 56px; font-weight: 900; color: #ffd700;
  text-shadow: 0 0 40px rgba(255,215,0,0.8);
  z-index: 50; pointer-events: none;
  opacity: 0; transition: opacity 0.3s;
}
#feedback.show { opacity: 1; animation: feedbackPop 0.8s ease-out; }
@keyframes feedbackPop {
  0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
  50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}

/* Challenge overlay */
#challenge {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.9); border: 3px solid #ffd700;
  border-radius: 20px; padding: 25px; z-index: 60;
  display: none; flex-direction: column; align-items: center;
  min-width: 280px;
}
#challenge .question {
  font-size: 28px; font-weight: 900; color: #fff;
  margin-bottom: 20px; text-align: center;
}
#challenge .options {
  display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;
}
#challenge .option {
  font-size: 24px; font-weight: 700; padding: 15px 25px;
  border: 2px solid rgba(255,255,255,0.3); border-radius: 15px;
  background: rgba(255,255,255,0.1); color: #fff;
  cursor: pointer; pointer-events: auto; transition: all 0.2s;
  min-width: 70px; text-align: center;
}
#challenge .option:hover { background: rgba(255,255,255,0.2); }
#challenge .option.correct { background: #44ff44; color: #000; }
#challenge .option.wrong { background: #ff4444; color: #fff; }

/* Level complete */
#level-complete {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(26,10,60,0.95); backdrop-filter: blur(10px);
}
#level-complete h2 { font-size: 42px; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.5); margin-bottom: 10px; }
#level-complete .stats { font-size: 20px; color: #ff8888; margin-bottom: 10px; text-align: center; }
#level-complete .stars { font-size: 50px; margin-bottom: 20px; }
#next-btn {
  font-size: 24px; font-weight: 800; padding: 14px 40px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff4488);
  color: #fff; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4); transition: transform 0.2s;
}
#next-btn:hover { transform: scale(1.08); }

/* Game Over */
#game-over {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(26,10,60,0.95); backdrop-filter: blur(10px);
}
#game-over h2 { font-size: 42px; font-weight: 900; color: #ff4444; margin-bottom: 10px; }
#game-over .score { font-size: 36px; color: #ffd700; margin-bottom: 20px; }
#retry-btn {
  font-size: 24px; font-weight: 800; padding: 14px 40px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff4488);
  color: #fff; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4); transition: transform 0.2s;
}
#retry-btn:hover { transform: scale(1.08); }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Sophia's<br>Challenge Climb!</h1>
  <div class="hero-display">👸</div>
  <div class="subtitle">Solve puzzles to climb higher!</div>
  
  <div class="mode-select">
    <div class="mode-btn selected" data-mode="patterns">🔮 Patterns</div>
    <div class="mode-btn" data-mode="math">🔢 Math</div>
    <div class="mode-btn" data-mode="words">📝 Words</div>
    <div class="mode-btn" data-mode="memory">🧠 Memory</div>
  </div>
  
  <button id="start-btn">CLIMB!</button>
</div>

<div id="hud">
  <div class="prompt" id="hud-prompt">What comes next?</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Height</div>
      <div class="stat-value" id="hud-height">0m</div>
    </div>
    <div class="stat">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="hud-score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Lives</div>
      <div class="stat-value" id="hud-lives">❤️❤️❤️</div>
    </div>
  </div>
</div>

<div id="feedback"></div>

<div id="challenge">
  <div class="question" id="challenge-question"></div>
  <div class="options" id="challenge-options"></div>
</div>

<canvas id="canvas"></canvas>

<div id="level-complete">
  <h2 id="lc-title">LEVEL COMPLETE!</h2>
  <div class="stars" id="lc-stars">⭐⭐⭐</div>
  <div class="stats" id="lc-stats">Height: 100m | Score: 500</div>
  <button id="next-btn">NEXT LEVEL</button>
</div>

<div id="game-over">
  <h2>GAME OVER</h2>
  <div class="score" id="go-score">Score: 0</div>
  <button id="retry-btn">TRY AGAIN</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let gameRunning = false;
let selectedMode = 'patterns';
let level = 1;
let height = 0;
let score = 0;
let lives = 3;
let platforms = [];
let princess = { x: 0, y: 0, targetY: 0, jumping: false, jumpVel: 0 };
let particles = [];
let sparkles = [];
let cameraY = 0;
let currentChallenge = null;
let challengeActive = false;

// Pattern sequences
const PATTERNS = {
  colors: [
    { seq: ['🔴', '🔵', '🔴', '🔵'], next: '🔴' },
    { seq: ['🟢', '🟡', '🟢', '🟡'], next: '🟢' },
    { seq: ['🔴', '🟡', '🔵', '🔴', '🟡'], next: '🔵' },
    { seq: ['🟢', '🟢', '🟡', '🟢', '🟢'], next: '🟡' },
    { seq: ['🔴', '🔵', '🟡', '🔴', '🔵'], next: '🟡' },
    { seq: ['🔵', '🔵', '🔴', '🔵', '🔵'], next: '🔴' }
  ],
  shapes: [
    { seq: ['⭐', '❤️', '⭐', '❤️'], next: '⭐' },
    { seq: ['🔵', '🔺', '🔵', '🔺'], next: '🔵' },
    { seq: ['⭐', '❤️', '🔵', '⭐', '❤️'], next: '🔵' },
    { seq: ['🔺', '🔺', '⭐', '🔺', '🔺'], next: '⭐' }
  ]
};

// Math problems by difficulty
function generateMath(difficulty) {
  let a, b, op, answer;
  if (difficulty <= 2) {
    // Addition within 10
    a = Math.floor(Math.random() * 5) + 1;
    b = Math.floor(Math.random() * 5) + 1;
    op = '+';
    answer = a + b;
  } else if (difficulty <= 4) {
    // Addition/subtraction within 20
    a = Math.floor(Math.random() * 10) + 1;
    b = Math.floor(Math.random() * 10) + 1;
    if (Math.random() < 0.5) {
      op = '+';
      answer = a + b;
    } else {
      op = '-';
      if (b > a) [a, b] = [b, a];
      answer = a - b;
    }
  } else {
    // Multiplication basics
    a = Math.floor(Math.random() * 5) + 1;
    b = Math.floor(Math.random() * 5) + 1;
    op = '×';
    answer = a * b;
  }
  
  // Generate wrong answers
  const wrongAnswers = new Set();
  while (wrongAnswers.size < 2) {
    let wrong = answer + Math.floor(Math.random() * 5) - 2;
    if (wrong !== answer && wrong > 0) wrongAnswers.add(wrong);
  }
  
  const options = [answer, ...wrongAnswers].sort(() => Math.random() - 0.5);
  return { question: `${a} ${op} ${b} = ?`, answer, options };
}

// Word challenges
const WORD_CHALLENGES = [
  { word: 'CAT', missing: 'C_T', answer: 'A', options: ['A', 'E', 'I'] },
  { word: 'DOG', missing: 'D_G', answer: 'O', options: ['O', 'A', 'U'] },
  { word: 'SUN', missing: 'S_N', answer: 'U', options: ['U', 'A', 'O'] },
  { word: 'STAR', missing: 'ST_R', answer: 'A', options: ['A', 'E', 'O'] },
  { word: 'BOOK', missing: 'B_OK', answer: 'O', options: ['O', 'A', 'U'] },
  { word: 'FISH', missing: 'F_SH', answer: 'I', options: ['I', 'E', 'A'] },
  { word: 'BIRD', missing: 'B_RD', answer: 'I', options: ['I', 'E', 'A'] },
  { word: 'MOON', missing: 'M_ON', answer: 'O', options: ['O', 'U', 'A'] },
  { word: 'TREE', missing: 'TR_E', answer: 'E', options: ['E', 'A', 'I'] },
  { word: 'FLOWER', missing: 'FL_WER', answer: 'O', options: ['O', 'A', 'U'] }
];

// Memory sequences
function generateMemory(length) {
  const emojis = ['🌟', '🎈', '🎀', '🦋', '🌈', '🌺', '🎪', '🎠'];
  const seq = [];
  for (let i = 0; i < length; i++) {
    seq.push(emojis[Math.floor(Math.random() * emojis.length)]);
  }
  return seq;
}

function initLevel() {
  height = 0;
  cameraY = 0;
  platforms = [];
  particles = [];
  sparkles = [];
  lives = 3;
  challengeActive = false;
  document.getElementById('challenge').style.display = 'none';
  
  // Generate platforms
  const platformCount = 5 + level * 2;
  for (let i = 0; i < platformCount; i++) {
    platforms.push({
      x: W * 0.15 + Math.random() * W * 0.7,
      y: H - 100 - i * 140,
      width: 140,
      height: 30,
      climbed: false,
      bobPhase: Math.random() * Math.PI * 2,
      hue: (i * 30) % 360
    });
  }
  
  // Princess starting position
  princess.x = W * 0.5;
  princess.y = H - 80;
  princess.targetY = H - 80;
  princess.jumping = false;
  
  updateHUD();
}

function updateHUD() {
  document.getElementById('hud-height').textContent = `${Math.floor(height)}m`;
  document.getElementById('hud-score').textContent = score;
  let hearts = '';
  for (let i = 0; i < lives; i++) hearts += '❤️';
  for (let i = lives; i < 3; i++) hearts += '🖤';
  document.getElementById('hud-lives').textContent = hearts;
}

function showChallenge(platformIndex) {
  challengeActive = true;
  const platform = platforms[platformIndex];
  
  if (selectedMode === 'patterns') {
    // Pattern recognition
    const patternType = Math.random() < 0.5 ? 'colors' : 'shapes';
    const patterns = PATTERNS[patternType];
    const pattern = patterns[Math.floor(Math.random() * patterns.length)];
    
    document.getElementById('challenge-question').textContent = `What comes next?\n${pattern.seq.join(' ')}`;
    
    const options = [pattern.next];
    const allEmojis = patternType === 'colors' ? ['🔴', '🔵', '🟢', '🟡'] : ['⭐', '❤️', '🔵', '🔺'];
    while (options.length < 3) {
      const opt = allEmojis[Math.floor(Math.random() * allEmojis.length)];
      if (!options.includes(opt)) options.push(opt);
    }
    options.sort(() => Math.random() - 0.5);
    
    currentChallenge = { answer: pattern.next, options };
    
  } else if (selectedMode === 'math') {
    // Math challenge
    const math = generateMath(level);
    document.getElementById('challenge-question').textContent = math.question;
    currentChallenge = { answer: math.answer.toString(), options: math.options.map(o => o.toString()) };
    
  } else if (selectedMode === 'words') {
    // Word challenge
    const wordChallenge = WORD_CHALLENGES[Math.floor(Math.random() * WORD_CHALLENGES.length)];
    document.getElementById('challenge-question').textContent = `Fill in the blank:\n${wordChallenge.missing}`;
    currentChallenge = { answer: wordChallenge.answer, options: wordChallenge.options };
    
  } else if (selectedMode === 'memory') {
    // Memory challenge
    const seqLength = Math.min(3 + Math.floor(level / 2), 6);
    const seq = generateMemory(seqLength);
    
    // Show sequence briefly
    document.getElementById('challenge-question').textContent = `Remember: ${seq.join(' ')}`;
    document.getElementById('challenge-options').innerHTML = '<div style="color:#aaa;font-size:16px;">Memorize...</div>';
    document.getElementById('challenge').style.display = 'flex';
    
    setTimeout(() => {
      // Show scrambled options
      const correct = seq[seq.length - 1];
      const options = [correct];
      const allEmojis = ['🌟', '🎈', '🎀', '🦋', '🌈', '🌺', '🎪', '🎠'];
      while (options.length < 3) {
        const opt = allEmojis[Math.floor(Math.random() * allEmojis.length)];
        if (!options.includes(opt)) options.push(opt);
      }
      options.sort(() => Math.random() - 0.5);
      
      document.getElementById('challenge-question').textContent = `What was LAST?\n${seq.slice(0, -1).join(' ')} ?`;
      currentChallenge = { answer: correct, options };
      renderOptions();
    }, 2000);
    
    return;
  }
  
  renderOptions();
}

function renderOptions() {
  const optionsDiv = document.getElementById('challenge-options');
  optionsDiv.innerHTML = '';
  
  currentChallenge.options.forEach(opt => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(opt, btn));
    optionsDiv.appendChild(btn);
  });
  
  document.getElementById('challenge').style.display = 'flex';
}

function handleAnswer(answer, btn) {
  if (!challengeActive) return;
  
  if (answer === currentChallenge.answer) {
    // Correct!
    challengeActive = false;
    btn.classList.add('correct');
    score += 100 + level * 20;
    height += 20;
    
    addCatchEffect(princess.x, princess.y, '#44ff44');
    showFeedback('CORRECT! ✨');
    
    setTimeout(() => {
      document.getElementById('challenge').style.display = 'none');
      
      // Climb to next platform
      const nextPlatform = platforms.find(p => !p.climbed);
      if (nextPlatform) {
        nextPlatform.climbed = true;
        princess.targetY = nextPlatform.y - 20;
        princess.jumping = true;
        princess.jumpVel = -10;
        cameraY += 140;
      }
      
      updateHUD();
      
      // Check if level complete
      const climbed = platforms.filter(p => p.climbed).length;
      if (climbed >= platforms.length) {
        setTimeout(levelComplete, 500);
      }
    }, 800);
    
  } else {
    // Wrong
    btn.classList.add('wrong');
    lives--;
    updateHUD();
    
    if (lives <= 0) {
      challengeActive = false;
      setTimeout(gameOver, 500);
    } else {
      showFeedback('TRY AGAIN!');
      setTimeout(() => btn.classList.remove('wrong'), 500);
    }
  }
}

function showFeedback(text) {
  const el = document.getElementById('feedback');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function levelComplete() {
  gameRunning = false;
  
  const stars = lives === 3 ? '⭐⭐⭐' : lives === 2 ? '⭐⭐' : '⭐';
  document.getElementById('lc-title').textContent = `LEVEL ${level} COMPLETE!`;
  document.getElementById('lc-stars').textContent = stars;
  document.getElementById('lc-stats').textContent = `Height: ${Math.floor(height)}m | Score: ${score}`;
  document.getElementById('level-complete').style.display = 'flex';
}

function gameOver() {
  gameRunning = false;
  document.getElementById('go-score').textContent = `Score: ${score}`;
  document.getElementById('game-over').style.display = 'flex';
}

function nextLevel() {
  level++;
  document.getElementById('level-complete').style.display = 'none';
  initLevel();
  gameRunning = true;
  gameLoop();
}

function retryGame() {
  level = 1;
  score = 0;
  document.getElementById('game-over').style.display = 'none';
  initLevel();
  gameRunning = true;
  gameLoop();
}

// Drawing functions
function drawSky() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, '#0a0a3e');
  gradient.addColorStop(0.5, '#1a1a5e');
  gradient.addColorStop(1, '#2d0a3e');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
  
  // Stars
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  for (let i = 0; i < 50; i++) {
    const x = (i * 137.5 + i * i * 7) % W;
    const y = (i * 89.3 + i * 31 + cameraY * 0.3) % (H * 2) - H * 0.5;
    ctx.beginPath();
    ctx.arc(x, y, 1 + (i % 2), 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Moon
  ctx.fillStyle = 'rgba(255, 255, 200, 0.15)';
  ctx.beginPath();
  ctx.arc(W * 0.8, H * 0.1 - cameraY * 0.1, 50, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlatform(platform) {
  const screenY = platform.y + cameraY;
  if (screenY < -50 || screenY > H + 50) return;
  
  platform.bobPhase += 0.03;
  const bob = Math.sin(platform.bobPhase) * 3;
  
  const x = platform.x;
  const y = screenY + bob;
  const w = platform.width;
  const h = platform.height;
  
  // Glow if not climbed
  if (!platform.climbed) {
    ctx.fillStyle = `hsla(${platform.hue}, 70%, 50%, 0.2)`;
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h / 2, w * 0.8, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Platform body
  ctx.fillStyle = platform.climbed ? '#444' : `hsl(${platform.hue}, 70%, 50%)`;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 10);
  ctx.fill();
  
  // Sparkle if target
  if (!platform.climbed) {
    const sparkle = Math.sin(platform.bobPhase * 2) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(255, 255, 255, ${sparkle * 0.5})`;
    ctx.beginPath();
    ctx.arc(x + w * 0.3, y + h * 0.3, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w * 0.7, y + h * 0.5, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPrincess() {
  const x = princess.x;
  const y = princess.y + cameraY;
  
  ctx.save();
  ctx.translate(x, y);
  
  // Body
  ctx.fillStyle = '#ff6b9d';
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI * 2);
  ctx.fill();
  
  // Dress
  ctx.fillStyle = '#ff4488';
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI);
  ctx.fill();
  
  // Crown
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.moveTo(-14, -20);
  ctx.lineTo(-10, -28);
  ctx.lineTo(-5, -20);
  ctx.lineTo(0, -30);
  ctx.lineTo(5, -20);
  ctx.lineTo(10, -28);
  ctx.lineTo(14, -20);
  ctx.closePath();
  ctx.fill();
  
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-7, -5, 5, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(7, -5, 5, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  
  // Smile
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 3, 6, 0.2, Math.PI - 0.2);
  ctx.stroke();
  
  ctx.restore();
}

function drawParticles() {
  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= 0.02;
    
    if (p.life <= 0) { particles.splice(i, 1); return; }
    
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y + cameraY, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawSparkles() {
  sparkles.forEach((s, i) => {
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 0.015;
    
    if (s.life <= 0) { sparkles.splice(i, 1); return; }
    
    ctx.globalAlpha = s.life;
    ctx.fillStyle = '#ffd700';
    ctx.font = `${18 + s.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✨', s.x, s.y + cameraY);
    ctx.globalAlpha = 1;
  });
}

function addCatchEffect(x, y, color) {
  for (let i = 0; i < 10; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      size: 4 + Math.random() * 5,
      life: 1,
      color: color || '#ffd700'
    });
  }
  
  for (let i = 0; i < 5; i++) {
    sparkles.push({
      x: x + (Math.random() - 0.5) * 40,
      y: y + (Math.random() - 0.5) * 40,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      size: Math.random() * 4,
      life: 1
    });
  }
}

function handleTap(x, y) {
  if (!gameRunning || challengeActive) return;
  
  const worldY = y - cameraY;
  
  // Find the next unclimbed platform
  const nextPlatform = platforms.find(p => !p.climbed);
  if (!nextPlatform) return;
  
  // Check if tap is near the next platform
  if (x >= nextPlatform.x - 20 && x <= nextPlatform.x + nextPlatform.width + 20 &&
      worldY >= nextPlatform.y - 40 && worldY <= nextPlatform.y + nextPlatform.height + 40) {
    
    // Move princess toward platform
    princess.x += (nextPlatform.x + nextPlatform.width / 2 - princess.x) * 0.3;
    
    // Show challenge
    showChallenge(platforms.indexOf(nextPlatform));
  }
}

// Main game loop
function gameLoop() {
  if (!gameRunning) return;
  
  drawSky();
  platforms.forEach(drawPlatform);
  drawParticles();
  drawSparkles();
  
  // Update princess
  if (princess.jumping) {
    princess.y += princess.jumpVel;
    princess.jumpVel += 0.5;
    if (princess.y >= princess.targetY) {
      princess.y = princess.targetY;
      princess.jumping = false;
    }
  }
  drawPrincess();
  
  requestAnimationFrame(gameLoop);
}

// Event handlers
canvas.addEventListener('mousedown', (e) => { handleTap(e.clientX, e.clientY); });
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  handleTap(t.clientX, t.clientY);
}, { passive: false });

// Mode selection
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMode = btn.dataset.mode;
  });
});

// Start button
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  level = 1;
  score = 0;
  initLevel();
  gameRunning = true;
  gameLoop();
});

// Next level button
document.getElementById('next-btn').addEventListener('click', nextLevel);

// Retry button
document.getElementById('retry-btn').addEventListener('click', retryGame);
</script>
