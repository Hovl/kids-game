<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sophia's Challenge Climb!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  height: 100vh;
  width: 100vw;
  background: #1a1a4e;
  touch-action: manipulation;
}
canvas { display: block; }

#start-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #0a0a3e 0%, #1a1a5e 50%, #2d0a3e 100%);
}
#start-screen h1 {
  font-size: 38px; font-weight: 900;
  color: #ff6b9d;
  text-align: center; line-height: 1.3;
  text-shadow: 0 0 30px rgba(255,107,157,0.4);
  margin-bottom: 10px;
}
.hero-display { font-size: 100px; margin: 15px 0; animation: heroBounce 2s ease-in-out infinite; }
@keyframes heroBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
.subtitle { font-size: 20px; color: #ff8888; margin-bottom: 15px; text-align: center; }
.mode-select { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
.mode-btn {
  font-size: 18px; font-weight: 700; padding: 12px 24px; border: 3px solid rgba(255,255,255,0.2);
  border-radius: 30px; background: rgba(255,255,255,0.05); color: #fff;
  cursor: pointer; pointer-events: auto; transition: all 0.3s;
}
.mode-btn:hover { background: rgba(255,255,255,0.15); }
.mode-btn.selected { border-color: #ffd700; background: rgba(255,215,0,0.15); box-shadow: 0 0 20px rgba(255,215,0,0.3); }

#start-btn {
  font-size: 32px; font-weight: 800; padding: 14px 45px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff4488);
  color: white; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4);
  transition: transform 0.2s; animation: pulse 2s ease-in-out infinite;
}
#start-btn:hover { transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: none; flex-direction: column; align-items: center;
  padding: 10px 15px; z-index: 10; pointer-events: none;
}
#hud .prompt {
  font-size: 24px; font-weight: 900; color: #fff;
  text-shadow: 0 0 20px rgba(255,255,255,0.5);
  text-align: center; margin-bottom: 5px;
  background: rgba(0,0,0,0.4);
  padding: 8px 20px;
  border-radius: 20px;
}
#hud .stats {
  display: flex; gap: 30px; margin-top: 5px;
}
#hud .stat {
  text-align: center;
}
#hud .stat-label {
  font-size: 12px; color: #aaa;
}
#hud .stat-value {
  font-size: 20px; font-weight: 700; color: #ffd700;
}

/* Feedback */
#feedback {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 56px; font-weight: 900; color: #ffd700;
  text-shadow: 0 0 40px rgba(255,215,0,0.8);
  z-index: 50; pointer-events: none;
  opacity: 0; transition: opacity 0.3s;
}
#feedback.show { opacity: 1; animation: feedbackPop 0.8s ease-out; }
@keyframes feedbackPop {
  0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
  50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1 }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0 }
}

/* Challenge overlay */
#challenge {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.95); border: 3px solid #ffd700;
  border-radius: 20px; padding: 25px; z-index: 60;
  display: none; flex-direction: column; align-items: center;
  min-width: 320px; max-width: 90vw;
}
#challenge .question {
  font-size: 24px; font-weight: 900; color: #fff;
  margin-bottom: 20px; text-align: center;
  line-height: 1.4;
}
#challenge .hint {
  font-size: 14px; color: #aaa; margin-bottom: 15px; text-align: center;
}
#challenge .options {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%;
}
#challenge .option {
  font-size: 22px; font-weight: 700; padding: 15px 20px;
  border: 2px solid rgba(255,255,255,0.3); border-radius: 15px;
  background: rgba(255,255,255,0.1); color: #fff;
  cursor: pointer; pointer-events: auto; transition: all 0.2s;
  text-align: center;
}
#challenge .option:hover { background: rgba(255,255,255,0.2); }
#challenge .option.correct { background: #22cc22; color: #000; border-color: #22cc22; }
#challenge .option.wrong { background: #cc2222; color: #fff; border-color: #cc2222; }

/* Level complete */
#level-complete {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(26,10,60,0.95); backdrop-filter: blur(10px);
}
#level-complete h2 { font-size: 42px; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.5); margin-bottom: 10px; }
#level-complete .stats { font-size: 20px; color: #ff8888; margin-bottom: 10px; text-align: center; }
#level-complete .stars { font-size: 50px; margin-bottom: 20px; }
#next-btn {
  font-size: 24px; font-weight: 800; padding: 14px 40px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff4488);
  color: #fff; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4); transition: transform 0.2s;
}
#next-btn:hover { transform: scale(1.08); }

/* Game Over */
#game-over {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(26,10,60,0.95); backdrop-filter: blur(10px);
}
#game-over h2 { font-size: 42px; font-weight: 900; color: #ff4444; margin-bottom: 10px; }
#game-over .score { font-size: 36px; color: #ffd700; margin-bottom: 20px; }
#retry-btn {
  font-size: 24px; font-weight: 800; padding: 14px 40px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff4488);
  color: #fff; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4); transition: transform 0.2s;
}
#retry-btn:hover { transform: scale(1.08); }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Sophia's<br>Challenge Climb!</h1>
  <div class="hero-display">👸</div>
  <div class="subtitle">Solve puzzles to climb higher!</div>
  
  <div class="mode-select">
    <div class="mode-btn selected" data-mode="patterns">🔮 Patterns</div>
    <div class="mode-btn" data-mode="math">🔢 Math</div>
    <div class="mode-btn" data-mode="words">📝 Words</div>
    <div class="mode-btn" data-mode="memory">🧠 Memory</div>
  </div>
  
  <button id="start-btn">CLIMB!</button>
</div>

<div id="hud">
  <div class="prompt" id="hud-prompt">Tap a platform to start!</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Height</div>
      <div class="stat-value" id="hud-height">0m</div>
    </div>
    <div class="stat">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="hud-score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Lives</div>
      <div class="stat-value" id="hud-lives">❤️❤️❤️</div>
    </div>
  </div>
</div>

<div id="feedback"></div>

<div id="challenge">
  <div class="question" id="challenge-question"></div>
  <div class="hint" id="challenge-hint"></div>
  <div class="options" id="challenge-options"></div>
</div>

<canvas id="canvas"></canvas>

<div id="level-complete">
  <h2 id="lc-title">LEVEL COMPLETE!</h2>
  <div class="stars" id="lc-stars">⭐⭐⭐</div>
  <div class="stats" id="lc-stats">Height: 100m | Score: 500</div>
  <button id="next-btn">NEXT LEVEL</button>
</div>

<div id="game-over">
  <h2>GAME OVER</h2>
  <div class="score" id="go-score">Score: 0</div>
  <button id="retry-btn">TRY AGAIN</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let gameRunning = false;
let selectedMode = 'patterns';
let level = 1;
let height = 0;
let score = 0;
let lives = 3;
let platforms = [];
let princess = { x: 0, y: 0, targetY: 0, jumping: false, jumpVel: 0 };
let particles = [];
let sparkles = [];
let cameraY = 0;
let currentChallenge = null;
let challengeActive = false;
let currentPlatformIndex = -1;
let streak = 0;

// Harder pattern sequences - need to identify the RULE, not just guess
function generatePattern(difficulty) {
  const patterns = [
    // Alternating patterns (easy)
    { seq: ['🔴', '🔵', '🔴', '🔵', '🔴'], rule: 'alternate', next: '🔵', hint: 'Colors alternate' },
    { seq: ['⭐', '❤️', '⭐', '❤️', '⭐'], rule: 'alternate', next: '❤️', hint: 'Shapes alternate' },
    
    // AAB patterns
    { seq: ['🔴', '🔴', '🔵', '🔴', '🔴'], rule: 'aab', next: '🔵', hint: 'Two, then one' },
    { seq: ['🟢', '🟢', '🟡', '🟢', '🟢'], rule: 'aab', next: '🟡', hint: 'Two, then one' },
    
    // ABC patterns
    { seq: ['🔴', '🔵', '🟡', '🔴', '🔵'], rule: 'abc', next: '🟡', hint: 'Three colors repeat' },
    { seq: ['⭐', '❤️', '🔵', '⭐', '❤️'], rule: 'abc', next: '🔵', hint: 'Three shapes repeat' },
    
    // Growing patterns
    { seq: ['🔴', '🔴', '🔵', '🔴', '🔴', '🔵', '🔴'], rule: 'growing', next: '🔴', hint: 'Pattern grows' },
    
    // Reversed patterns
    { seq: ['🔴', '🔵', '🟡', '🟡', '🔵'], rule: 'mirror', next: '🔴', hint: 'It mirrors!' },
  ];
  
  // Filter by difficulty
  let available = patterns;
  if (difficulty <= 2) available = patterns.filter(p => p.rule === 'alternate');
  else if (difficulty <= 4) available = patterns.filter(p => ['alternate', 'aab'].includes(p.rule));
  
  const pattern = available[Math.floor(Math.random() * available.length)];
  
  // Generate 4 options including the correct one
  const allEmojis = ['🔴', '🔵', '🟢', '🟡', '🟣', '🟠'];
  const options = [pattern.next];
  while (options.length < 4) {
    const opt = allEmojis[Math.floor(Math.random() * allEmojis.length)];
    if (!options.includes(opt)) options.push(opt);
  }
  options.sort(() => Math.random() - 0.5);
  
  return {
    question: `What comes next?\n${pattern.seq.join(' ')}`,
    hint: pattern.hint,
    answer: pattern.next,
    options
  };
}

// Math - actual problem solving required
function generateMath(difficulty) {
  let question, answer, hint;
  
  if (difficulty <= 2) {
    // Simple addition
    const a = Math.floor(Math.random() * 8) + 2;
    const b = Math.floor(Math.random() * 8) + 2;
    question = `${a} + ${b} = ?`;
    answer = a + b;
    hint = 'Add the numbers';
  } else if (difficulty <= 4) {
    // Addition and subtraction
    const type = Math.random();
    if (type < 0.4) {
      const a = Math.floor(Math.random() * 15) + 5;
      const b = Math.floor(Math.random() * 10) + 1;
      question = `${a} + ${b} = ?`;
      answer = a + b;
      hint = 'Add the numbers';
    } else if (type < 0.7) {
      let a = Math.floor(Math.random() * 15) + 5;
      const b = Math.floor(Math.random() * a) + 1;
      question = `${a} - ${b} = ?`;
      answer = a - b;
      hint = 'Subtract the smaller from the larger';
    } else {
      // Two-step: a + b - c
      const a = Math.floor(Math.random() * 10) + 5;
      const b = Math.floor(Math.random() * 5) + 1;
      const c = Math.floor(Math.random() * 5) + 1;
      question = `${a} + ${b} - ${c} = ?`;
      answer = a + b - c;
      hint = 'Solve left to right';
    }
  } else {
    // Harder: multiplication, two-step
    const type = Math.random();
    if (type < 0.4) {
      const a = Math.floor(Math.random() * 5) + 2;
      const b = Math.floor(Math.random() * 5) + 2;
      question = `${a} × ${b} = ?`;
      answer = a * b;
      hint = 'Multiply the numbers';
    } else if (type < 0.7) {
      const a = Math.floor(Math.random() * 10) + 5;
      const b = Math.floor(Math.random() * 5) + 2;
      const c = Math.floor(Math.random() * 5) + 1;
      question = `${a} + ${b} × ${c} = ?`;
      // Remember order of operations? No, for 7yo just left to right
      answer = (a + b) * c; // Parentheses make it easier
      question = `(${a} + ${b}) × ${c} = ?`;
      hint = 'Add first, then multiply';
    } else {
      // Word problem
      const apples = Math.floor(Math.random() * 8) + 3;
      const give = Math.floor(Math.random() * apples) + 1;
      question = `You have ${apples} apples.\nYou give away ${give}.\nHow many left?`;
      answer = apples - give;
      hint = 'Subtract the ones you gave away';
    }
  }
  
  // Generate 4 wrong answers that are close to correct
  const wrongAnswers = new Set();
  const offsets = [-2, -1, 1, 2, 3, -3];
  let offsetIdx = 0;
  while (wrongAnswers.size < 3) {
    const wrong = answer + offsets[offsetIdx % offsets.length];
    offsetIdx++;
    if (wrong !== answer && wrong > 0 && wrong < 100) wrongAnswers.add(wrong);
  }
  
  const options = [answer, ...wrongAnswers].sort(() => Math.random() - 0.5);
  return { question, hint, answer: answer.toString(), options: options.map(o => o.toString()) };
}

// Word challenges - spelling and vocabulary
function generateWord(difficulty) {
  const words = [
    // 3-letter words (easy)
    { word: 'CAT', display: 'C _ T', answer: 'A', options: ['A', 'E', 'I', 'O'], hint: 'A pet that says meow' },
    { word: 'DOG', display: 'D _ G', answer: 'O', options: ['O', 'A', 'U', 'I'], hint: 'A pet that barks' },
    { word: 'SUN', display: 'S _ N', answer: 'U', options: ['U', 'A', 'O', 'I'], hint: 'Shines in the sky' },
    { word: 'HAT', display: 'H _ T', answer: 'A', options: ['A', 'E', 'I', 'O'], hint: 'You wear it on your head' },
    { word: 'BIG', display: 'B _ G', answer: 'I', options: ['I', 'E', 'A', 'O'], hint: 'Not small' },
    
    // 4-letter words (medium)
    { word: 'FISH', display: 'F _ S H', answer: 'I', options: ['I', 'E', 'A', 'O'], hint: 'Lives in water' },
    { word: 'BIRD', display: 'B _ R D', answer: 'I', options: ['I', 'E', 'A', 'U'], hint: 'It can fly' },
    { word: 'STAR', display: 'S _ A R', answer: 'T', options: ['T', 'D', 'P', 'B'], hint: 'Shines at night' },
    { word: 'MOON', display: 'M _ O N', answer: 'O', options: ['O', 'U', 'A', 'I'], hint: 'Comes out at night' },
    { word: 'BOOK', display: 'B _ O K', answer: 'O', options: ['O', 'U', 'A', 'I'], hint: 'You read it' },
    
    // 5-letter words (harder)
    { word: 'HORSE', display: 'H _ R S E', answer: 'O', options: ['O', 'A', 'U', 'I'], hint: 'You can ride it' },
    { word: 'HOUSE', display: 'H _ U S E', answer: 'O', options: ['O', 'A', 'U', 'I'], hint: 'Where you live' },
    { word: 'WATER', display: 'W _ T E R', answer: 'A', options: ['A', 'E', 'I', 'O'], hint: 'You drink it' },
    { word: 'FLOWER', display: 'F L _ W E R', answer: 'O', options: ['O', 'A', 'U', 'I'], hint: 'It grows in a garden' },
  ];
  
  let available = words;
  if (difficulty <= 2) available = words.filter(w => w.word.length <= 3);
  else if (difficulty <= 4) available = words.filter(w => w.word.length <= 4);
  
  const word = available[Math.floor(Math.random() * available.length)];
  
  return {
    question: `Fill in the blank:\n${word.display}`,
    hint: word.hint,
    answer: word.answer,
    options: word.options.sort(() => Math.random() - 0.5)
  };
}

// Memory - must remember sequence
function generateMemory(difficulty) {
  const emojis = ['🌟', '🎈', '🎀', '🦋', '🌈', '🌺', '🎪', '🎠', '🎡', '🎢'];
  const length = Math.min(3 + Math.floor(difficulty / 2), 7);
  
  const seq = [];
  for (let i = 0; i < length; i++) {
    seq.push(emojis[Math.floor(Math.random() * emojis.length)]);
  }
  
  // The question asks about a specific position
  const askPosition = Math.floor(Math.random() * seq.length);
  const positionNames = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th'];
  
  const correct = seq[askPosition];
  const options = [correct];
  while (options.length < 4) {
    const opt = emojis[Math.floor(Math.random() * emojis.length)];
    if (!options.includes(opt)) options.push(opt);
  }
  options.sort(() => Math.random() - 0.5);
  
  return {
    question: `Remember this sequence:\n${seq.join(' ')}`,
    hint: `What was the ${positionNames[askPosition]} item?`,
    answer: correct,
    options,
    showTime: 2000 + length * 300 // More time for longer sequences
  };
}

function initLevel() {
  height = 0;
  cameraY = 0;
  platforms = [];
  particles = [];
  sparkles = [];
  lives = 3;
  streak = 0;
  challengeActive = false;
  currentPlatformIndex = -1;
  document.getElementById('challenge').style.display = 'none';
  
  // Generate platforms
  const platformCount = 5 + level * 2;
  for (let i = 0; i < platformCount; i++) {
    platforms.push({
      x: W * 0.15 + Math.random() * W * 0.7,
      y: H - 100 - i * 140,
      width: 140,
      height: 30,
      climbed: false,
      bobPhase: Math.random() * Math.PI * 2,
      hue: (i * 30) % 360
    });
  }
  
  // Princess starting position
  princess.x = W * 0.5;
  princess.y = H - 80;
  princess.targetY = H - 80;
  princess.jumping = false;
  
  updateHUD();
}

function updateHUD() {
  document.getElementById('hud-height').textContent = `${Math.floor(height)}m`;
  document.getElementById('hud-score').textContent = score;
  let hearts = '';
  for (let i = 0; i < lives; i++) hearts += '❤️';
  for (let i = lives; i < 3; i++) hearts += '🖤';
  document.getElementById('hud-lives').textContent = hearts;
  document.getElementById('hud-prompt').textContent = challengeActive ? 'Solve the puzzle!' : 'Tap the next platform!';
}

function showChallenge(platformIndex) {
  if (challengeActive) return; // Don't show multiple challenges
  
  challengeActive = true;
  currentPlatformIndex = platformIndex;
  let challenge;
  
  if (selectedMode === 'patterns') {
    challenge = generatePattern(level);
  } else if (selectedMode === 'math') {
    challenge = generateMath(level);
  } else if (selectedMode === 'words') {
    challenge = generateWord(level);
  } else if (selectedMode === 'memory') {
    challenge = generateMemory(level);
    
    // For memory, show sequence first, then ask
    document.getElementById('challenge-question').textContent = challenge.question;
    document.getElementById('challenge-hint').textContent = 'Memorize this!';
    document.getElementById('challenge-options').innerHTML = '';
    document.getElementById('challenge').style.display = 'flex';
    
    setTimeout(() => {
      document.getElementById('challenge-question').textContent = challenge.hint;
      document.getElementById('challenge-hint').textContent = 'What did you see?';
      currentChallenge = challenge;
      renderOptions(challenge.options);
    }, challenge.showTime);
    
    return;
  }
  
  currentChallenge = challenge;
  document.getElementById('challenge-question').textContent = challenge.question;
  document.getElementById('challenge-hint').textContent = challenge.hint;
  renderOptions(challenge.options);
  document.getElementById('challenge').style.display = 'flex';
}

function renderOptions(options) {
  const optionsDiv = document.getElementById('challenge-options');
  optionsDiv.innerHTML = '';
  
  options.forEach(opt => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(opt, btn));
    optionsDiv.appendChild(btn);
  });
}

function handleAnswer(answer, btn) {
  if (!challengeActive || !currentChallenge) return;
  
  const correct = answer.toString() === currentChallenge.answer.toString();
  
  if (correct) {
    // Correct!
    challengeActive = false;
    btn.classList.add('correct');
    streak++;
    
    const streakBonus = streak > 1 ? streak * 25 : 0;
    const points = 100 + level * 20 + streakBonus;
    score += points;
    height += 20;
    
    addCatchEffect(princess.x, princess.y, '#44ff44');
    const streakText = streak > 1 ? ` 🔥${streak}` : '';
    showFeedback(`+${points}${streakText}`);
    
    setTimeout(() => {
      document.getElementById('challenge').style.display = 'none';
      
      // Climb to next platform
      const platform = platforms[currentPlatformIndex];
      if (platform) {
        platform.climbed = true;
        princess.targetY = platform.y - 20;
        princess.jumping = true;
        princess.jumpVel = -10;
        cameraY += 140;
      }
      
      updateHUD();
      
      // Check if level complete
      const climbed = platforms.filter(p => p.climbed).length;
      if (climbed >= platforms.length) {
        setTimeout(levelComplete, 500);
      }
    }, 800);
    
  } else {
    // Wrong
    btn.classList.add('wrong');
    lives--;
    streak = 0;
    updateHUD();
    
    if (lives <= 0) {
      challengeActive = false;
      setTimeout(gameOver, 500);
    } else {
      showFeedback('❌ WRONG!');
      // Don't close challenge - let them try again
      setTimeout(() => btn.classList.remove('wrong'), 500);
    }
  }
}

function showFeedback(text) {
  const el = document.getElementById('feedback');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function levelComplete() {
  gameRunning = false;
  
  const stars = lives === 3 ? '⭐⭐⭐' : lives === 2 ? '⭐⭐' : '⭐';
  document.getElementById('lc-title').textContent = `LEVEL ${level} COMPLETE!`;
  document.getElementById('lc-stars').textContent = stars;
  document.getElementById('lc-stats').textContent = `Height: ${Math.floor(height)}m | Score: ${score} | Streak: ${streak}🔥`;
  document.getElementById('level-complete').style.display = 'flex';
}

function gameOver() {
  gameRunning = false;
  document.getElementById('go-score').textContent = `Score: ${score} | Height: ${Math.floor(height)}m`;
  document.getElementById('game-over').style.display = 'flex';
}

function nextLevel() {
  level++;
  document.getElementById('level-complete').style.display = 'none';
  initLevel();
  gameRunning = true;
  gameLoop();
}

function retryGame() {
  level = 1;
  score = 0;
  document.getElementById('game-over').style.display = 'none';
  initLevel();
  gameRunning = true;
  gameLoop();
}

// Drawing functions
function drawSky() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, '#0a0a3e');
  gradient.addColorStop(0.5, '#1a1a5e');
  gradient.addColorStop(1, '#2d0a3e');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
  
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  for (let i = 0; i < 50; i++) {
    const x = (i * 137.5 + i * i * 7) % W;
    const y = (i * 89.3 + i * 31 + cameraY * 0.3) % (H * 2) - H * 0.5;
    ctx.beginPath();
    ctx.arc(x, y, 1 + (i % 2), 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.fillStyle = 'rgba(255, 255, 200, 0.15)';
  ctx.beginPath();
  ctx.arc(W * 0.8, H * 0.1 - cameraY * 0.1, 50, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlatform(platform) {
  const screenY = platform.y + cameraY;
  if (screenY < -50 || screenY > H + 50) return;
  
  platform.bobPhase += 0.03;
  const bob = Math.sin(platform.bobPhase) * 3;
  
  const x = platform.x;
  const y = screenY + bob;
  const w = platform.width;
  const h = platform.height;
  
  // Glow if it's the next platform to climb
  const nextPlatform = platforms.find(p => !p.climbed);
  const isNext = platform === nextPlatform;
  
  if (isNext && !challengeActive) {
    ctx.fillStyle = `hsla(${platform.hue}, 70%, 50%, 0.3)`;
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h / 2, w * 0.8, 0, Math.PI * 2);
    ctx.fill();
    
    // Arrow pointing to it
    const arrowY = y - 25 + Math.sin(platform.bobPhase * 2) * 5;
    ctx.fillStyle = '#ffd700';
    ctx.font = '24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('👇', x + w / 2, arrowY);
  }
  
  // Platform body
  ctx.fillStyle = platform.climbed ? '#555' : `hsl(${platform.hue}, 70%, 50%)`;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 10);
  ctx.fill();
  
  // Show platform number
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(platforms.indexOf(platform) + 1, x + w / 2, y + h / 2);
}

function drawPrincess() {
  const x = princess.x;
  const y = princess.y + cameraY;
  
  ctx.save();
  ctx.translate(x, y);
  
  ctx.fillStyle = '#ff6b9d';
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#ff4488';
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI);
  ctx.fill();
  
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.moveTo(-14, -20);
  ctx.lineTo(-10, -28);
  ctx.lineTo(-5, -20);
  ctx.lineTo(0, -30);
  ctx.lineTo(5, -20);
  ctx.lineTo(10, -28);
  ctx.lineTo(14, -20);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-7, -5, 5, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(7, -5, 5, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 3, 6, 0.2, Math.PI - 0.2);
  ctx.stroke();
  
  ctx.restore();
}

function drawParticles() {
  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); return; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y + cameraY, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawSparkles() {
  sparkles.forEach((s, i) => {
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 0.015;
    if (s.life <= 0) { sparkles.splice(i, 1); return; }
    ctx.globalAlpha = s.life;
    ctx.fillStyle = '#ffd700';
    ctx.font = `${18 + s.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✨', s.x, s.y + cameraY);
    ctx.globalAlpha = 1;
  });
}

function addCatchEffect(x, y, color) {
  for (let i = 0; i < 10; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      size: 4 + Math.random() * 5,
      life: 1,
      color: color || '#ffd700'
    });
  }
  for (let i = 0; i < 5; i++) {
    sparkles.push({
      x: x + (Math.random() - 0.5) * 40,
      y: y + (Math.random() - 0.5) * 40,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      size: Math.random() * 4,
      life: 1
    });
  }
}

function handleTap(x, y) {
  if (!gameRunning || challengeActive) return;
  
  const worldY = y - cameraY;
  
  // Find the next unclimbed platform
  const nextPlatform = platforms.find(p => !p.climbed);
  if (!nextPlatform) return;
  
  const idx = platforms.indexOf(nextPlatform);
  
  // Check if tap is near the next platform
  if (x >= nextPlatform.x - 30 && x <= nextPlatform.x + nextPlatform.width + 30 &&
      worldY >= nextPlatform.y - 50 && worldY <= nextPlatform.y + nextPlatform.height + 50) {
    
    // Move princess toward platform
    princess.x += (nextPlatform.x + nextPlatform.width / 2 - princess.x) * 0.3;
    
    // Show challenge
    showChallenge(idx);
  }
}

// Main game loop
function gameLoop() {
  if (!gameRunning) return;
  
  drawSky();
  platforms.forEach(drawPlatform);
  drawParticles();
  drawSparkles();
  
  if (princess.jumping) {
    princess.y += princess.jumpVel;
    princess.jumpVel += 0.5;
    if (princess.y >= princess.targetY) {
      princess.y = princess.targetY;
      princess.jumping = false;
    }
  }
  drawPrincess();
  
  requestAnimationFrame(gameLoop);
}

// Event handlers
canvas.addEventListener('mousedown', (e) => { handleTap(e.clientX, e.clientY); });
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  handleTap(t.clientX, t.clientY);
}, { passive: false });

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMode = btn.dataset.mode;
  });
});

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  level = 1;
  score = 0;
  initLevel();
  gameRunning = true;
  gameLoop();
});

document.getElementById('next-btn').addEventListener('click', nextLevel);
document.getElementById('retry-btn').addEventListener('click', retryGame);
</script>
</body>
