<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sophia's Challenge Climb!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  height: 100vh;
  width: 100vw;
  background: #1a1a4e;
  touch-action: manipulation;
}
canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

#start-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #0a0a3e 0%, #1a1a5e 50%, #2d0a3e 100%);
}
#start-screen h1 {
  font-size: 38px; font-weight: 900;
  color: #ff6b9d;
  text-align: center; line-height: 1.3;
  text-shadow: 0 0 30px rgba(255,107,157,0.4);
  margin-bottom: 10px;
}
.hero-display { font-size: 100px; margin: 15px 0; animation: heroBounce 2s ease-in-out infinite; }
@keyframes heroBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
.subtitle { font-size: 20px; color: #ff8888; margin-bottom: 15px; text-align: center; }
.mode-select { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
.mode-btn {
  font-size: 18px; font-weight: 700; padding: 12px 24px; border: 3px solid rgba(255,255,255,0.2);
  border-radius: 30px; background: rgba(255,255,255,0.05); color: #fff;
  cursor: pointer; pointer-events: auto; transition: all 0.3s;
}
.mode-btn:hover { background: rgba(255,255,255,0.15); }
.mode-btn.selected { border-color: #ffd700; background: rgba(255,215,0,0.15); box-shadow: 0 0 20px rgba(255,215,0,0.3); }

#start-btn {
  font-size: 32px; font-weight: 800; padding: 14px 45px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff4488);
  color: white; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4);
  transition: transform 0.2s; animation: pulse 2s ease-in-out infinite;
}
#start-btn:hover { transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: none; flex-direction: column; align-items: center;
  padding: 10px 15px; z-index: 10; pointer-events: none;
}
#hud .prompt {
  font-size: 22px; font-weight: 900; color: #fff;
  text-shadow: 0 0 20px rgba(255,255,255,0.5);
  text-align: center; margin-bottom: 5px;
  background: rgba(0,0,0,0.5);
  padding: 8px 20px;
  border-radius: 20px;
}
#hud .stats {
  display: flex; gap: 30px; margin-top: 5px;
}
#hud .stat { text-align: center; }
#hud .stat-label { font-size: 12px; color: #aaa; }
#hud .stat-value { font-size: 20px; font-weight: 700; color: #ffd700; }

/* Feedback */
#feedback {
  position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%);
  font-size: 48px; font-weight: 900; color: #ffd700;
  text-shadow: 0 0 40px rgba(255,215,0,0.8);
  z-index: 50; pointer-events: none;
  opacity: 0; transition: opacity 0.3s;
}
#feedback.show { opacity: 1; animation: feedbackPop 0.8s ease-out; }
@keyframes feedbackPop {
  0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
  50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}

/* Challenge overlay - FULL SCREEN for mobile */
#challenge-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 200;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#challenge-overlay.active {
  display: flex;
}

#challenge-box {
  background: linear-gradient(180deg, #1a1a3e, #0a0a2e);
  border: 3px solid #ffd700;
  border-radius: 25px;
  padding: 25px 20px;
  width: 100%;
  max-width: 360px;
  text-align: center;
}

#challenge-question {
  font-size: 24px; font-weight: 900; color: #fff;
  margin-bottom: 10px;
  line-height: 1.4;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#challenge-hint {
  font-size: 16px; color: #aaa;
  margin-bottom: 20px;
  font-style: italic;
}

#challenge-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
}

.option-btn {
  font-size: 28px; font-weight: 800;
  padding: 18px 10px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 18px;
  background: rgba(255,255,255,0.1);
  color: #fff;
  cursor: pointer;
  pointer-events: auto;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.option-btn:active {
  transform: scale(0.95);
}
.option-btn.correct {
  background: #22cc44;
  border-color: #22cc44;
  color: #000;
}
.option-btn.wrong {
  background: #cc2222;
  border-color: #cc2222;
  color: #fff;
  animation: shake 0.3s ease;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

/* Level complete */
#level-complete {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(26,10,60,0.95); backdrop-filter: blur(10px);
}
#level-complete h2 { font-size: 42px; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.5); margin-bottom: 10px; }
#level-complete .stats { font-size: 20px; color: #ff8888; margin-bottom: 10px; text-align: center; }
#level-complete .stars { font-size: 50px; margin-bottom: 20px; }
#next-btn {
  font-size: 24px; font-weight: 800; padding: 14px 40px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff4488);
  color: #fff; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4); transition: transform 0.2s;
}
#next-btn:hover { transform: scale(1.08); }

/* Game Over */
#game-over {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(26,10,60,0.95); backdrop-filter: blur(10px);
}
#game-over h2 { font-size: 42px; font-weight: 900; color: #ff4444; margin-bottom: 10px; }
#game-over .score { font-size: 36px; color: #ffd700; margin-bottom: 20px; }
#retry-btn {
  font-size: 24px; font-weight: 800; padding: 14px 40px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff4488);
  color: #fff; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4); transition: transform 0.2s;
}
#retry-btn:hover { transform: scale(1.08); }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Sophia's<br>Challenge Climb!</h1>
  <div class="hero-display">👸</div>
  <div class="subtitle">Solve puzzles to climb higher!</div>
  
  <div class="mode-select">
    <div class="mode-btn selected" data-mode="patterns">🔮 Patterns</div>
    <div class="mode-btn" data-mode="math">🔢 Math</div>
    <div class="mode-btn" data-mode="words">📝 Words</div>
    <div class="mode-btn" data-mode="memory">🧠 Memory</div>
  </div>
  
  <button id="start-btn">CLIMB!</button>
</div>

<div id="hud">
  <div class="prompt" id="hud-prompt">Tap a platform to start!</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Height</div>
      <div class="stat-value" id="hud-height">0m</div>
    </div>
    <div class="stat">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="hud-score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Lives</div>
      <div class="stat-value" id="hud-lives">❤️❤️❤️</div>
    </div>
  </div>
</div>

<div id="feedback"></div>

<!-- Challenge overlay - covers entire screen -->
<div id="challenge-overlay">
  <div id="challenge-box">
    <div id="challenge-question"></div>
    <div id="challenge-hint"></div>
    <div id="challenge-options"></div>
  </div>
</div>

<canvas id="canvas"></canvas>

<div id="level-complete">
  <h2 id="lc-title">LEVEL COMPLETE!</h2>
  <div class="stars" id="lc-stars">⭐⭐⭐</div>
  <div class="stats" id="lc-stats"></div>
  <button id="next-btn">NEXT LEVEL</button>
</div>

<div id="game-over">
  <h2>GAME OVER</h2>
  <div class="score" id="go-score">Score: 0</div>
  <button id="retry-btn">TRY AGAIN</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let gameRunning = false;
let selectedMode = 'patterns';
let level = 1;
let height = 0;
let score = 0;
let lives = 3;
let platforms = [];
let princess = { x: 0, y: 0, targetY: 0, jumping: false, jumpVel: 0 };
let particles = [];
let sparkles = [];
let cameraY = 0;
let currentChallenge = null;
let challengeActive = false;
let currentPlatformIndex = -1;
let streak = 0;

// ============ CHALLENGE GENERATORS ============

function generatePattern(difficulty) {
  const allPatterns = [
    { seq: ['🔴','🔵','🔴','🔵','🔴'], answer: '🔵', hint: 'Colors alternate' },
    { seq: ['🟢','🟡','🟢','🟡','🟢'], answer: '🟡', hint: 'Two colors switch' },
    { seq: ['🔴','🔴','🔵','🔴','🔴'], answer: '🔵', hint: 'Two red, one blue' },
    { seq: ['🟢','🟢','🟡','🟢','🟢'], answer: '🟡', hint: 'Two green, one yellow' },
    { seq: ['🔴','🔵','🟡','🔴','🔵'], answer: '🟡', hint: 'Three colors repeat' },
    { seq: ['⭐','❤️','🔵','⭐','❤️'], answer: '🔵', hint: 'Three shapes repeat' },
    { seq: ['🔴','🔵','🔵','🔴','🔵','🔵','🔴'], answer: '🔵', hint: 'One, then two' },
    { seq: ['🟡','🟡','🔴','🟡','🟡','🔴','🟡'], answer: '🟡', hint: 'Two, then one' },
    { seq: ['🟢','🔵','🔵','🟢','🔵','🔵','🟢'], answer: '🔵', hint: 'Watch the pattern' },
    { seq: ['🔴','🟡','🔴','🔴','🟡','🔴','🔴'], answer: '🟡', hint: 'It grows!' },
    { seq: ['🔵','🟢','🟢','🔵','🟢','🟢','🔵'], answer: '🟢', hint: 'One blue, two green' },
    { seq: ['🔴','🔴','🟡','🟡','🔵','🔵','🔴'], answer: '🔴', hint: 'Doubles' },
  ];
  
  let pool = allPatterns;
  if (difficulty <= 2) pool = allPatterns.filter(p => p.hint.includes('alternate') || p.hint.includes('switch'));
  else if (difficulty <= 4) pool = allPatterns.filter(p => !p.hint.includes('Doubles'));
  
  const pattern = pool[Math.floor(Math.random() * pool.length)];
  
  const allColors = ['🔴','🔵','🟢','🟡','🟣','🟠'];
  const opts = [pattern.answer];
  while (opts.length < 4) {
    const c = allColors[Math.floor(Math.random() * allColors.length)];
    if (!opts.includes(c)) opts.push(c);
  }
  shuffle(opts);
  
  return { question: pattern.seq.join(' '), hint: pattern.hint, answer: pattern.answer, options: opts };
}

function generateMath(difficulty) {
  let question, answer, hint;
  
  if (difficulty <= 2) {
    const a = randInt(2, 9);
    const b = randInt(2, 9);
    question = `${a} + ${b} = ?`;
    answer = a + b;
    hint = 'Add them together';
  } else if (difficulty <= 4) {
    const type = Math.random();
    if (type < 0.5) {
      const a = randInt(10, 20);
      const b = randInt(1, 9);
      question = `${a} + ${b} = ?`;
      answer = a + b;
      hint = 'Add them';
    } else {
      let a = randInt(8, 20);
      const b = randInt(2, a - 1);
      question = `${a} - ${b} = ?`;
      answer = a - b;
      hint = 'Subtract';
    }
  } else {
    const type = Math.random();
    if (type < 0.4) {
      const a = randInt(2, 6);
      const b = randInt(2, 6);
      question = `${a} × ${b} = ?`;
      answer = a * b;
      hint = 'Multiply';
    } else if (type < 0.7) {
      const a = randInt(5, 15);
      const b = randInt(2, 8);
      const c = randInt(1, 5);
      question = `${a} + ${b} - ${c} = ?`;
      answer = a + b - c;
      hint = 'Solve left to right';
    } else {
      const apples = randInt(8, 20);
      const give = randInt(2, apples - 2);
      question = `🍎 You have ${apples}\ngive away ${give}\nHow many left?`;
      answer = apples - give;
      hint = 'Subtract the ones you gave';
    }
  }
  
  const opts = generateNumberOptions(answer, 4);
  return { question, hint, answer: String(answer), options: opts.map(String) };
}

function generateWord(difficulty) {
  const words = [
    { word: 'CAT', display: 'C _ T', answer: 'A', hint: 'Says meow' },
    { word: 'DOG', display: 'D _ G', answer: 'O', hint: 'Says woof' },
    { word: 'SUN', display: 'S _ N', answer: 'U', hint: 'In the sky' },
    { word: 'BIG', display: 'B _ G', answer: 'I', hint: 'Not small' },
    { word: 'RED', display: 'R _ D', answer: 'E', hint: 'A color' },
    { word: 'FISH', display: 'F _ S H', answer: 'I', hint: 'Swims in water' },
    { word: 'BIRD', display: 'B _ R D', answer: 'I', hint: 'Can fly' },
    { word: 'STAR', display: 'S _ A R', answer: 'T', hint: 'Shines at night' },
    { word: 'MOON', display: 'M _ O N', answer: 'O', hint: 'Night light' },
    { word: 'BOOK', display: 'B _ O K', answer: 'O', hint: 'You read it' },
    { word: 'FROG', display: 'F _ O G', answer: 'R', hint: 'Says ribbit' },
    { word: 'CAKE', display: 'C _ K E', answer: 'A', hint: 'Birthday treat' },
    { word: 'TREE', display: 'T _ E E', answer: 'R', hint: 'Grows tall' },
    { word: 'HORSE', display: 'H _ R S E', answer: 'O', hint: 'You ride it' },
    { word: 'WATER', display: 'W _ T E R', answer: 'A', hint: 'You drink it' },
    { word: 'HOUSE', display: 'H _ U S E', answer: 'O', hint: 'Where you live' },
  ];
  
  let pool = words;
  if (difficulty <= 2) pool = words.filter(w => w.word.length <= 3);
  else if (difficulty <= 4) pool = words.filter(w => w.word.length <= 4);
  
  const word = pool[Math.floor(Math.random() * pool.length)];
  
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const opts = [word.answer];
  while (opts.length < 4) {
    const l = letters[Math.floor(Math.random() * letters.length)];
    if (!opts.includes(l)) opts.push(l);
  }
  shuffle(opts);
  
  return { question: word.display, hint: word.hint, answer: word.answer, options: opts };
}

function generateMemory(difficulty) {
  const emojis = ['🌟','🎈','🎀','🦋','🌈','🌺','🎪','🎠','🎡','🎢','🍕','🎸'];
  const len = Math.min(3 + Math.floor(difficulty / 2), 7);
  
  const seq = [];
  for (let i = 0; i < len; i++) {
    seq.push(emojis[Math.floor(Math.random() * emojis.length)]);
  }
  
  const askIdx = Math.floor(Math.random() * len);
  const ordinals = ['1st','2nd','3rd','4th','5th','6th','7th'];
  
  const correct = seq[askIdx];
  const opts = [correct];
  while (opts.length < 4) {
    const e = emojis[Math.floor(Math.random() * emojis.length)];
    if (!opts.includes(e)) opts.push(e);
  }
  shuffle(opts);
  
  return {
    question: seq.join(' '),
    hint: `What was the ${ordinals[askIdx]} one?`,
    answer: correct,
    options: opts,
    showTime: 1500 + len * 400
  };
}

// ============ HELPERS ============

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function generateNumberOptions(correct, count) {
  const opts = [correct];
  const offsets = [-3, -2, -1, 1, 2, 3, 4, -4];
  let i = 0;
  while (opts.length < count) {
    const v = correct + offsets[i % offsets.length];
    i++;
    if (v > 0 && !opts.includes(v)) opts.push(v);
  }
  shuffle(opts);
  return opts;
}

// ============ GAME STATE ============

function initLevel() {
  height = 0;
  cameraY = 0;
  platforms = [];
  particles = [];
  sparkles = [];
  lives = 3;
  streak = 0;
  challengeActive = false;
  currentPlatformIndex = -1;
  hideChallenge();
  
  const count = 5 + level * 2;
  for (let i = 0; i < count; i++) {
    platforms.push({
      x: W * 0.12 + Math.random() * W * 0.76,
      y: H - 100 - i * 140,
      width: 130,
      height: 28,
      climbed: false,
      bob: Math.random() * Math.PI * 2,
      hue: (i * 40) % 360
    });
  }
  
  princess.x = W * 0.5;
  princess.y = H - 80;
  princess.targetY = H - 80;
  princess.jumping = false;
  
  updateHUD();
}

function updateHUD() {
  document.getElementById('hud-height').textContent = `${Math.floor(height)}m`;
  document.getElementById('hud-score').textContent = score;
  let h = '';
  for (let i = 0; i < 3; i++) h += i < lives ? '❤️' : '🖤';
  document.getElementById('hud-lives').textContent = h;
  document.getElementById('hud-prompt').textContent = challengeActive ? 'Solve the puzzle!' : 'Tap the next platform!';
}

function showFeedback(text) {
  const el = document.getElementById('feedback');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

// ============ CHALLENGE FLOW ============

function showChallenge(idx) {
  if (challengeActive) return;
  challengeActive = true;
  currentPlatformIndex = idx;
  updateHUD();
  
  let ch;
  if (selectedMode === 'patterns') ch = generatePattern(level);
  else if (selectedMode === 'math') ch = generateMath(level);
  else if (selectedMode === 'words') ch = generateWord(level);
  else ch = generateMemory(level);
  
  currentChallenge = ch;
  
  if (selectedMode === 'memory') {
    // Show sequence first
    document.getElementById('challenge-question').textContent = ch.question;
    document.getElementById('challenge-hint').textContent = 'Memorize this!';
    document.getElementById('challenge-options').innerHTML = '';
    document.getElementById('challenge-overlay').classList.add('active');
    
    setTimeout(() => {
      document.getElementById('challenge-question').textContent = '❓';
      document.getElementById('challenge-hint').textContent = ch.hint;
      renderChallengeOptions(ch.options);
    }, ch.showTime);
  } else {
    document.getElementById('challenge-question').textContent = ch.question;
    document.getElementById('challenge-hint').textContent = ch.hint;
    renderChallengeOptions(ch.options);
    document.getElementById('challenge-overlay').classList.add('active');
  }
}

function renderChallengeOptions(options) {
  const container = document.getElementById('challenge-options');
  container.innerHTML = '';
  
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      handleAnswer(opt, btn);
    });
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      e.stopPropagation();
      handleAnswer(opt, btn);
    });
    container.appendChild(btn);
  });
}

function hideChallenge() {
  document.getElementById('challenge-overlay').classList.remove('active');
  challengeActive = false;
  currentChallenge = null;
  updateHUD();
}

function handleAnswer(answer, btn) {
  if (!challengeActive || !currentChallenge) return;
  
  // Disable all buttons immediately
  document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none');
  
  const correct = String(answer) === String(currentChallenge.answer);
  
  if (correct) {
    btn.classList.add('correct');
    streak++;
    const bonus = streak > 1 ? streak * 25 : 0;
    const pts = 100 + level * 20 + bonus;
    score += pts;
    height += 20;
    
    addCatchEffect(princess.x, princess.y, '#44ff44');
    const st = streak > 1 ? ` 🔥${streak}` : '';
    showFeedback(`+${pts}${st}`);
    
    setTimeout(() => {
      hideChallenge();
      
      const p = platforms[currentPlatformIndex];
      if (p) {
        p.climbed = true;
        princess.targetY = p.y - 20;
        princess.jumping = true;
        princess.jumpVel = -10;
        cameraY += 140;
      }
      
      updateHUD();
      
      if (platforms.filter(p => p.climbed).length >= platforms.length) {
        setTimeout(levelComplete, 500);
      }
    }, 700);
  } else {
    btn.classList.add('wrong');
    lives--;
    streak = 0;
    updateHUD();
    
    if (lives <= 0) {
      setTimeout(() => {
        hideChallenge();
        gameOver();
      }, 600);
    } else {
      showFeedback('❌');
      // Re-enable buttons after a moment
      setTimeout(() => {
        btn.classList.remove('wrong');
        document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'auto');
      }, 500);
    }
  }
}

function levelComplete() {
  gameRunning = false;
  const stars = lives === 3 ? '⭐⭐⭐' : lives === 2 ? '⭐⭐' : '⭐';
  document.getElementById('lc-title').textContent = `LEVEL ${level} DONE!`;
  document.getElementById('lc-stars').textContent = stars;
  document.getElementById('lc-stats').textContent = `Height: ${Math.floor(height)}m | Score: ${score}`;
  document.getElementById('level-complete').style.display = 'flex';
}

function gameOver() {
  gameRunning = false;
  document.getElementById('go-score').textContent = `Score: ${score} | Height: ${Math.floor(height)}m`;
  document.getElementById('game-over').style.display = 'flex';
}

function nextLevel() {
  level++;
  document.getElementById('level-complete').style.display = 'none';
  initLevel();
  gameRunning = true;
  gameLoop();
}

function retryGame() {
  level = 1;
  score = 0;
  document.getElementById('game-over').style.display = 'none';
  initLevel();
  gameRunning = true;
  gameLoop();
}

// ============ DRAWING ============

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0a3e');
  g.addColorStop(0.5, '#1a1a5e');
  g.addColorStop(1, '#2d0a3e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < 50; i++) {
    const x = (i * 137.5 + i * i * 7) % W;
    const y = (i * 89.3 + i * 31 + cameraY * 0.3) % (H * 2) - H * 0.5;
    ctx.beginPath();
    ctx.arc(x, y, 1 + (i % 2), 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.fillStyle = 'rgba(255,255,200,0.12)';
  ctx.beginPath();
  ctx.arc(W * 0.8, H * 0.1 - cameraY * 0.1, 50, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlatform(p) {
  const sy = p.y + cameraY;
  if (sy < -50 || sy > H + 50) return;
  
  p.bob += 0.03;
  const bob = Math.sin(p.bob) * 3;
  const x = p.x, y = sy + bob, w = p.width, h = p.height;
  
  const next = platforms.find(pp => !pp.climbed);
  const isNext = p === next && !challengeActive;
  
  if (isNext) {
    ctx.fillStyle = `hsla(${p.hue}, 70%, 50%, 0.25)`;
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h / 2, w * 0.7, 0, Math.PI * 2);
    ctx.fill();
    
    const ay = y - 25 + Math.sin(p.bob * 2) * 5;
    ctx.fillStyle = '#ffd700';
    ctx.font = '22px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('👇', x + w / 2, ay);
  }
  
  ctx.fillStyle = p.climbed ? '#555' : `hsl(${p.hue}, 70%, 50%)`;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 10);
  ctx.fill();
  
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(platforms.indexOf(p) + 1, x + w / 2, y + h / 2);
}

function drawPrincess() {
  const x = princess.x;
  const y = princess.y + cameraY;
  
  ctx.save();
  ctx.translate(x, y);
  
  ctx.fillStyle = '#ff6b9d';
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#ff4488';
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI);
  ctx.fill();
  
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.moveTo(-14, -20);
  ctx.lineTo(-10, -28);
  ctx.lineTo(-5, -20);
  ctx.lineTo(0, -30);
  ctx.lineTo(5, -20);
  ctx.lineTo(10, -28);
  ctx.lineTo(14, -20);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-7, -5, 5, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(7, -5, 5, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.stroke();
  
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 3, 6, 0.2, Math.PI - 0.2);
  ctx.stroke();
  
  ctx.restore();
}

function drawParticles() {
  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); return; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y + cameraY, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawSparkles() {
  sparkles.forEach((s, i) => {
    s.x += s.vx; s.y += s.vy; s.life -= 0.015;
    if (s.life <= 0) { sparkles.splice(i, 1); return; }
    ctx.globalAlpha = s.life;
    ctx.fillStyle = '#ffd700';
    ctx.font = `${18 + s.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✨', s.x, s.y + cameraY);
    ctx.globalAlpha = 1;
  });
}

function addCatchEffect(x, y, color) {
  for (let i = 0; i < 10; i++) {
    particles.push({ x, y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6-2, size: 4+Math.random()*5, life: 1, color: color||'#ffd700' });
  }
  for (let i = 0; i < 5; i++) {
    sparkles.push({ x: x+(Math.random()-0.5)*40, y: y+(Math.random()-0.5)*40, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, size: Math.random()*4, life: 1 });
  }
}

// ============ INPUT ============

function handleTap(x, y) {
  if (!gameRunning || challengeActive) return;
  
  const wy = y - cameraY;
  const next = platforms.find(p => !p.climbed);
  if (!next) return;
  
  const idx = platforms.indexOf(next);
  if (x >= next.x - 30 && x <= next.x + next.width + 30 &&
      wy >= next.y - 50 && wy <= next.y + next.height + 50) {
    princess.x += (next.x + next.width / 2 - princess.x) * 0.3;
    showChallenge(idx);
  }
}

canvas.addEventListener('mousedown', e => handleTap(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  handleTap(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMode = btn.dataset.mode;
  });
});

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  level = 1; score = 0;
  initLevel();
  gameRunning = true;
  gameLoop();
});

document.getElementById('next-btn').addEventListener('click', nextLevel);
document.getElementById('retry-btn').addEventListener('click', retryGame);

// ============ GAME LOOP ============

function gameLoop() {
  if (!gameRunning) return;
  
  drawSky();
  platforms.forEach(drawPlatform);
  drawParticles();
  drawSparkles();
  
  if (princess.jumping) {
    princess.y += princess.jumpVel;
    princess.jumpVel += 0.5;
    if (princess.y >= princess.targetY) {
      princess.y = princess.targetY;
      princess.jumping = false;
    }
  }
  drawPrincess();
  
  requestAnimationFrame(gameLoop);
}
</script>
