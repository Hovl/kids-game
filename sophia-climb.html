<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sophia's Color Climb!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  height: 100vh;
  width: 100vw;
  background: #1a1a4e;
  touch-action: manipulation;
}
canvas { display: block; }

#start-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100;
  background: linear-gradient(180deg, #0a0a3e 0%, #1a1a5e 50%, #2d0a3e 100%);
}
#start-screen h1 {
  font-size: 42px; font-weight: 900;
  color: #ff6b9d;
  text-align: center; line-height: 1.3;
  text-shadow: 0 0 30px rgba(255,107,157,0.4);
  margin-bottom: 10px;
}
.hero-display { font-size: 100px; margin: 15px 0; animation: heroBounce 2s ease-in-out infinite; }
@keyframes heroBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
.subtitle { font-size: 22px; color: #ff8888; margin-bottom: 20px; text-align: center; }
.mode-select { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
.mode-btn {
  font-size: 20px; font-weight: 700; padding: 15px 30px; border: 3px solid rgba(255,255,255,0.2);
  border-radius: 30px; background: rgba(255,255,255,0.05); color: #fff;
  cursor: pointer; pointer-events: auto; transition: all 0.3s;
}
.mode-btn:hover { background: rgba(255,255,255,0.15); }
.mode-btn.selected { border-color: #ffd700; background: rgba(255,215,0,0.15); box-shadow: 0 0 20px rgba(255,215,0,0.3); }

#start-btn {
  font-size: 36px; font-weight: 800; padding: 18px 55px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff4488);
  color: white; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4);
  transition: transform 0.2s; animation: pulse 2s ease-in-out infinite;
}
#start-btn:hover { transform: scale(1.08); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: none; flex-direction: column; align-items: center;
  padding: 15px 20px; z-index: 10; pointer-events: none;
}
#hud .prompt {
  font-size: 28px; font-weight: 900; color: #fff;
  text-shadow: 0 0 20px rgba(255,255,255,0.5);
  text-align: center; margin-bottom: 5px;
}
#hud .progress {
  font-size: 24px; color: #ffd700; font-weight: 700;
  text-shadow: 0 0 15px rgba(255,215,0,0.5);
}
#hud .height {
  font-size: 18px; color: #ff8888; font-weight: 600;
  margin-top: 5px;
}

/* Feedback */
#feedback {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 64px; font-weight: 900; color: #ffd700;
  text-shadow: 0 0 40px rgba(255,215,0,0.8);
  z-index: 50; pointer-events: none;
  opacity: 0; transition: opacity 0.3s;
}
#feedback.show { opacity: 1; animation: feedbackPop 0.8s ease-out; }
@keyframes feedbackPop {
  0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
  50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}

/* Level complete */
#level-complete {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100;
  background: rgba(26,10,60,0.95); backdrop-filter: blur(10px);
}
#level-complete h2 { font-size: 48px; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.5); margin-bottom: 10px; }
#level-complete .message { font-size: 24px; color: #ff8888; margin-bottom: 25px; text-align: center; }
#next-btn {
  font-size: 28px; font-weight: 800; padding: 16px 50px; border: none;
  border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #ff4488);
  color: #fff; cursor: pointer; pointer-events: auto;
  box-shadow: 0 8px 30px rgba(255,107,157,0.4); transition: transform 0.2s;
}
#next-btn:hover { transform: scale(1.08); }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Sophia's<br>Color Climb!</h1>
  <div class="hero-display">👸</div>
  <div class="subtitle">Climb the rainbow tower!</div>
  
  <div class="mode-select">
    <div class="mode-btn selected" data-mode="colors">🌈 Colors</div>
    <div class="mode-btn" data-mode="numbers">🔢 Numbers</div>
    <div class="mode-btn" data-mode="shapes">⭐ Shapes</div>
  </div>
  
  <button id="start-btn">CLIMB!</button>
</div>

<div id="hud">
  <div class="prompt" id="hud-prompt">Tap the RED step!</div>
  <div class="progress" id="hud-progress">Floor 1</div>
  <div class="height" id="hud-height">Height: 0m</div>
</div>

<div id="feedback"></div>

<canvas id="canvas"></canvas>

<div id="level-complete">
  <h2 id="lc-title">TOP OF THE TOWER!</h2>
  <div class="message" id="lc-message">You climbed so high!</div>
  <button id="next-btn">CLIMB AGAIN!</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let gameRunning = false;
let selectedMode = 'colors';
let level = 1;
let height = 0;
let currentStep = 0;
let totalSteps = 10;
let platforms = [];
let princess = { x: 0, y: 0, targetY: 0, jumping: false, jumpVel: 0 };
let particles = [];
let sparkles = [];
let cameraY = 0;

// Colors
const COLORS = [
  { name: 'RED', hex: '#ff4444' },
  { name: 'BLUE', hex: '#4488ff' },
  { name: 'GREEN', hex: '#44ff44' },
  { name: 'YELLOW', hex: '#ffdd44' },
  { name: 'PURPLE', hex: '#cc44ff' },
  { name: 'ORANGE', hex: '#ff8844' },
  { name: 'PINK', hex: '#ff88cc' }
];

// Shapes
const SHAPES = [
  { name: 'CIRCLE', draw: 'circle' },
  { name: 'SQUARE', draw: 'square' },
  { name: 'TRIANGLE', draw: 'triangle' },
  { name: 'STAR', draw: 'star' },
  { name: 'HEART', draw: 'heart' }
];

function initLevel() {
  currentStep = 0;
  height = 0;
  cameraY = 0;
  platforms = [];
  particles = [];
  sparkles = [];
  
  // Generate platforms going up
  const platformCount = 8 + level * 2;
  for (let i = 0; i < platformCount; i++) {
    const isTarget = i === currentStep;
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    const number = Math.floor(Math.random() * 9) + 1;
    
    platforms.push({
      x: W * 0.2 + Math.random() * W * 0.6,
      y: H - 100 - i * 120,
      width: 120,
      height: 25,
      color: color,
      shape: shape,
      number: number,
      isTarget: isTarget,
      climbed: false,
      bobPhase: Math.random() * Math.PI * 2
    });
  }
  
  // Set princess starting position
  princess.x = W * 0.5;
  princess.y = H - 80;
  princess.targetY = H - 80;
  princess.jumping = false;
  
  // Set initial prompt
  updatePrompt();
}

function updatePrompt() {
  const platform = platforms[currentStep];
  if (!platform) return;
  
  if (selectedMode === 'colors') {
    document.getElementById('hud-prompt').textContent = `Tap the ${platform.color.name} step!`;
  } else if (selectedMode === 'numbers') {
    document.getElementById('hud-prompt').textContent = `Tap number ${platform.number}!`;
  } else if (selectedMode === 'shapes') {
    document.getElementById('hud-prompt').textContent = `Tap the ${platform.shape.name}!`;
  }
  
  document.getElementById('hud-progress').textContent = `Step ${currentStep + 1} / ${totalSteps}`;
  document.getElementById('hud-height').textContent = `Height: ${Math.floor(height)}m`;
}

function drawSky() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, '#0a0a3e');
  gradient.addColorStop(0.5, '#1a1a5e');
  gradient.addColorStop(1, '#2d0a3e');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
  
  // Stars
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  for (let i = 0; i < 40; i++) {
    const x = (i * 137.5 + i * i * 7) % W;
    const y = (i * 89.3 + i * 31 + cameraY * 0.3) % (H * 2) - H * 0.5;
    ctx.beginPath();
    ctx.arc(x, y, 1 + (i % 2), 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Moon
  ctx.fillStyle = 'rgba(255, 255, 200, 0.15)';
  ctx.beginPath();
  ctx.arc(W * 0.8, H * 0.1 - cameraY * 0.1, 50, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlatform(platform, index) {
  const screenY = platform.y + cameraY;
  
  // Skip if off screen
  if (screenY < -50 || screenY > H + 50) return;
  
  platform.bobPhase += 0.03;
  const bob = Math.sin(platform.bobPhase) * 3;
  
  const x = platform.x;
  const y = screenY + bob;
  const w = platform.width;
  const h = platform.height;
  
  // Glow if target
  if (platform.isTarget && !platform.climbed) {
    ctx.fillStyle = platform.color.hex + '33';
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h / 2, w * 0.8, 0, Math.PI * 2);
    ctx.fill();
    
    // Pulsing ring
    const pulseSize = w * 0.7 + Math.sin(platform.bobPhase * 2) * 10;
    ctx.strokeStyle = platform.color.hex + '88';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h / 2, pulseSize, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Platform body
  ctx.fillStyle = platform.climbed ? '#444' : platform.color.hex;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 8);
  ctx.fill();
  
  // Darker edge
  ctx.fillStyle = platform.climbed ? '#333' : platform.color.hex + 'cc';
  ctx.beginPath();
  ctx.roundRect(x, y + h * 0.6, w, h * 0.4, [0, 0, 8, 8]);
  ctx.fill();
  
  // Content based on mode
  if (selectedMode === 'colors') {
    // Color name
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(platform.color.name, x + w / 2, y + h / 2);
  } else if (selectedMode === 'numbers') {
    // Number
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(platform.number, x + w / 2, y + h / 2);
  } else if (selectedMode === 'shapes') {
    // Shape
    drawShape(x + w / 2, y + h / 2, platform.shape.draw, 12, '#fff');
  }
}

function drawShape(x, y, shape, size, color) {
  ctx.fillStyle = color;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  
  if (shape === 'circle') {
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  } else if (shape === 'square') {
    ctx.fillRect(x - size, y - size, size * 2, size * 2);
  } else if (shape === 'triangle') {
    ctx.beginPath();
    ctx.moveTo(x, y - size);
    ctx.lineTo(x - size, y + size);
    ctx.lineTo(x + size, y + size);
    ctx.closePath();
    ctx.fill();
  } else if (shape === 'star') {
    drawStar(x, y, 5, size, size * 0.5);
    ctx.fill();
  } else if (shape === 'heart') {
    drawHeart(x, y, size);
    ctx.fill();
  }
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
  let rot = Math.PI / 2 * 3;
  let step = Math.PI / spikes;
  
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
}

function drawHeart(cx, cy, size) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + size * 0.3);
  ctx.bezierCurveTo(cx + size, cy - size * 0.5, cx + size * 0.5, cy - size, cx, cy - size * 0.5);
  ctx.bezierCurveTo(cx - size * 0.5, cy - size, cx - size, cy - size * 0.5, cx, cy + size * 0.3);
  ctx.closePath();
}

function drawPrincess() {
  const x = princess.x;
  const y = princess.y + cameraY;
  
  ctx.save();
  ctx.translate(x, y);
  
  // Body
  ctx.fillStyle = '#ff6b9d';
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI * 2);
  ctx.fill();
  
  // Dress bottom
  ctx.fillStyle = '#ff4488';
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI);
  ctx.fill();
  
  // Crown
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.moveTo(-12, -18);
  ctx.lineTo(-8, -25);
  ctx.lineTo(-4, -18);
  ctx.lineTo(0, -28);
  ctx.lineTo(4, -18);
  ctx.lineTo(8, -25);
  ctx.lineTo(12, -18);
  ctx.closePath();
  ctx.fill();
  
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-6, -4, 4, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(6, -4, 4, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
  
  // Smile
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 2, 5, 0.2, Math.PI - 0.2);
  ctx.stroke();
  
  ctx.restore();
}

function drawParticles() {
  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= 0.02;
    
    if (p.life <= 0) { particles.splice(i, 1); return; }
    
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y + cameraY, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawSparkles() {
  sparkles.forEach((s, i) => {
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 0.015;
    
    if (s.life <= 0) { sparkles.splice(i, 1); return; }
    
    ctx.globalAlpha = s.life;
    ctx.fillStyle = '#ffd700';
    ctx.font = `${20 + s.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✨', s.x, s.y + cameraY);
    ctx.globalAlpha = 1;
  });
}

function addCatchEffect(x, y, color) {
  for (let i = 0; i < 10; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      size: 4 + Math.random() * 5,
      life: 1,
      color: color || '#ffd700'
    });
  }
  
  for (let i = 0; i < 5; i++) {
    sparkles.push({
      x: x + (Math.random() - 0.5) * 40,
      y: y + (Math.random() - 0.5) * 40,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      size: Math.random() * 4,
      life: 1
    });
  }
}

function showFeedback(text) {
  const el = document.getElementById('feedback');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function handleTap(x, y) {
  if (!gameRunning) return;
  
  // Convert tap to world coordinates
  const worldY = y - cameraY;
  
  // Check if tapped a platform
  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    if (p.climbed) continue;
    
    // Check if tap is on this platform
    if (x >= p.x && x <= p.x + p.width &&
        worldY >= p.y && worldY <= p.y + p.height) {
      
      if (i === currentStep) {
        // Correct platform!
        p.climbed = true;
        currentStep++;
        height += 15;
        
        // Move princess
        princess.targetY = p.y - 20;
        princess.jumping = true;
        princess.jumpVel = -8;
        
        // Camera follows
        cameraY += 120;
        
        addCatchEffect(p.x + p.width / 2, p.y, p.color.hex);
        showFeedback('YES! ✨');
        
        // Check if level complete
        if (currentStep >= totalSteps) {
          setTimeout(levelComplete, 500);
        } else {
          updatePrompt();
        }
      } else {
        // Wrong platform - gentle feedback
        showFeedback('Try this one!');
        // Highlight the correct one briefly
        platforms[currentStep].bobPhase += 2;
      }
      
      return;
    }
  }
}

function levelComplete() {
  gameRunning = false;
  
  const messages = {
    colors: 'You know your colors!',
    numbers: 'You can count!',
    shapes: 'You know your shapes!'
  };
  
  document.getElementById('lc-title').textContent = 'TOP OF THE TOWER! 🏆';
  document.getElementById('lc-message').textContent = messages[selectedMode];
  document.getElementById('level-complete').style.display = 'flex';
}

function nextLevel() {
  level++;
  document.getElementById('level-complete').style.display = 'none';
  initLevel();
  gameRunning = true;
  gameLoop();
}

// Main game loop
function gameLoop() {
  if (!gameRunning) return;
  
  drawSky();
  
  // Draw platforms
  platforms.forEach((p, i) => drawPlatform(p, i));
  
  // Draw particles
  drawParticles();
  drawSparkles();
  
  // Update and draw princess
  if (princess.jumping) {
    princess.y += princess.jumpVel;
    princess.jumpVel += 0.5;
    if (princess.y >= princess.targetY) {
      princess.y = princess.targetY;
      princess.jumping = false;
    }
  }
  drawPrincess();
  
  requestAnimationFrame(gameLoop);
}

// Event handlers
canvas.addEventListener('mousedown', (e) => { handleTap(e.clientX, e.clientY); });
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  handleTap(t.clientX, t.clientY);
}, { passive: false });

// Mode selection
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMode = btn.dataset.mode;
  });
});

// Start button
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  level = 1;
  initLevel();
  gameRunning = true;
  gameLoop();
});

// Next level button
document.getElementById('next-btn').addEventListener('click', nextLevel);
</script>
</body>
</html>
